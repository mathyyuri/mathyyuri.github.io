<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제은행 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>document.write('<script src="hwpx-lib.js?v=' + Date.now() + '"><\/script>');</script>
<style>
:root { --bg: #fdfbf7; --card: #ffffff; --dark: #3a3530; --gold: #c8a84b; --gold-deep: #a8853f; --line: #eae5da; --pink-deep: #c64e71; --mint-deep: #5b8a80; --blue: #4a6fa5; }
* { box-sizing: border-box; }
.hidden { display: none !important; }
body { font-family: 'Poppins', 'Noto Serif KR', serif; background: var(--bg); color: var(--dark); margin: 0; padding: 20px 16px 60px; }
.wrap { max-width: 960px; margin: 0 auto; }
h1 { text-align: center; font-family: 'Noto Serif KR'; font-size: 1.3rem; margin: 0 0 4px; }
.sub { text-align: center; font-size: 0.75rem; color: #999; letter-spacing: 1px; margin: 0 0 26px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.card h2 { font-family: 'Noto Serif KR'; font-size: 1.05rem; margin: 0 0 12px; color: var(--gold-deep); }
.fieldRow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.fieldRow label { font-size: 0.8rem; color: #777; font-weight: 700; }
.fieldRow input[type=text], .fieldRow input[type=password], .fieldRow input[type=number] { padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 0.88rem; font-family: inherit; }
.fieldRow input.grow { flex: 1; min-width: 160px; }
button { background: var(--dark); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
button:disabled { background: #bbb; cursor: default; }
button.sec { background: #fff; color: var(--dark); border: 1px solid var(--line); }
.msg { font-size: 0.8rem; margin-top: 8px; min-height: 16px; line-height: 1.6; }
.msg.err { color: var(--pink-deep); }
.msg.ok { color: var(--mint-deep); }
.hint { font-size: 0.78rem; color: #999; line-height: 1.6; }
.qRow { border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; }
.qRow.off { opacity: 0.4; }
.qRow .qNum { flex: 0 0 96px; font-weight: 700; color: var(--gold-deep); font-size: 0.9rem; }
.qRow .qBody { flex: 1 1 260px; min-width: 0; font-size: 0.86rem; line-height: 1.6; }
.qRow .qBody img { max-width: 160px; max-height: 120px; }
.qRow .qAns { flex: 0 0 110px; margin-left: auto; }
.qRow .qAns input[type=text], .qRow .qAns select { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid #ddd; font-family: inherit; font-size: 0.85rem; }
.typeBadge { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-top: 3px; }
.typeBadge.choice { background: #eaf4f0; color: var(--mint-deep); }
.typeBadge.short { background: #fbf6ea; color: var(--gold-deep); }
.warnBadge { font-size: 0.7rem; color: var(--pink-deep); display: block; margin-top: 3px; }
.okBadge { font-size: 0.7rem; color: var(--mint-deep); display: block; margin-top: 3px; }
.srcBadge { font-size: 0.7rem; color: var(--blue); display: block; margin-top: 3px; word-break: break-all; }
.useChk { font-size: 0.72rem; color: #888; display: block; margin-top: 4px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 문제은행 관리</h1>
  <p class="sub">MATHY YURI · DAECHI ACADEMY (강사 전용) — 문제를 올려두면 교재 · 오답 · 정답률에 함께 쓰는 새 문제은행이에요</p>

  <div class="card" id="loginCard">
    <div class="fieldRow">
      <input type="password" id="keyInput" class="grow" placeholder="원장님 비밀번호" autocomplete="off">
      <button type="button" id="loginBtn">확인</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>1. hwpx 업로드 → 자동 인식</h2>
      <p class="hint">
        hwpx 파일 안의 문제 번호를 그대로 인식해요. 선지가 있으면 객관식, 없으면 주관식이에요. <b>[정답]</b> 표시가 있으면 정답도 자동으로 채워요.<br>
        <b>같은 기출 문제</b>(예: "2025년 10월 고1 14번")가 다른 파일에 또 있어도 <b>하나의 문제로 합쳐서</b> 저장해요. 이때 나중에 올린 내용이 앞의 내용을 덮어써요.
      </p>
      <div class="fieldRow">
        <label>단원</label><input type="text" id="unitInput" placeholder="예: 도형의 방정식" style="width:180px">
        <label>분류</label><input type="text" id="catInput" placeholder="예: 기출" style="width:120px">
        <label>배점</label><input type="number" id="pointsInput" value="4" min="1" max="20" style="width:70px">
      </div>
      <div class="fieldRow">
        <label>파일 이름(구분용)</label><input type="text" id="fileNameInput" class="grow" placeholder="hwpx를 고르면 자동으로 채워져요">
      </div>
      <input type="file" id="fileInput" accept=".hwpx">
      <div class="msg" id="parseMsg"></div>
      <div id="reviewToolbar" class="toolbar hidden">
        <button type="button" class="sec" id="checkAllBtn">전체 선택</button>
        <button type="button" class="sec" id="uncheckAllBtn">전체 해제</button>
        <button type="button" class="sec" id="noAnsOffBtn">정답 없는 문제 제외</button>
      </div>
      <div id="reviewList"></div>
      <div id="saveRow" class="hidden" style="margin-top:14px">
        <button type="button" id="saveBtn">문제은행에 저장</button>
        <div class="msg" id="saveMsg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://eqllmvfbcdtzercliicy.supabase.co/functions/v1';
const SB_KEY = 'sb_publishable_OcoOR7ERpt8BFBLuQ2CoWw_lELDDCEV'; // 공개해도 안전한 키 (관리자 비밀번호는 서버에서 확인)
let adminKey = '';
let parsed = []; // [{num, type, stemHtml, choices, answer, quickAnswer, explanation, examSource, warning, prefilled, use}]

function $(id) { return document.getElementById(id); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function stripTags(s) { return String(s || '').replace(/<[^>]+>/g, ''); }
function renderMath(el) {
  if (window.renderMathInElement) { try { renderMathInElement(el, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {} }
}

// 서버(save-problems)와 같은 규칙으로 "2025년 10월 고1 14번" 같은 출처를 뽑아 화면에 미리 보여준다.
// 학년·번호가 수식(\(1\) \(14\))으로 들어있어도 읽히도록 수식 표시를 벗기고 본다.
function extractExamSource(stemHtml) {
  const text = stripTags(stemHtml).replace(/\\[()]/g, ' ').replace(/\s+/g, ' ');
  const m = text.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*고\s*(\d)\s*(문과|이과)?\s*(\d{1,3})\s*번/);
  if (!m) return '';
  const [, year, month, grade, track, num] = m;
  return `${year}-${Number(month)}-고${grade}${track ? '-' + track : ''}-${Number(num)}`;
}

async function sbPost(fn, body) {
  const res = await fetch(`${SB_URL}/${fn}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY },
    body: JSON.stringify(body),
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || !data || data.ok === false) throw new Error((data && data.error) || ('서버 오류 ' + res.status));
  return data;
}

// 비밀번호는 저장할 때 서버가 확인해요. 여기서는 빈칸만 막고 화면을 열어줍니다.
$('loginBtn').addEventListener('click', async () => {
  const key = $('keyInput').value.trim();
  const msg = $('loginMsg');
  if (!key) { msg.textContent = '비밀번호를 입력하세요.'; msg.className = 'msg err'; return; }
  msg.textContent = '확인 중...'; msg.className = 'msg';
  try {
    // 빈 목록을 보내서 비밀번호만 검사 (저장되는 건 없음)
    // 서버는 비밀번호부터 확인하므로, 맞으면 "문항이 없습니다"가, 틀리면 "인증 실패"가 돌아온다.
    let authed = false;
    try { await sbPost('save-problems', { admin_key: key, problems: [] }); authed = true; }
    catch (e) { if (String(e.message).includes('문항이 없')) authed = true; else throw e; }
    if (!authed) return;
    adminKey = key;
    $('loginCard').classList.add('hidden');
    $('app').classList.remove('hidden');
  } catch (e) {
    msg.textContent = '확인 실패: ' + e.message; msg.className = 'msg err';
  }
});
$('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

// hwpx-lib.js의 formatChoiceRow가 만드는 choiceItem 스팬을 뽑는다 (cs100admin.html과 동일).
function extractChoiceItemSpans(html) {
  const openTag = '<span class="choiceItem">';
  const out = [];
  let i = 0;
  while (true) {
    const start = html.indexOf(openTag, i);
    if (start === -1) break;
    let depth = 1;
    let pos = start + openTag.length;
    const tagRe = /<span\b[^>]*>|<\/span>/g;
    tagRe.lastIndex = pos;
    let end = -1, m;
    while ((m = tagRe.exec(html))) {
      if (m[0] === '</span>') { depth--; if (depth === 0) { end = m.index; break; } }
      else depth++;
    }
    if (end === -1) break;
    out.push(html.slice(pos, end));
    i = end + '</span>'.length;
  }
  return out;
}

$('fileInput').addEventListener('change', async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  $('fileNameInput').value = file.name.replace(/\.hwpx$/i, '');
  const msgEl = $('parseMsg');
  msgEl.textContent = '파싱 중... (파일이 크면 조금 걸려요)'; msgEl.className = 'msg';
  $('reviewList').innerHTML = ''; $('saveRow').classList.add('hidden'); $('reviewToolbar').classList.add('hidden');
  try {
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const entry = await parseHwpx(zip);
    const nums = [...entry.markers.keys()].map(Number).sort((a, b) => a - b);
    if (!nums.length) { msgEl.textContent = '문제를 하나도 찾지 못했습니다.'; msgEl.className = 'msg err'; return; }
    parsed = [];
    for (const num of nums) {
      const marker = entry.markers.get(String(num)) || entry.markers.get(num);
      const html = await hwpBodyXmlToHtml(marker.blockXml, entry);
      const choices = extractChoiceItemSpans(html);
      const type = choices.length ? 'choice' : 'short';
      // 출처 태그의 학년·번호가 한 수식 안에 "1 14"로 들어있으면 붙어 보이므로 둘로 쪼갠다 (cs100admin.html과 동일).
      const stemHtml = html
        .replace(/<div class="choiceRow"[^>]*>[\s\S]*?<\/div>/g, '')
        .replace(/<span class="eq">\\\(([1-3])\s+(\d{1,3})\\\)<\/span>/g, '<span class="eq">\\($1\\)</span> <span class="eq">\\($2\\)</span>')
        .trim();
      const answerXml = extractQuickAnswerXml(marker.blockXml);
      const quickAnswer = answerXml ? await hwpFragmentRunsToHtml(answerXml, entry) : '';
      const explXml = extractEndnoteFullBodyXml(marker.blockXml);
      const explanation = explXml ? await hwpBodyXmlToHtml(explXml, entry) : '';
      parsed.push({
        num, type, stemHtml, choices, answer: '', quickAnswer, explanation, prefilled: false, use: true,
        examSource: extractExamSource(stemHtml),
        warning: type === 'choice' && choices.length !== 5 ? `선택지 ${choices.length}개 인식됨(5개 기대)` : '',
      });
    }
    // [정답] 표시에서 자동으로 채운다.
    let filled = 0;
    parsed.forEach(q => {
      const t = stripTags(q.quickAnswer).replace(/\\[()]/g, ' ');
      if (q.type === 'choice') {
        const m = t.match(/\[\s*정답\s*\]\s*([①②③④⑤]|[1-5])/);
        if (!m) return;
        const a = '①②③④⑤'.indexOf(m[1]) >= 0 ? '①②③④⑤'.indexOf(m[1]) + 1 : Number(m[1]);
        if (a >= 1 && a <= q.choices.length) { q.answer = String(a); q.prefilled = true; filled++; }
      } else {
        const m = t.match(/\[\s*정답\s*\]\s*([-\d./,\s]+)/);
        if (!m) return;
        const a = m[1].trim().replace(/\s+/g, ' ');
        if (a) { q.answer = a; q.prefilled = true; filled++; }
      }
    });
    updateSummary(`${nums.length}문제 인식 완료 (정답 자동 채움 ${filled}개).`);
    renderReview();
    $('saveRow').classList.remove('hidden'); $('reviewToolbar').classList.remove('hidden');
  } catch (e) {
    console.error(e);
    msgEl.textContent = '파싱 실패: ' + (e.message || String(e));
    msgEl.className = 'msg err';
  }
});

function updateSummary(prefix) {
  const warnCount = parsed.filter(q => q.warning).length;
  const noAns = parsed.filter(q => q.use && !q.answer).length;
  const withSrc = parsed.filter(q => q.examSource).length;
  const used = parsed.filter(q => q.use).length;
  const msgEl = $('parseMsg');
  msgEl.textContent = `${prefix || ''} 저장 대상 ${used}개 · 정답 미입력 ${noAns}개 · 출처 인식 ${withSrc}개` + (warnCount ? ` · ⚠️ 선택지 확인 필요 ${warnCount}건` : '');
  msgEl.className = (!warnCount && !noAns) ? 'msg ok' : 'msg err';
}

function renderReview() {
  const wrap = $('reviewList');
  wrap.innerHTML = '';
  const seen = new Map();
  parsed.forEach(q => { if (q.examSource) seen.set(q.examSource, (seen.get(q.examSource) || 0) + 1); });
  parsed.forEach(q => {
    const row = document.createElement('div');
    row.className = 'qRow' + (q.use ? '' : ' off');
    const ansInput = q.type === 'choice'
      ? `<select class="ansInput" data-num="${q.num}">` + ['', 1, 2, 3, 4, 5].map(v => `<option value="${v}"${String(q.answer) === String(v) ? ' selected' : ''}>${v === '' ? '선택' : v + '번'}</option>`).join('') + `</select>`
      : `<input type="text" class="ansInput" data-num="${q.num}" value="${escapeHtml(q.answer)}" placeholder="정답">`;
    row.innerHTML = `
      <div class="qNum">${q.num}번<br><span class="typeBadge ${q.type}">${q.type === 'choice' ? '객관식' : '주관식'}</span>
        ${q.warning ? `<span class="warnBadge">${escapeHtml(q.warning)}</span>` : ''}
        ${q.prefilled ? `<span class="okBadge">✓ 정답 자동채움</span>` : ''}
        ${q.examSource ? `<span class="srcBadge">🔗 ${escapeHtml(q.examSource)}${seen.get(q.examSource) > 1 ? ' (파일 안 중복!)' : ''}</span>` : ''}
        <label class="useChk"><input type="checkbox" class="useBox" data-num="${q.num}"${q.use ? ' checked' : ''}> 저장</label>
      </div>
      <div class="qBody">${q.stemHtml}${q.choices.length ? '<div style="margin-top:4px;font-size:0.8rem;color:#777">' + q.choices.map(c => stripTags(c).slice(0, 26)).join(' &nbsp; ') + '</div>' : ''}</div>
      <div class="qAns">${ansInput}</div>
    `;
    wrap.appendChild(row);
  });
  const find = el => parsed.find(x => x.num === Number(el.dataset.num));
  wrap.querySelectorAll('.ansInput').forEach(el => {
    const upd = () => { const q = find(el); if (q) { q.answer = el.value.trim(); updateSummary(); } };
    el.addEventListener('input', upd); el.addEventListener('change', upd);
  });
  wrap.querySelectorAll('.useBox').forEach(el => {
    el.addEventListener('change', () => {
      const q = find(el);
      if (!q) return;
      q.use = el.checked;
      el.closest('.qRow').classList.toggle('off', !q.use);
      updateSummary();
    });
  });
  renderMath(wrap);
}

$('checkAllBtn').addEventListener('click', () => { parsed.forEach(q => q.use = true); renderReview(); updateSummary(); });
$('uncheckAllBtn').addEventListener('click', () => { parsed.forEach(q => q.use = false); renderReview(); updateSummary(); });
$('noAnsOffBtn').addEventListener('click', () => { parsed.forEach(q => { if (!q.answer) q.use = false; }); renderReview(); updateSummary(); });

$('saveBtn').addEventListener('click', async () => {
  const msg = $('saveMsg');
  const targets = parsed.filter(q => q.use);
  if (!targets.length) { msg.textContent = '저장할 문제가 없어요.'; msg.className = 'msg err'; return; }
  const missing = targets.filter(q => !q.answer);
  if (missing.length) {
    msg.textContent = `정답이 없는 문제가 ${missing.length}개 있어요 (번호: ${missing.map(q => q.num).slice(0, 15).join(', ')}${missing.length > 15 ? ' 외' : ''}). 정답을 채우거나 "저장" 체크를 풀어주세요. 정답이 없으면 채점할 수 없어요.`;
    msg.className = 'msg err';
    return;
  }
  const sourceFile = ($('fileNameInput').value.trim() || 'unnamed') + '.hwpx';
  const unit = $('unitInput').value.trim() || null;
  const category = $('catInput').value.trim() || null;
  const points = Number($('pointsInput').value) || 4;
  const rows = targets.map(q => ({
    source_file: sourceFile, source_num: q.num, type: q.type,
    stem_html: q.stemHtml, choices: q.choices, answer: q.answer,
    quick_answer: q.quickAnswer || null, explanation: q.explanation || null,
    unit, category, points,
  }));
  // 그림이 많은 문제는 용량이 커서 조금씩 나눠 보낸다 (묶음당 최대 10문제 또는 약 1.5MB).
  const chunks = [];
  let cur = [], curSize = 0;
  rows.forEach(r => {
    const sz = JSON.stringify(r).length;
    if (cur.length && (cur.length >= 10 || curSize + sz > 1500000)) { chunks.push(cur); cur = []; curSize = 0; }
    cur.push(r); curSize += sz;
  });
  if (cur.length) chunks.push(cur);

  $('saveBtn').disabled = true;
  let saved = 0, withSrc = 0;
  try {
    for (let i = 0; i < chunks.length; i++) {
      msg.textContent = `저장 중... (${i + 1}/${chunks.length} 묶음)`; msg.className = 'msg';
      const r = await sbPost('save-problems', { admin_key: adminKey, problems: chunks[i] });
      saved += r.saved || 0; withSrc += r.matchedBySource || 0;
    }
    msg.textContent = `✅ ${saved}문제를 문제은행에 저장했어요. (출처가 인식돼서 같은 기출끼리 합쳐지는 문제 ${withSrc}개)`;
    msg.className = 'msg ok';
  } catch (e) {
    msg.textContent = `저장 실패 (${saved}문제까지는 저장됨): ` + e.message; msg.className = 'msg err';
  }
  $('saveBtn').disabled = false;
});
</script>
<script src="mathfix.js?v=1"></script>
</body>
</html>
