<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일일일모 RANKING | MATHY YURI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg: #fdfbf7;
  --dark: #3a3530;
  --gold: #c8a84b;
  --shadow: 0 10px 30px rgba(58,53,48,0.07);
  /* S/S+ 반 색 — 원장님 요청으로 예전보다 훨씬 선명하게(파스텔 대신 진한
     톤+흰 글씨) 눈에 확 띄도록 바꿈. S+는 진한 로즈, S는 진한 그린으로
     한눈에 구분. */
  --s-plus-bg: #d63c63;
  --s-plus-text: #ffffff;
  --s-bg: #2f9e5c;
  --s-text: #ffffff;
}
* { box-sizing: border-box; }
body { font-family: 'Poppins', 'Noto Serif KR', serif; background: var(--bg); color: var(--dark); margin: 0; padding: 0; }
.container { max-width: 1500px; margin: 0 auto; padding: 30px 15px 80px; }

.backLink { display: block; text-align: center; font-size: 0.78rem; color: #aaa; text-decoration: none; margin-bottom: 18px; }
.backLink:hover { color: var(--gold); }

header { text-align: center; margin-bottom: 50px; }
header h1 { font-size: clamp(1.4rem, 5vw, 2.5rem); letter-spacing: 4px; font-weight: 700; margin: 0 0 5px; }
header p  { font-size: 0.75rem; opacity: 0.4; letter-spacing: 2px; margin: 0; }

/* 명예의 전당 섹션 */
.honor-section { text-align: center; margin-bottom: 60px; }
.honor-section h2 { font-family: 'Noto Serif KR'; font-size: 1.1rem; letter-spacing: 5px; color: var(--gold); margin-bottom: 40px; font-weight: 700; }

.honor-podium {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: stretch;
  gap: 10px;
}

.podium-card {
  flex: 1;
  min-width: 0;
  max-width: 320px;
  border-radius: 25px;
  text-align: center;
  padding: 35px 15px;
  background: white;
  border: 1px solid #f0ede8;
  position: relative;
  box-shadow: var(--shadow);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

@media (max-width: 600px) {
  .container { padding: 20px 10px 60px; }
  .honor-podium { gap: 6px; }
  .podium-card { padding: 15px 5px; border-radius: 15px; }
  .p-label { font-size: 0.75rem !important; margin-bottom: 5px !important; letter-spacing: -0.5px !important; }
  .medal-icon { font-size: 1.6rem !important; margin-bottom: 5px !important; }
  .p-name { font-size: 0.85rem !important; }
  .p-class-tag { font-size: 0.55rem !important; padding: 1px 4px !important; margin-left: 2px !important; }
  .p-sub { font-size: 0.6rem !important; margin-bottom: 6px !important; letter-spacing: 0 !important; }
  .p-info { font-size: 0.75rem !important; padding: 4px 10px !important; }

  .tier-bar {
    display: grid !important;
    grid-template-columns: repeat(5, 1fr) !important;
    gap: 5px !important;
    overflow-x: hidden !important;
    padding: 0 !important;
  }
  .tier-group { min-width: 0 !important; gap: 5px !important; }
  .tier-badge { padding: 8px 2px !important; border-radius: 10px !important; }
  .t-icon { font-size: 1.1rem !important; }
  .t-name { font-size: 0.45rem !important; transform: scale(0.9); }
  .t-score { font-size: 0.5rem !important; }

  .t-member-list {
    display: flex !important;
    flex-direction: column !important;
    gap: 2px !important;
    margin-top: 4px !important;
    grid-template-columns: none !important;
  }
  .t-member-item {
    font-size: 0.5rem !important;
    padding: 2px 1px !important;
    border-radius: 4px !important;
    line-height: 1.1 !important;
  }
}

.podium-card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }

.p-label {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.8rem;
  font-weight: 900;
  letter-spacing: -1px;
  margin-bottom: 15px;
  display: block;
  line-height: 1.2;
}

.top-tier .p-label { color: #7e57c2; }
.top-total .p-label { color: #d4af37; }
.top-avg .p-label { color: #ff7043; }

.medal-icon { font-size: 2.8rem; display: block; margin-bottom: 15px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }

.p-name-wrap { margin-bottom: 10px; }
.p-name { font-size: 1.2rem; font-weight: 700; font-family: 'Noto Serif KR'; color: #222; }
.p-class-tag {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 8px;
  margin-left: 5px;
  vertical-align: middle;
  font-weight: 700;
}

.p-sub { font-size: 0.85rem; font-weight: 600; opacity: 0.5; margin-bottom: 12px; letter-spacing: 1px; }

.p-info {
  display: inline-block; padding: 6px 20px; border-radius: 20px;
  font-size: 1rem; font-weight: 700; color: white; background: var(--dark);
}
.top-tier .p-info { background: linear-gradient(135deg, #9575cd, #7e57c2); }
.top-total .p-info { background: linear-gradient(135deg, #ffdc73, #d4af37); }
.top-avg .p-info { background: linear-gradient(135deg, #ffab91, #ff7043); }

/* 티어 섹션 */
.tier-section { margin-bottom: 50px; text-align: center; }
.tier-section h2 { font-family: 'Noto Serif KR'; font-size: 1rem; letter-spacing: 3px; opacity: 0.5; margin-bottom: 25px; }
.tier-bar { display: flex; justify-content: center; gap: 8px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
.tier-bar::-webkit-scrollbar { display: none; }
.tier-group { display: flex; flex-direction: column; align-items: center; min-width: 90px; gap: 10px; }
.tier-badge { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 5px; border-radius: 14px; border: 1.5px solid transparent; }
.t-icon { font-size: 1.5rem; }
.t-name { font-size: 0.55rem; font-weight: 700; letter-spacing: 1px; }
.t-score { font-size: 0.65rem; font-weight: 700; opacity: 0.6; }
.t-member-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; width: 100%; }
.t-member-item { font-size: 0.6rem; padding: 4px 2px; border-radius: 6px; text-align: center; font-family: 'Noto Serif KR'; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(0,0,0,0.03); }
.chip-s-plus { background: var(--s-plus-bg); color: var(--s-plus-text); }
.chip-s      { background: var(--s-bg); color: var(--s-text); }
.chip-default { background: rgba(255,255,255,0.5); color: #666; }

.bg-unranked { background: #f0ede6; color: #6a6050; }
.bg-iron     { background: #e8e0d8; color: #504030; }
.bg-bronze   { background: #f5ede2; color: #7a4f2a; }
.bg-silver   { background: #efefef; color: #3a5060; }
.bg-gold     { background: #fdf3d7; color: #7a6010; }
.bg-platinum { background: #e6f4f4; color: #1a6060; }
.bg-emerald  { background: #e2f5e8; color: #1a5030; }
.bg-diamond  { background: #e8e4f8; color: #3a2f80; }
.bg-master   { background: #f8e8f2; color: #7a2060; }
.bg-king     { background: linear-gradient(135deg,#fff8e0,#ffe0f0,#e0e8ff); color: #4020a0; }

/* 랭킹 탭 & 리스트 */
.hidden { display: none !important; }
.mode-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 36px; }
.mode-btn { background: none; border: 1.5px solid var(--dark); padding: 9px 24px; border-radius: 20px; font-family: 'Poppins'; font-size: 0.85rem; font-weight: 700; cursor: pointer; color: var(--dark); transition: all 0.25s; }
.mode-btn.active { background: var(--dark); color: #fff; }
.round-select-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 25px; }
.round-select-row label { font-size: 0.82rem; font-weight: 700; color: #999; }
.round-select-row select { padding: 8px 16px; border-radius: 20px; border: 1px solid #ddd; font-family: 'Poppins'; font-size: 0.85rem; font-weight: 600; color: var(--dark); background: #fff; }
.rank-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
.tab-btn { background: #eee; border: none; padding: 9px 22px; border-radius: 20px; font-family: 'Poppins'; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: #888; transition: all 0.25s; }
.tab-btn.active { background: var(--dark); color: #fff; }
.score-type-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; padding: 5px; background: #f0ede8; border-radius: 30px; width: fit-content; margin: 0 auto 30px; }
.score-btn { background: transparent; border: none; padding: 8px 20px; border-radius: 25px; font-size: 0.85rem; font-weight: 700; cursor: pointer; color: #aaa; transition: 0.3s; }
.score-btn.active { background: white; color: var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.rank-box { background: white; border-radius: 24px; padding: 28px 22px; box-shadow: var(--shadow); max-width: 700px; margin: 0 auto; }
.box-title { font-size: 1rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f0ede8; text-align: center; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 12px 6px; border-bottom: 1px solid #fbf9f6; }
.rank-row:last-child { border-bottom: none; }
.r-num { font-weight: 700; font-size: 0.9rem; min-width: 26px; color: var(--gold); }
.r-num.top1 { color: #b8392b; font-size: 1rem; }
.r-icon { font-size: 1.05rem; }
.r-name { font-weight: 700; font-family: 'Noto Serif KR'; flex: 1; font-size: 0.95rem; }
.r-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; margin-left: 6px; font-weight: 700; }
.r-tag.tag-s-plus { background: var(--s-plus-bg); color: var(--s-plus-text); }
.r-tag.tag-s      { background: var(--s-bg); color: var(--s-text); }
.r-tag.tag-default { background: #f0ede8; color: #999; }
.r-gauge { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; vertical-align: middle; }
.r-gauge-track { position: relative; width: 68px; height: 10px; border-radius: 3px; background: #e6e9f0; overflow: hidden; }
@media (min-width: 420px) {
  .r-gauge-track { width: 130px; }
}
.r-gauge-fill { position: absolute; inset: 0; height: 100%; transition: width .3s; }
/* 1~30 전체를 30칸으로 쪼개 보여주는 눈금선 — 채워진 비율이 작아도(예:
   학기 초반 1~3회차) "몇 칸 찼는지"가 또렷이 세어지게(원장님 요청:
   "1부터 30까지로 길이로"). 흰 눈금선이 막대 전체(채워진 부분 포함)를
   가로질러 30칸으로 나눔. */
.r-gauge-ticks { position: absolute; inset: 0; background: repeating-linear-gradient(to right, #fff 0, #fff 1px, transparent 1px, transparent calc(100% / 30)); pointer-events: none; }
.r-gauge-num { font-size: 0.66rem; font-weight: 800; }
.r-pts { font-weight: 700; font-size: 0.88rem; white-space: nowrap; }
.r-pts small { font-weight: 400; opacity: 0.45; font-size: 0.7rem; margin-left: 2px; }
.empty-msg { text-align: center; padding: 40px; color: #bbb; font-size: 0.9rem; }

/* 회차별 분석 패널 */
.rr-box { background: white; border-radius: 24px; padding: 26px 22px; box-shadow: var(--shadow); max-width: 700px; margin: 20px auto 0; }
.rr-box h3 { font-size: 1rem; font-weight: 700; margin: 0 0 16px; text-align: center; }
.rr-rates { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 24px; }
.rr-cell { border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 0.72rem; color: #fff; }
.rr-cell b { display: block; font-size: 0.82rem; }
.rr-note { text-align: center; color: #bbb; font-size: 0.82rem; padding: 24px 0; }
.rr-hard { border-top: 1px solid #f0ede8; padding-top: 16px; }
.rr-hard h4 { font-size: 0.9rem; margin: 0 0 10px; }
.rr-item { border-top: 1px solid #f6f2ec; padding: 14px 0; }
.rr-item:first-of-type { border-top: none; }
.rr-ihead { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; }
.rr-irate { font-size: 0.68rem; font-weight: 700; color: #fff; background: var(--dark); padding: 2px 8px; border-radius: 9px; }
.rr-stem { font-size: 0.86rem; line-height: 1.7; margin-bottom: 6px; }
.rr-item img { max-width: 100%; height: auto; border-radius: 6px; }
.rr-choices { font-size: 0.78rem; color: #888; margin-bottom: 6px; }
.rr-answer { font-weight: 700; font-size: 0.8rem; color: #3e8f79; margin-bottom: 6px; }
.rr-video { display: inline-block; margin-bottom: 6px; font-size: 0.78rem; font-weight: 700; color: #c64e71; text-decoration: none; background: #fbeaee; padding: 5px 11px; border-radius: 9px; }
.ytFacade { position: relative; width: 100%; max-width: 420px; aspect-ratio: 16/9; background-size: cover; background-position: center; background-color: #eee; border-radius: 10px; cursor: pointer; margin-bottom: 8px; overflow: hidden; }
.ytFacade::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.15); }
.ytFacade .ytPlayBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 52px; height: 52px; background: rgba(0,0,0,.68); border-radius: 50%; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 1; }
.ytIframe { width: 100%; max-width: 420px; aspect-ratio: 16/9; border: none; border-radius: 10px; margin-bottom: 8px; display: block; }
.rr-expl { font-size: 0.8rem; line-height: 1.7; color: #555; padding-top: 8px; border-top: 1px dashed #eee; }
.rr-expl b { color: var(--gold); }
.rr-details { margin-top: 6px; }
.rr-details > summary { cursor: pointer; font-weight: 700; font-size: 0.78rem; color: var(--gold); background: rgba(200,168,75,.12); padding: 7px 12px; border-radius: 9px; list-style: none; }
.rr-details > summary::-webkit-details-marker { display: none; }
.rr-details[open] > summary { margin-bottom: 6px; }
.rr-allbox { margin-top: 18px; border-top: 1px solid #f0ede8; padding-top: 14px; }
.rr-allbox > summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--dark); list-style: none; }
.rr-allbox > summary::-webkit-details-marker { display: none; }
.rr-allbox[open] > summary { margin-bottom: 10px; }
.refresh-btn { display: block; margin: 20px auto 0; background: none; border: 1px solid #ddd; border-radius: 20px; padding: 7px 20px; font-size: 0.78rem; color: #aaa; cursor: pointer; }

/* 웹(넓은 화면)에서는 문항 목록이 세로로만 길게 늘어져 가로 공간을
   못 쓰는 게 아쉽다는 원장님 요청 — 이 두 목록(많이 틀린 문제 / 15문항
   전체 해설)만 그리드로 바꾼다. 모바일 폭에서는(미디어쿼리가 안 걸려)
   지금처럼 그대로 세로로 길게 보인다. 화면이 넓을수록(예: 큰 모니터)
   박스 자체도 더 넓게 채우고 3단까지 늘려서 옆에 빈 여백만 남지
   않게 한다(원장님 요청: "가로가 꽉차게").*/
@media (min-width: 760px) {
  .rr-box { max-width: 1000px; }
  .rr-grid, #rrAllList { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .rr-grid .rr-item, #rrAllList .rr-item {
    border-top: none;
    border: 1px solid #f0ede8;
    border-radius: 12px;
    padding: 14px 16px;
  }
}
@media (min-width: 1300px) {
  .rr-box { max-width: 1400px; }
  .rr-grid, #rrAllList { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
footer { text-align: center; color: #ccc; font-size: 0.72rem; padding: 40px 0; }
</style>
</head>
<body>
<div class="container">
  <a class="backLink" href="dailyquiz.html">← 일일일모 응시로 돌아가기</a>
  <header>
    <h1>일일일모 RANKING</h1>
    <p>MATHY YURI | DAECHI ACADEMY</p>
  </header>

  <div class="mode-tabs">
    <button class="mode-btn active" data-mode="overall">전체 랭킹</button>
    <button class="mode-btn" data-mode="round">회차별 랭킹</button>
  </div>

  <div id="overallSections">
    <section class="honor-section">
      <h2>✦ 명예의 전당 ✦</h2>
      <div class="honor-podium" id="honorPodium"></div>
    </section>

    <section class="tier-section">
      <h2>TIER STATUS (누적점수 × 평균 기준)</h2>
      <div class="tier-bar" id="tierBar"></div>
    </section>
  </div>

  <div class="rank-tabs">
    <button class="tab-btn active" data-filter="all">TOTAL</button>
    <button class="tab-btn" data-filter="S+">S+ CLASS</button>
    <button class="tab-btn" data-filter="S">S CLASS</button>
  </div>

  <div class="score-type-tabs" id="scoreTypeTabs">
    <button class="score-btn active" data-score="total">누적 점수</button>
    <button class="score-btn" data-score="average">회당 평균</button>
  </div>

  <div class="round-select-row hidden" id="roundSelectRow">
    <label for="roundSelect">회차</label>
    <select id="roundSelect"></select>
  </div>

  <div class="rank-box">
    <div class="box-title" id="listTitle">누적 점수 💎</div>
    <div id="mainList"></div>
  </div>

  <div id="roundReportWrap" class="hidden"></div>

  <button class="refresh-btn" onclick="fetchData()">↺ 새로고침</button>
  <footer>MATHY YURI · DAECHI ACADEMY</footer>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbynxupIBGMhIb6knPPTzCgQ3No_nId6YdjoKsvoFGZAEk4HkVztI0a6Wto5UfUww8e1/exec';

// 회차(1~30) ↔ 그 회차 문제의 출처 학교 — 원장님이 확정해준 고정 목록
// (계산에는 안 쓰이는 순수 표시용 라벨이라 시트로 안 빼고 여기 박아둠).
// 인덱스 0은 안 씀(1회차부터).
const ROUND_SCHOOLS = [
  '', '수원여고', '부천북고', '광휘고', '보라고', '동패고', '능동고', '안곡고', '고양동산고', '도래울고', '백운고',
  '고림고', '광덕고', '상일고', '성포고', '화정고', '덕산고', '저동고', '소명여고', '소래고', '풍무고',
  '광명고', '중산고', '부명고', '권선고', '송림고', '구리고', '화수고', '서현고', '수택고', '과전외고',
];

// 랭킹 목록의 회차 진행도 게이지가 "전체 30회차 중 몇 회차까지 왔는지"를
// 기준으로 채워지게 하는 분모(원장님 요청: "30까지 채워가는 느낌으로").
const TOTAL_ROUNDS = 30;

// 회차별 진행도 게이지 색 — 같은 회차에 있는 학생들끼리 색으로 바로
// 묶여 보이게(원장님 요청: 회차마다 색 구분). 회차 번호마다 색상환(hue)을
// 고정폭으로 돌려서, 1~30회차 어디든 매번 다른 색이 나오면서도 같은
// 회차는 새로고침해도 항상 같은 색이 되게 함.
function roundGaugeColor(round) {
  const hue = ((Number(round) - 1) * 47) % 360;
  return `hsl(${hue}, 65%, 52%)`;
}

// 티어는 "누적점수 × (회당평균/100)" — 많이 풀수록(누적점수 커짐) *그리고*
// 정확하게 풀수록(평균이 곱해짐) 유리하게 둘 다 반영한 종합 실력치.
// 예: 3회차만 완벽하게(평균100) 풀면 300×1.0=300점, 25회차를 평균88로
// 풀면 2200×0.88=1936점 — "적게 풀고 완벽" 보다 "많이, 대체로 잘" 쪽이
// 더 높게 나오되, 평균이 낮으면(대충 찍기 등) 양이 많아도 크게 안 오름
// (20회차 평균50 = 1000×0.5=500점뿐). 만점은 30회차×100점=3000점.
// 임계값은 아직 실제 학생 데이터가 거의 없어(테스트 1건) 위 공식으로
// 추정한 값 — 실제로 몇 주 데이터 쌓이면 분포 보고 다시 조정 필요.
const TIERS = [
  { key: 'king',      name: 'KING',      emoji: '👑', min: 2600, bg: 'bg-king'      },
  { key: 'master',    name: 'MASTER',    emoji: '🏆', min: 2150, bg: 'bg-master'    },
  { key: 'diamond',   name: 'DIAMOND',   emoji: '💎', min: 1700, bg: 'bg-diamond'   },
  { key: 'emerald',   name: 'EMERALD',   emoji: '❇️',  min: 1300, bg: 'bg-emerald'   },
  { key: 'platinum',  name: 'PLATINUM',  emoji: '🪙', min: 950,  bg: 'bg-platinum'  },
  { key: 'gold',      name: 'GOLD',      emoji: '🥇', min: 650,  bg: 'bg-gold'      },
  { key: 'silver',    name: 'SILVER',    emoji: '🛡️', min: 400,  bg: 'bg-silver'   },
  { key: 'bronze',    name: 'BRONZE',    emoji: '⚔️',  min: 200,  bg: 'bg-bronze'   },
  { key: 'iron',      name: 'IRON',      emoji: '🔥', min: 80,   bg: 'bg-iron'      },
  { key: 'unranked',  name: 'UNRANKED',  emoji: '🌱', min: 0,    bg: 'bg-unranked'  },
];

let allData = [];
let roundData = [];
let currentFilter = 'all';
let currentScoreKey = 'total';
let currentMode = 'overall'; // 'overall' | 'round'
let currentRound = 1;

/* 풀이영상 — index.html의 ytEmbed와 같은 방식: 링크로 새 탭 열지 않고
   썸네일을 먼저 보여주다가 누르면 그 자리에서 재생(원장님 요청). */
function ytEmbed(url) {
  if (!url) return null;
  let m = url.match(/youtube\.com\/shorts\/([\w-]{6,})/);
  if (m) return { id: m[1] };
  m = url.match(/youtu\.be\/([\w-]{6,})/);
  if (m) return { id: m[1] };
  m = url.match(/[?&]v=([\w-]{6,})/);
  if (m) return { id: m[1] };
  return null;
}
function ytThumbHtml(url) {
  const yt = ytEmbed(url);
  if (!yt) return '';
  return `<div class="ytFacade" data-yid="${yt.id}" style="background-image:url('https://i.ytimg.com/vi/${yt.id}/hqdefault.jpg')"><span class="ytPlayBtn">▶</span></div>`;
}
document.addEventListener('click', e => {
  const facade = e.target.closest('.ytFacade');
  if (!facade) return;
  const iframe = document.createElement('iframe');
  iframe.className = 'ytIframe';
  iframe.src = `https://www.youtube.com/embed/${facade.dataset.yid}?autoplay=1`;
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
  iframe.allowFullscreen = true;
  facade.replaceWith(iframe);
});

function getTier(tierScore) {
  for (const t of TIERS) if (tierScore >= t.min) return t;
  return TIERS[TIERS.length - 1];
}

async function fetchData() {
  try {
    const res = await fetch(GAS_URL + '?action=dailyquizranking&t=' + Date.now());
    const json = await res.json();
    const list = json.ok ? (json.students || []) : [];
    allData = list.map(item => {
      const total = Number(item.total || 0);
      const average = Number(item.average || 0);
      return {
        name: String(item.name || ''),
        class: String(item.class || ''),
        total,
        average,
        roundsCompleted: Number(item.roundsCompleted || 0),
        maxRound: Number(item.maxRound || 0),
        tierScore: Math.round(total * (average / 100) * 100) / 100,
      };
    });
    renderAll();
  } catch (err) {
    console.error(err);
    document.getElementById('mainList').innerHTML = '<div class="empty-msg">데이터를 불러오지 못했어요.</div>';
  }
}

function renderAll() {
  const data = currentFilter === 'all' ? allData : allData.filter(d => d.class === currentFilter);
  renderHonor(data);
  renderTierBar(data);
  renderMainList(data);
}

function renderHonor(data) {
  const honorEl = document.getElementById('honorPodium');
  if (!data.length) { honorEl.innerHTML = ''; return; }

  const topTier = [...data].sort((a, b) => b.tierScore - a.tierScore)[0];
  const topTotal = [...data].sort((a, b) => b.total - a.total)[0];
  const topAvg = [...data].filter(d => d.roundsCompleted > 0).sort((a, b) => b.average - a.average || b.roundsCompleted - a.roundsCompleted)[0];

  const cardHtml = (item, label, scoreKey, cls, iconEmoji) => {
    if (!item) return `<div class="podium-card ${cls}"><div class="p-label">${label}</div><div class="p-name">—</div></div>`;
    const tier = getTier(item.tierScore);
    const displayIcon = cls === 'top-tier' ? tier.emoji : iconEmoji;
    const classTagColor = item.class === 'S+' ? 'var(--s-plus-bg)' : 'var(--s-bg)';
    const classTextColor = item.class === 'S+' ? 'var(--s-plus-text)' : 'var(--s-text)';

    return `<div class="podium-card ${cls}">
      <div class="p-label">${label}</div>
      <span class="medal-icon">${displayIcon}</span>
      <div class="p-name-wrap">
        <span class="p-name">${item.name}</span>
        <span class="p-class-tag" style="background:${classTagColor}; color:${classTextColor}">${item.class}</span>
      </div>
      <div class="p-sub">${tier.name} TIER</div>
      <div class="p-info">${item[scoreKey].toFixed(1)}점</div>
    </div>`;
  };

  honorEl.innerHTML =
    cardHtml(topTier, '티어점수 1st', 'tierScore', 'top-tier', '') +
    cardHtml(topTotal, '누적점수 1st', 'total', 'top-total', '👑') +
    cardHtml(topAvg, '회당평균 1st', 'average', 'top-avg', '✨');
}

function renderTierBar(data) {
  const tierGroups = {};
  TIERS.forEach(t => tierGroups[t.key] = []);
  data.forEach(d => {
    const t = getTier(d.tierScore);
    tierGroups[t.key].push(d);
  });

  document.getElementById('tierBar').innerHTML = TIERS.map(t => {
    const members = tierGroups[t.key];
    const memberListHtml = members.length > 0
      ? members.map(m => {
          const chipClass = m.class === 'S+' ? 'chip-s-plus' : (m.class === 'S' ? 'chip-s' : 'chip-default');
          return `<div class="t-member-item ${chipClass}">${m.name}</div>`;
        }).join('')
      : '';

    return `
      <div class="tier-group">
        <div class="tier-badge ${t.bg}">
          <span class="t-icon">${t.emoji}</span>
          <span class="t-name">${t.name}</span>
          <span class="t-score">${t.min}+</span>
        </div>
        <div class="t-member-list">${memberListHtml}</div>
      </div>
    `;
  }).join('');
}

function renderMainList(data) {
  const listEl = document.getElementById('mainList');
  const displayData = data
    .filter(d => d[currentScoreKey] > 0)
    .sort((a, b) => b[currentScoreKey] - a[currentScoreKey]);

  const titleMap = { total: '누적 점수 💎', average: '회당 평균 🏆' };
  document.getElementById('listTitle').innerText = titleMap[currentScoreKey];

  if (!displayData.length) {
    listEl.innerHTML = '<div class="empty-msg">기록된 데이터가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = displayData.map((d, i) => {
    const tier = getTier(d.tierScore);
    const tagClass = d.class === 'S+' ? 'tag-s-plus' : (d.class === 'S' ? 'tag-s' : 'tag-default');
    const fillColor = roundGaugeColor(d.maxRound);
    // 반 친구들 중 최고 회차 기준(상대값)이 아니라 전체 30회차 기준(절대값)
    // 으로 채워지게 — 원장님 요청: "30까지 채워가는 느낌으로". 그래야
    // 1·2·3회차처럼 학기 초반의 작은 차이도 눈에 보이고, 전체 30회차 중
    // 지금 어디쯤 왔는지도 한눈에 들어온다.
    const pct = d.maxRound > 0 ? Math.max(3, Math.round(d.maxRound / TOTAL_ROUNDS * 100)) : 0;

    return `<div class="rank-row">
      <span class="r-num ${i < 3 ? 'top1' : ''}">${i + 1}</span>
      <span class="r-icon">${tier.emoji}</span>
      <span class="r-name">${d.name}<span class="r-tag ${tagClass}">${d.class}</span><span class="r-gauge" title="${d.maxRound}회차까지 · ${d.roundsCompleted}회 응시"><span class="r-gauge-track"><span class="r-gauge-fill" style="width:${pct}%;background:${fillColor}"></span><span class="r-gauge-ticks"></span></span><b class="r-gauge-num" style="color:${fillColor}">${d.maxRound}</b></span></span>
      <span class="r-pts">${d[currentScoreKey].toFixed(1)}<small>점</small></span>
    </div>`;
  }).join('');
}

// ---- 회차별 랭킹 (그 회차 하나만의 점수, dailyquizroundranking) ----
async function fetchRoundData(round) {
  const listEl = document.getElementById('mainList');
  listEl.innerHTML = '<div class="empty-msg">불러오는 중...</div>';
  try {
    const res = await fetch(GAS_URL + '?action=dailyquizroundranking&round=' + round + '&t=' + Date.now());
    const json = await res.json();
    const list = json.ok ? (json.students || []) : [];
    roundData = list.map(s => ({ name: String(s.name || ''), class: String(s.class || ''), score: Number(s.score || 0) }));
  } catch (err) {
    console.error(err);
    roundData = [];
  }
  renderRoundView();
  renderRoundReport(round);
}

function renderRoundView() {
  const data = currentFilter === 'all' ? roundData : roundData.filter(d => d.class === currentFilter);
  renderRoundList(data);
}

// 그 회차 문항별 정답률(15문제 전체) + 오답률 높은 5문제(정답·해설·풀이영상).
// dailyquizroundreport는 정답 공개된 회차만 내용을 준다(공개 페이지 유출 방지) —
// 공개 전이면 안내 문구만 보여준다.
function rrRateColor(v) {
  if (v == null) return '#ccc';
  return v < 60 ? '#c64e71' : v < 80 ? '#c8a84b' : '#3e8f79';
}
async function renderRoundReport(round) {
  const wrap = document.getElementById('roundReportWrap');
  wrap.innerHTML = '<div class="rr-box"><p class="rr-note">문항 분석을 불러오는 중...</p></div>';
  let json;
  try {
    const res = await fetch(GAS_URL + '?action=dailyquizroundreport&round=' + round + '&t=' + Date.now());
    json = await res.json();
  } catch (e) { wrap.innerHTML = ''; return; }
  if (!json || !json.ok) { wrap.innerHTML = ''; return; }
  const school = ROUND_SCHOOLS[round];
  if (!json.revealed) {
    wrap.innerHTML = `<div class="rr-box"><h3>📊 ${round}회차 문항 분석${school ? ` <small style="font-weight:400;color:#bbb">(${school})</small>` : ''}</h3><p class="rr-note">정답이 공개되면 문항별 정답률과 해설이 여기 표시됩니다.</p></div>`;
    return;
  }
  const items = json.items || [];
  const hard = json.hard || [];
  const ratesHtml = items.map(it => {
    const r = it.rate;
    return `<div class="rr-cell" style="background:${rrRateColor(r)}"><span>${it.num}번</span><b>${r == null ? '-' : r + '%'}</b></div>`;
  }).join('');
  const hardHtml = hard.map(it => {
    const choicesHtml = (it.choices || []).join(' &nbsp; ');
    return `<div class="rr-item">
      <div class="rr-ihead"><span>${it.num}번</span><span class="rr-irate">정답률 ${it.rate}%</span></div>
      <div class="rr-stem">${it.stemHtml || ''}</div>
      <div class="rr-choices">${choicesHtml}</div>
      ${ytThumbHtml(it.video)}
      <details class="rr-details">
        <summary>📖 정답 · 해설 보기</summary>
        <div class="rr-answer">정답: ${it.answer || '−'}</div>
        ${it.quickAnswer || it.explanation ? `<div class="rr-expl">${it.quickAnswer ? `<b>빠른정답</b><br>${it.quickAnswer}` : ''}${it.explanation ? `${it.quickAnswer ? '<br><br>' : ''}<b>해설</b><br>${it.explanation}` : ''}</div>` : ''}
      </details>
    </div>`;
  }).join('');
  wrap.innerHTML = `<div class="rr-box">
    <h3>📊 ${round}회차 문항 분석${school ? ` <small style="font-weight:400;color:#bbb">(${school} 기출)</small>` : ''}</h3>
    <div class="rr-rates">${ratesHtml || '<p class="rr-note">아직 채점된 응시 기록이 없습니다.</p>'}</div>
    ${hard.length ? `<div class="rr-hard"><h4>🔥 많이 틀린 문제 ${hard.length}개</h4><div class="rr-grid">${hardHtml}</div></div>` : ''}
    <details class="rr-allbox"><summary>📚 15문항 전체 해설 보기</summary><div id="rrAllList"><p class="rr-note">여기를 펼치면 불러옵니다.</p></div></details>
  </div>`;
  if (window.renderMathInElement) {
    try { renderMathInElement(wrap, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
  }
  const allBox = wrap.querySelector('.rr-allbox');
  let loaded = false;
  allBox.addEventListener('toggle', async () => {
    if (!allBox.open || loaded) return;
    loaded = true;
    const listAll = allBox.querySelector('#rrAllList');
    listAll.innerHTML = '<p class="rr-note">불러오는 중...</p>';
    try {
      const res = await fetch(GAS_URL + '?action=dailyquizroundsolutions&round=' + round + '&t=' + Date.now());
      const sj = await res.json();
      const sitems = (sj && sj.ok) ? (sj.items || []) : [];
      if (!sitems.length) { listAll.innerHTML = '<p class="rr-note">불러오지 못했어요.</p>'; loaded = false; return; }
      listAll.innerHTML = sitems.map(it => {
        const choicesHtml = (it.choices || []).join(' &nbsp; ');
        return `<div class="rr-item">
          <div class="rr-ihead"><span>${it.num}번</span>${it.rate != null ? `<span class="rr-irate">정답률 ${it.rate}%</span>` : ''}</div>
          <div class="rr-stem">${it.stemHtml || ''}</div>
          <div class="rr-choices">${choicesHtml}</div>
          ${ytThumbHtml(it.video)}
          <details class="rr-details"><summary>📖 정답 · 해설 보기</summary>
            <div class="rr-answer">정답: ${it.answer || '−'}</div>
            ${it.quickAnswer || it.explanation ? `<div class="rr-expl">${it.quickAnswer ? `<b>빠른정답</b><br>${it.quickAnswer}` : ''}${it.explanation ? `${it.quickAnswer ? '<br><br>' : ''}<b>해설</b><br>${it.explanation}` : ''}</div>` : '<div class="rr-note" style="padding:8px 0">이 문항엔 해설이 저장돼 있지 않아요.</div>'}
          </details>
        </div>`;
      }).join('');
      if (window.renderMathInElement) {
        try { renderMathInElement(listAll, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
      }
    } catch (e) {
      listAll.innerHTML = '<p class="rr-note">불러오지 못했어요.</p>';
      loaded = false;
    }
  });
}

function renderRoundList(data) {
  const listEl = document.getElementById('mainList');
  const displayData = [...data].filter(d => d.score > 0).sort((a, b) => b.score - a.score);
  const school = ROUND_SCHOOLS[currentRound];
  document.getElementById('listTitle').innerText = currentRound + '회차 점수' + (school ? ` (${school} 기출)` : '') + ' 🏆';

  if (!displayData.length) {
    listEl.innerHTML = '<div class="empty-msg">이 회차엔 아직 채점된 응시 기록이 없습니다.</div>';
    return;
  }

  listEl.innerHTML = displayData.map((d, i) => {
    const tagClass = d.class === 'S+' ? 'tag-s-plus' : (d.class === 'S' ? 'tag-s' : 'tag-default');
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '•';
    return `<div class="rank-row">
      <span class="r-num ${i < 3 ? 'top1' : ''}">${i + 1}</span>
      <span class="r-icon">${medal}</span>
      <span class="r-name">${d.name}<span class="r-tag ${tagClass}">${d.class}</span></span>
      <span class="r-pts">${d.score.toFixed(1)}<small>점</small></span>
    </div>`;
  }).join('');
}

function refreshView() {
  if (currentMode === 'round') renderRoundView();
  else renderAll();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = function () {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    refreshView();
  };
});

document.querySelectorAll('.score-btn').forEach(btn => {
  btn.onclick = function () {
    document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentScoreKey = this.dataset.score;
    renderMainList(currentFilter === 'all' ? allData : allData.filter(d => d.class === currentFilter));
  };
});

// ---- 전체 랭킹 / 회차별 랭킹 모드 전환 ----
const roundSelectEl = document.getElementById('roundSelect');
for (let r = 1; r <= 30; r++) {
  const opt = document.createElement('option');
  opt.value = r;
  opt.textContent = r + '회차' + (ROUND_SCHOOLS[r] ? ` (${ROUND_SCHOOLS[r]})` : '');
  roundSelectEl.appendChild(opt);
}
roundSelectEl.addEventListener('change', () => {
  currentRound = Number(roundSelectEl.value);
  fetchRoundData(currentRound);
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = function () {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentMode = this.dataset.mode;
    const isRound = currentMode === 'round';
    document.getElementById('overallSections').classList.toggle('hidden', isRound);
    document.getElementById('scoreTypeTabs').classList.toggle('hidden', isRound);
    document.getElementById('roundSelectRow').classList.toggle('hidden', !isRound);
    document.getElementById('roundReportWrap').classList.toggle('hidden', !isRound);
    if (isRound) fetchRoundData(currentRound);
    else renderAll();
  };
});

fetchData();
setInterval(() => { fetchData(); if (currentMode === 'round') fetchRoundData(currentRound); }, 180000);
</script>
