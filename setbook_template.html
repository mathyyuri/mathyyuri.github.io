<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도형의 방정식 서술형 해설집</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1c1c1c; --sub:#666; --rule:#cfc9ba; --rule-dark:#3a352c; --acc:#7a2333; --red:#a3242f; --paper:#ded7c4; --page:#faf6ec;
  --gold:#b8944f;
  --kserif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif; --hand:'Poor Story',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
.deckWrap{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}
.examPage{--fit:1;position:relative;width:100%;max-width:70.7vh;aspect-ratio:210/297;max-height:100vh;margin:0 auto;background:var(--page);scroll-snap-align:start;overflow:hidden;padding:3.2% 4%;display:flex;flex-direction:column}
.examTop{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.2px solid var(--rule-dark);padding-bottom:.28em;margin-bottom:.42em;font-size:.56rem;color:var(--sub);letter-spacing:.03em;flex:0 0 auto}
.examTop b{color:var(--acc);font-weight:700}
.qBar{display:flex;align-items:center;gap:.6em;background:#f0e4e6;border-radius:4px;padding:.3em .6em;margin-bottom:.4em;font-size:.66rem;flex:0 0 auto}
.qBar .qNo{font-family:var(--kserif);font-weight:400;font-size:.92rem;color:var(--ink)}
.qBar .qSrc{color:var(--acc);font-weight:400}
.qStemText{font-size:calc(.68rem * var(--fit));line-height:1.7;color:#3a3a3a;margin-bottom:.4em;flex:0 0 auto}
.solLabel{font-family:var(--kserif);font-weight:700;font-size:.58rem;color:var(--acc);border-bottom:1px solid var(--rule);padding-bottom:.14em;margin-bottom:.26em;flex:0 0 auto;display:flex;align-items:center;gap:.3em}
.solLabel::before{content:'✎'}
.solArea{flex:1 1 auto;min-height:0;overflow:hidden;font-family:var(--hand);font-size:calc(.88rem * var(--fit));line-height:1.75;color:var(--ink);display:flex;flex-direction:column;justify-content:space-evenly}
.solArea .step{margin-bottom:.1em}
.solArea .step.mk::before{content:'★ ';color:var(--red)}
.f{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .1em;line-height:1.1;font-size:1.02em}
.f b{font-weight:inherit;padding:0 .09em;display:block}
.f b:first-child{border-bottom:1.5px solid currentColor}
.r{white-space:nowrap}
.r i{font-style:normal;border-top:1.5px solid currentColor;padding:0 .1em .01em;margin-left:.02em}
.sg{border-top:1.4px solid currentColor;padding:0 .03em}
.hl{background:#fff2a3;padding:0 .16em;border-radius:2px}
.bd{color:var(--red);font-weight:700}
.finalBar{flex:0 0 auto;margin-top:.3em;font-family:var(--kserif);font-weight:700;color:var(--red);font-size:calc(.66rem * var(--fit))}
.rubricArea{flex:0 0 auto;margin-top:.4em;background:#f5ecd9;border:1.2px solid var(--gold);border-radius:5px;padding:.35em .55em}
.rubricArea .rTitle{font-family:var(--kserif);font-size:calc(.68rem * var(--fit));font-weight:900;color:var(--acc);margin-bottom:.2em}
table.rTbl{width:100%;border-collapse:collapse;font-size:calc(.66rem * var(--fit))}
table.rTbl td{padding:.16em .2em;border-bottom:1px solid #e4d5b0}
table.rTbl td.pct{text-align:right;font-weight:700;color:var(--red);white-space:nowrap;width:2.8em}
table.rTbl tr:last-child td{border-bottom:none}
/* 표지·간지·뒤표지 */
.coverPage{align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,var(--page),var(--page) 65%,#f2ecdc)}
.coverPage.front::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--acc),var(--gold))}
.coverPhoto{width:7.4em;height:7.4em;border-radius:10px;object-fit:cover;object-position:50% 22%;border:3px solid var(--page);box-shadow:0 0 0 1.5px var(--gold),0 8px 24px rgba(0,0,0,.25);margin-bottom:1em}
.coverBrand{font-family:var(--kserif);font-weight:900;letter-spacing:.32em;color:var(--acc);font-size:.76rem;margin-bottom:.3em}
.coverPerson{font-family:var(--kserif);font-size:.62rem;color:var(--sub);letter-spacing:.08em;margin-bottom:1.3em}
.coverTitle{font-family:var(--kserif);font-weight:900;font-size:1.55rem;line-height:1.45;margin-bottom:.5em;color:var(--ink)}
.coverSub{font-family:var(--kserif);font-size:.8rem;color:var(--acc);font-weight:700;letter-spacing:.12em;margin-bottom:1.3em}
.setBadge{display:inline-flex;align-items:center;gap:.6em;border:1.2px solid var(--gold);border-radius:30px;padding:.4em 1.3em;margin-bottom:1.4em}
.setBadge .n{font-family:var(--kserif);font-weight:900;font-size:1.1rem;color:var(--acc)}
.setBadge .t{font-size:.64rem;color:var(--sub);letter-spacing:.05em}
.coverNote{font-size:.64rem;color:var(--sub);line-height:1.9;max-width:78%}
.dividerPage{align-items:center;justify-content:center;text-align:center}
.dividerLabel{font-family:var(--kserif);font-size:.72rem;color:var(--acc);letter-spacing:.25em;margin-bottom:.6em}
.dividerTitle{font-family:var(--kserif);font-weight:900;font-size:1.35rem;color:var(--ink);line-height:1.5}
.dividerRule{width:3em;height:2px;background:var(--acc);margin:1.1em auto}
.dividerNote{font-size:.64rem;color:var(--sub);line-height:1.9;max-width:72%;margin-top:.4em}
.tocPage{align-items:center;justify-content:flex-start;padding-top:8%}
.tocTbl{border-collapse:collapse;font-size:calc(.72rem * var(--fit,1));width:62%}
.tocTbl td{padding:calc(.28em * var(--fit,1)) .4em;border-bottom:1px solid var(--rule)}
.tocTbl td.tocNo{font-family:var(--kserif);font-weight:900;color:var(--acc);width:2.4em}
.tocTbl td.tocSrc{color:var(--sub)}
.backCover{align-items:center;justify-content:center;text-align:center}
.coverPage.front,.backCover{border:7mm solid var(--acc)}
.backBrand{font-family:var(--kserif);font-weight:900;letter-spacing:.35em;color:var(--acc);font-size:.72rem;margin-bottom:.6em}
.backNote{font-size:.6rem;color:var(--sub);line-height:2}
.navHint{position:fixed;bottom:10px;right:14px;font-size:12px;color:#7a7264;z-index:5}
.exportBar{position:fixed;top:10px;right:14px;z-index:6;display:flex;gap:8px}
.exportBar button{font-size:12px;font-weight:700;padding:8px 14px;border-radius:6px;border:none;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.exportBar button:hover:not(:disabled){background:#5c1a27}
.exportBar button:disabled{opacity:.6;cursor:default}
.slideNav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px}
.navBtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.navBtn:hover:not(:disabled){background:#5c1a27}
.navBtn:disabled{opacity:.35;cursor:default}
.navCounter{background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:10px}
@media print{
  .deckWrap{height:auto;overflow:visible}
  .examPage{scroll-snap-align:none;max-height:none;box-shadow:none;page-break-after:always;max-width:none}
  .navHint,.exportBar,.slideNav{display:none}
  @page{size:portrait;margin:0}
}
</style>
<style id="mathSizeFix">.solArea .katex,.qStemText .katex,.rubricArea .katex{font-size:1.04em}</style>
<style id="setbookCss">
.coverStudent{display:flex;align-items:baseline;justify-content:center;gap:.7em;margin:.2em 0 1.2em}
.coverStudent .who{font-size:.7rem;color:var(--sub);letter-spacing:.06em}
.coverStudent .nm{font-family:var(--kserif);font-weight:900;font-size:1.5rem;color:var(--ink);border-bottom:2px solid var(--gold);padding:0 .35em .08em}
.memoPage .memoTitle{font-family:var(--kserif);font-weight:900;font-size:.9rem;color:var(--acc);letter-spacing:.3em;margin:.2em 0 .6em}
.memoPage .memoLines{flex:1 1 auto;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.1em - 1px),var(--rule) calc(2.1em - 1px),var(--rule) 2.1em);background-size:100% 2.1em;font-size:.78rem}
.qStemText img{display:block;max-width:60%;max-height:34%;margin:.4em auto 0}
</style>
</head>
<body>
<div class="deckWrap" id="deckWrap"></div>
<div class="navHint">↕ 스크롤 또는 PageUp/PageDown · ←/→ · Space로 화면 전환</div>
<div class="exportBar">
  <button type="button" id="saveImgBtn">지금 화면 이미지로 저장</button>
  <button type="button" id="savePdfBtn">여백없는 PDF로 저장</button>
</div>
<div class="slideNav">
  <button type="button" id="navPrevBtn" class="navBtn">‹</button>
  <span id="navCounter" class="navCounter"></span>
  <button type="button" id="navNextBtn" class="navBtn">›</button>
</div>

    document.querySelectorAll('.examPage').forEach(function (page) {

      var tries = 0;
      while (isOver(page) && fit > 0.4 && tries < 40) {
        fit -= 0.02;
        page.style.setProperty('--fit', fit);
        tries++;
      }
    });

  }

    var forward = e.key === 'PageDown' || e.key === 'ArrowRight' || e.key === ' ';

  }
  function goTo(idx) {
    var c = Math.max(0, Math.min(pages.length - 1, idx));

  }
  prevBtn.addEventListener('click', function () { goTo(currentIdx() - 1); });

  function currentPage() {

  }
  async function capture(el) {
    var rect = el.getBoundingClientRect();
    var w = Math.round(rect.width), h = Math.round(rect.height);
    el.style.width = w + 'px'; el.style.height = h + 'px';

      return await html2canvas(el, { scale: 2, backgroundColor: '#faf6ec', useCORS: true, width: w, height: h });

      el.style.width = ''; el.style.height = '';

    } catch (e) { alert('PDF 저장 실패: ' + e.message); }
