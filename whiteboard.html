<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공동 필기 — MATHY YURI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="hwpx-lib.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --cream:#FBF8F1;
  --ink:#1A1A1A;
  --gold:#A8853F;
  --gold-line:#E6DCC6;
  --mint:#7FC8B4;
  --mint-deep:#3E8F79;
  --pink:#E58BA4;
  --pink-deep:#C64E71;
  --serif:'Playfair Display','Noto Serif KR',serif;
  --kserif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
}
* { box-sizing: border-box; }
/* 필기 중에 손가락/마우스 드래그가 밑에 깔린 글자를 파랗게 블록 지정해버리는
   문제 — hwpx 문서는 진짜 텍스트라(PDF/이미지는 캔버스라 원래 안 그랬음)
   길게 누르거나 드래그하면 브라우저가 기본적으로 선택 동작을 시도한다.
   이 페이지 전체가 "쓰는" 화면이지 텍스트를 골라 복사하는 화면이 아니므로
   통째로 막는다(iOS의 길게 눌러 뜨는 메뉴도 같이 막아줌). */
* { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
body { margin:0; font-family:var(--sans); background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased; }
/* position:fixed로 둬야(sticky가 아니라) iOS 사파리 등에서 두 손가락으로
   확대해도 이 바가 화면 크기·위치 그대로 붙박이로 남는다 — sticky는
   스크롤 위치만 따라다닐 뿐 확대·축소 때는 나머지 페이지와 똑같이
   같이 커져버려서, "문제 화면만 확대되고 위 필기 도구바는 그대로였으면
   좋겠다"는 요청과 안 맞았음(아래 #submitBar는 원래도 fixed라 이미
   붙박이로 잘 있었음). fixed는 문서 흐름에서 빠지므로, 그 자리만큼
   #stageWrap 위쪽에 빈 공간을 JS로 채워준다(아래 topBarSpacer 참고). */
#topBar { position:fixed; top:0; left:0; right:0; z-index:20; background:var(--cream); }
header { padding:10px 16px; border-bottom:1px solid var(--gold-line); background:#fff; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
header h1 { font-family:var(--serif); font-size:16px; font-weight:900; margin:0; }
.roleBadge { font-family:var(--kserif); font-size:12px; font-weight:700; padding:3px 10px; border-radius:12px; }
.roleBadge.student { background:rgba(43,108,176,.12); color:#2b6cb0; }
.roleBadge.teacher { background:rgba(214,69,69,.12); color:#d64545; }
.metaInfo { font-family:var(--kserif); font-size:12px; color:rgba(26,26,26,.6); }
#connBadge { font-size:11px; font-family:var(--kserif); margin-left:auto; }
#connBadge.on { color:var(--mint-deep); }
#connBadge.off { color:var(--pink-deep); }
#banner { background:var(--pink-soft,rgba(229,139,164,.14)); color:var(--pink-deep); padding:8px 16px; font-size:13px; font-family:var(--kserif); display:none; }
#banner.show { display:block; }
#toolbar { display:flex; align-items:center; gap:8px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--gold-line); flex-wrap:wrap; }
#toolbar button { font-family:var(--sans); font-size:12px; font-weight:700; padding:7px 12px; cursor:pointer; background:var(--ink); color:var(--cream); border:1px solid var(--ink); border-radius:4px; }
#toolbar button:hover:not(:disabled){ background:var(--mint-deep); border-color:var(--mint-deep); }
#toolbar button.active { background:var(--mint-deep); border-color:var(--mint-deep); }
#toolbar button:disabled{ opacity:.4; cursor:default; }
.swatch { width:24px; height:24px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--gold-line); cursor:pointer; padding:0; }
.swatch.active { box-shadow:0 0 0 2px var(--ink); }
.sep { width:1px; height:22px; background:var(--gold-line); margin:0 2px; }
#pageNav { display:flex; align-items:center; gap:6px; font-family:var(--kserif); font-size:13px; }
/* 확대 버튼으로 #stage를 실제로 더 크게(CSS 크기만, 안쪽 그림 해상도는
   그대로) 만들면 화면보다 넓어질 수 있어서 가로 스크롤을 열어둔다 —
   세로는 원래도 페이지 자체가 스크롤되니 그대로 둔다. 도구바는
   #stageWrap 밖(#topBar, position:fixed)이라 이 확대와 전혀 무관하게
   항상 그대로 있다 — "PDF만 확대되고 도구바는 그대로였으면" 하는
   요청에 맞춰, 브라우저 전체 확대(제스처) 대신 이 버튼으로만 확대하게
   만든 것. */
#stageWrap { display:flex; justify-content:center; padding:18px 10px 60px; overflow-x:auto; }
#stage { position:relative; box-shadow:0 2px 14px rgba(0,0,0,.12); background:#fff; }
#stage canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
#docCanvas { pointer-events:none; }
/* touch-action:manipulation(두 손가락 확대 허용)으로 뒀더니, 펜으로 쓰는
   동안 손바닥이 화면에 닿는 순간 브라우저가 그 접촉을 "화면 이동(팬)"
   제스처로 잡아버려 필기 중 화면이 흔들리는 문제가 계속 있었다(원장님
   리포트). pointerdown 시점에 JS로 touch-action을 껐다 켰다 해봐도
   실기기에서는 안 고쳐졌는데 — 손바닥이 펜보다 먼저(또는 펜 없이 계속)
   닿아있으면 그 접촉의 제스처는 이미 처음 닿는 순간에 정해져서, 나중에
   JS로 값을 바꿔도 그 접촉엔 적용이 안 되기 때문. 확대·축소는 이제
   버튼(🔍-/🔍+)으로 하므로 손가락 제스처가 필요 없어졌고, 그래서
   touch-action을 아예 처음부터 계속 none으로 고정 — 손가락(손바닥 포함)이
   언제 닿든 화면 이동/확대를 절대 일으키지 않는다. */
#inkCanvas { touch-action:none; cursor:crosshair; }
/* 확대(150% 등)하면 캔버스가 화면보다 커지는데, 캔버스 위는
   touch-action:none이라 손가락으로 밀어서 스크롤하는 것도 안 된다(필기
   중 화면이 흔들리는 걸 막으려고 일부러 그렇게 함) — 그래서 확대했을 때
   스크롤할 여백이 없어져 불편하다는 요청. 캔버스 밖의 별도 막대라 여기는
   touch-action을 막을 필요가 없고, 항상 오른쪽에 보이게 둬서 여백이 없어도
   스크롤할 곳이 있게 한다. 내용이 화면에 다 들어와서 스크롤이 필요 없을
   땐(확대 안 했을 때 등) JS가 display:none으로 숨긴다. */
#vScrollTrack { position:fixed; top:0; right:0; bottom:0; width:22px; z-index:15; display:none; }
#vScrollThumb { position:absolute; left:3px; right:3px; background:var(--mint-deep); border-radius:8px; opacity:.55; touch-action:none; }
#vScrollThumb:active { opacity:.85; }
/* 휴대폰(좁은 화면)에서는 확대 안 해도 가로로도 다 안 들어오는 경우가
   있다는 리포트 — 세로 막대와 완전히 같은 이유·같은 구조로 가로 막대도
   둔다(#inkCanvas가 touch-action:none이라 손가락으로 가로로 밀어도
   스크롤이 안 됨). #submitBar(학생 제출 바)가 화면 아래 고정으로 떠 있을
   때는 그 위로 겹치지 않게 JS가 bottom 위치를 동기화한다. */
#hScrollTrack { position:fixed; left:0; right:22px; bottom:0; height:22px; z-index:15; display:none; }
#hScrollThumb { position:absolute; top:3px; bottom:3px; background:var(--mint-deep); border-radius:8px; opacity:.55; touch-action:none; }
#hScrollThumb:active { opacity:.85; }
#docHtmlLayer { position:absolute; top:0; left:0; pointer-events:none; display:none; background:#fff; box-sizing:border-box; padding:20px 24px; font-family:var(--sans); font-size:13px; line-height:1.7; color:var(--ink); overflow:visible; }
#docHtmlLayer .hwpxQ { margin-bottom:18px; padding-bottom:14px; border-bottom:1px dashed var(--gold-line); }
#docHtmlLayer .hwpxQ:last-child { border-bottom:none; }
#docHtmlLayer .qNumLabel { font-family:var(--serif); font-weight:900; color:var(--gold); margin-bottom:6px; font-size:13px; }
#docHtmlLayer img { max-width:100%; height:auto; display:block; margin:6px auto; }
#docHtmlLayer table { border-collapse:collapse; margin:6px 0; }
#docHtmlLayer td { border:1px solid var(--gold-line); padding:2px 6px; font-size:12px; text-align:center; vertical-align:middle; }
#docHtmlLayer .eq .katex { font-size:1em; }
/* hwpx-lib.js가 정답 쓰는 칸 같은 도형(hp:rect)을 이 클래스로만 표시해서
   내주고, 실제 테두리/여백은 각 페이지가 알아서 입혀야 한다 — 다른
   페이지(studentnote.html 등)와 같은 모양으로 맞추고, 안엔 글자/수식이
   가운데로 오게 한다. */
#docHtmlLayer .hwpRectBox { display:block; max-width:100%; box-sizing:border-box; border:1px solid var(--gold-line); padding:6px 10px; margin:6px 0; text-align:center; }
#inkCanvas.eraser { cursor:cell; }
#submitBar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--gold-line); padding:10px 16px; display:flex; align-items:center; gap:10px; }
#submitStatus { font-family:var(--kserif); font-size:13px; color:rgba(26,26,26,.6); }
.hint { font-family:var(--kserif); font-size:12px; color:rgba(26,26,26,.5); }
/* 원장님 전용 도구 모음 사이를 오가는 작은 메뉴 — admin.html 등 5개
   파일에 똑같이 들어있음(공용 include가 없는 정적 사이트라 복붙). 이
   페이지는 위쪽이 이미 헤더 툴바라 떠있는 버튼 대신 헤더 맨 끝(연결
   상태 배지 옆)에 자연스럽게 끼워넣는다. */
#mathyToolNavBtn{padding:4px 10px;border-radius:8px;border:1px solid var(--gold-line);background:#fff;cursor:pointer;font-size:12px;font-family:var(--sans)}
#mathyToolNavPanel{display:none;position:fixed;z-index:99999;background:#fff;border:1px solid var(--gold-line);border-radius:9px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:6px;min-width:200px}
#mathyToolNavPanel.open{display:block}
#mathyToolNavPanel a{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;color:#2a2a2a;font-size:13px;white-space:nowrap}
#mathyToolNavPanel a:hover{background:#f5efe0}
#mathyToolNavPanel a.active{background:#111;color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="topBar">
<header>
  <h1>✍️ 공동 필기</h1>
  <span id="roleBadgeEl" class="roleBadge"></span>
  <span id="metaEl" class="metaInfo"></span>
  <span id="connBadge">●</span>
  <button id="mathyToolNavBtn" type="button" title="원장님 도구 메뉴">🧭 도구</button>
  <div id="mathyToolNavPanel">
    <a href="admin.html">📝 성적 입력</a>
    <a href="oedapnotegenerator.html">📓 오답노트 생성기</a>
    <a href="studentnote.html">📚 학생별 오답노트 (강사용)</a>
    <a href="problembank.html">🗂️ 교재/시험지 관리</a>
    <a href="whiteboard.html">✍️ 공동 필기</a>
  </div>
  <script>
  (function(){
    var btn=document.getElementById('mathyToolNavBtn');
    var panel=document.getElementById('mathyToolNavPanel');
    var cur=location.pathname.split('/').pop()||'index.html';
    panel.querySelectorAll('a').forEach(function(a){
      if(a.getAttribute('href')===cur) a.classList.add('active');
    });
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(panel.classList.contains('open')){ panel.classList.remove('open'); return; }
      var r=btn.getBoundingClientRect();
      panel.style.top=(r.bottom+4)+'px';
      panel.style.left=Math.max(4,r.right-200)+'px';
      panel.classList.add('open');
    });
    document.addEventListener('click', function(){ panel.classList.remove('open'); });
    panel.addEventListener('click', function(ev){ ev.stopPropagation(); });
  })();
  </script>
</header>
<div id="banner"></div>
<div id="toolbar">
  <button type="button" id="penBtn" class="active">펜</button>
  <button type="button" id="eraserBtn">지우개</button>
  <span class="sep"></span>
  <button type="button" class="swatch" data-color="#2b6cb0" style="background:#2b6cb0"></button>
  <button type="button" class="swatch" data-color="#d64545" style="background:#d64545"></button>
  <button type="button" class="swatch" data-color="#1a1a1a" style="background:#1a1a1a"></button>
  <button type="button" class="swatch" data-color="#3E8F79" style="background:#3E8F79"></button>
  <span class="sep"></span>
  <button type="button" class="widthBtn" data-width="2">얇게</button>
  <button type="button" class="widthBtn active" data-width="4">보통</button>
  <button type="button" class="widthBtn" data-width="8">굵게</button>
  <span class="sep"></span>
  <button type="button" id="undoBtn">되돌리기</button>
  <button type="button" id="clearBtn" style="display:none">전체 지우기</button>
  <span class="sep" id="pageNavSep" style="display:none"></span>
  <div id="pageNav" style="display:none">
    <button type="button" id="prevPageBtn">◀</button>
    <span id="pageIndicator">1 / 1</span>
    <button type="button" id="nextPageBtn">▶</button>
  </div>
  <span class="sep"></span>
  <button type="button" id="zoomOutBtn" title="문제 화면만 축소">🔍−</button>
  <span id="zoomIndicator" class="metaInfo">100%</span>
  <button type="button" id="zoomInBtn" title="문제 화면만 확대">🔍+</button>
</div>
</div>
<div id="stageWrap">
  <div id="stage"><canvas id="docCanvas"></canvas><div id="docHtmlLayer"></div><canvas id="inkCanvas"></canvas></div>
</div>
<div id="vScrollTrack"><div id="vScrollThumb"></div></div>
<div id="hScrollTrack"><div id="hScrollThumb"></div></div>
<div id="submitBar" style="display:none">
  <button type="button" id="submitBtn">제출</button>
  <span id="submitStatus"></span>
  <span class="hint" id="multiPageHint" style="display:none">여러 쪽 문서는 각 쪽마다 이 버튼을 따로 눌러 제출해주세요 (쪽마다 따로 제출됩니다).</span>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbynxupIBGMhIb6knPPTzCgQ3No_nId6YdjoKsvoFGZAEk4HkVztI0a6Wto5UfUww8e1/exec';
const qp = new URLSearchParams(location.search);
const sessionId = (qp.get('session') || '').trim();
const role = qp.get('role') === 'teacher' ? 'teacher' : 'student';
const docId = (qp.get('docId') || '').trim();
const docTypeParam = (qp.get('docType') || '').trim(); // 'pdf'|'image'|'hwpx' — 없으면 응답 mime으로 추론
const submitMode = qp.get('submit') === '1'; // 명시적 "필기로 제출" 진입일 때만 제출 바 표시
const studentName = qp.get('name') || '';
const className = qp.get('class') || '';
const cohort = qp.get('cohort') || '2';
const category = qp.get('category') || '';
const mission = qp.get('mission') || '';

// 확대는 버튼(🔍-/🔍+)으로만 하기로 했는데, 브라우저 두손가락 확대가
// <meta viewport>의 user-scalable=no/maximum-scale=1로 다 막힐 거라고
// 믿었더니, 실제로는 그 메타 태그를 무시하는 모바일 브라우저(특히 최신
// iOS Safari — 접근성 이유로 일부러 무시함)가 있어서 여전히 두 손가락으로
// 화면 전체를 확대할 수 있었다(원장님 리포트 — 학생이 확대한 채로
// 제출해서 페이지 일부만 찍힌 것으로 추정). 메타 태그만 믿지 않고
// JS로도 두 손가락 접촉(핀치 제스처)을 직접 막는다.
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

const docCanvas = document.getElementById('docCanvas');
const inkCanvas = document.getElementById('inkCanvas');
const docHtmlLayer = document.getElementById('docHtmlLayer');
const stageWrap = document.getElementById('stageWrap');
// #topBar를 position:fixed로 바꾸면서 문서 흐름에서 빠졌으므로, 그만큼
// #stageWrap 위쪽에 빈 공간을 만들어줘야 문제 화면이 도구바에 안 가려짐.
// 도구바 높이는 화면 너비에 따라 버튼 줄바꿈 등으로 달라질 수 있어서
// 고정값 대신 ResizeObserver로 실제 높이를 계속 재서 맞춘다.
const topBarEl = document.getElementById('topBar');
const vScrollTrack = document.getElementById('vScrollTrack');
const hScrollTrack = document.getElementById('hScrollTrack');
const submitBarEl = document.getElementById('submitBar');
function syncTopBarSpacing(){
  const h = topBarEl.offsetHeight;
  stageWrap.style.paddingTop = h + 'px';
  vScrollTrack.style.top = h + 'px'; // 스크롤 막대도 도구바 아래부터 시작
}
// #submitBar(학생 제출 바)도 화면 아래 고정이라, 가로 스크롤 막대가 그

function setupStage(w, h){
  naturalW = w; naturalH = h;
  const wrapW = Math.min(stageWrap.clientWidth - 20, 900);
  stageCssW = wrapW;
  stageCssH = wrapW * (h / w);
  const dpr = window.devicePixelRatio || 1;
  [docCanvas, inkCanvas].forEach(c => {
    c.style.width = stageCssW + 'px';
    c.style.height = stageCssH + 'px';
    c.width = Math.round(stageCssW * dpr);
    c.height = Math.round(stageCssH * dpr);
  });
  document.getElementById('stage').style.width = stageCssW + 'px';
  document.getElementById('stage').style.height = stageCssH + 'px';
  docCtx = docCanvas.getContext('2d');
  inkCtx = inkCanvas.getContext('2d');
  inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  inkCtx.lineCap = 'round';
  inkCtx.lineJoin = 'round';
  applyStageZoom();
}

// 태블릿에서 브라우저 자체 두손가락 확대(pinch-zoom)에 기대면 #topBar가
// position:fixed라도 실제 기기에서는 화면 전체와 같이 확대돼버리는 경우가
//있었음(원장님 실기기 확인). #topBar는 #stageWrap의 형제 요소일 뿐 그
// 안에 없으므로, 버튼으로 #stage(PDF/캔버스)만 직접 크기를 키우면 확대가
// 도구바에는 아예 물리적으로 영향을 줄 수 없음 — 이 방식이 더 확실하다.
// stageCssW/stageCssH(캔버스 내부 해상도 계산에 쓰이는 "원본" 크기)는 그대로
// 두고, 화면에 보이는 CSS 크기만 배율만큼 늘려서 손글씨 좌표 계산
// (getNormPoint의 getBoundingClientRect 기반 0~1 정규화)이 그대로 맞게
// 유지되도록 한다.
let stageZoom = 1;
const STAGE_ZOOM_MIN = 1, STAGE_ZOOM_MAX = 2.5, STAGE_ZOOM_STEP = 0.25;
function applyStageZoom(){
  if (!stageCssW || !stageCssH) return;
  const w = stageCssW * stageZoom;
  const h = stageCssH * stageZoom;
  [docCanvas, inkCanvas].forEach(c => { c.style.width = w + 'px'; c.style.height = h + 'px'; });
  document.getElementById('stage').style.width = w + 'px';
  document.getElementById('stage').style.height = h + 'px';
  docHtmlLayer.style.transform = stageZoom === 1 ? '' : ('scale(' + stageZoom + ')');
  docHtmlLayer.style.transformOrigin = 'top left';
  const indicator = document.getElementById('zoomIndicator');
  if (indicator) indicator.textContent = Math.round(stageZoom * 100) + '%';
  const outBtn = document.getElementById('zoomOutBtn'), inBtn = document.getElementById('zoomInBtn');
  if (outBtn) outBtn.disabled = stageZoom <= STAGE_ZOOM_MIN;
  if (inBtn) inBtn.disabled = stageZoom >= STAGE_ZOOM_MAX;
  updateVScrollbar(); // 확대·축소로 페이지 길이가 바뀌므로 스크롤 막대도 다시 계산
  updateHScrollbar();
}
function changeStageZoom(delta){
  const next = Math.min(STAGE_ZOOM_MAX, Math.max(STAGE_ZOOM_MIN, Math.round((stageZoom + delta) * 100) / 100));
  if (next === stageZoom) return;
  stageZoom = next;
  applyStageZoom();
}

// 확대해서 페이지가 화면보다 길어지면(#inkCanvas는 touch-action:none이라
// 손가락으로 못 미니) 오른쪽 끝에 항상 손으로 잡고 끌 수 있는 막대를
// 대신 보여준다 — 확대 안 해서 다 화면에 들어올 땐 숨긴다.
const vScrollThumb = document.getElementById('vScrollThumb');
function updateVScrollbar(){
  const doc = document.documentElement;
  const viewportH = window.innerHeight;
  const scrollable = doc.scrollHeight > viewportH + 1;
  vScrollTrack.style.display = scrollable ? 'block' : 'none';
  if (!scrollable) return;
  const trackH = vScrollTrack.clientHeight;
  const thumbH = Math.max(36, trackH * (viewportH / doc.scrollHeight));
  const maxScroll = doc.scrollHeight - viewportH;
  const ratio = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;
  vScrollThumb.style.height = thumbH + 'px';
  vScrollThumb.style.top = (ratio * (trackH - thumbH)) + 'px';
}
window.addEventListener('scroll', updateVScrollbar, { passive: true });
window.addEventListener('resize', updateVScrollbar);
let vDragging = false, vDragStartY = 0, vDragStartScroll = 0;
vScrollThumb.addEventListener('pointerdown', e => {
  vDragging = true;
  vDragStartY = e.clientY;
  vDragStartScroll = window.scrollY;
  try { vScrollThumb.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
vScrollThumb.addEventListener('pointermove', e => {
  if (!vDragging) return;
  const doc = document.documentElement;
  const viewportH = window.innerHeight;
  const trackH = vScrollTrack.clientHeight;
  const thumbH = vScrollThumb.offsetHeight;
  const maxScroll = doc.scrollHeight - viewportH;
  const trackRange = trackH - thumbH;
  if (maxScroll <= 0 || trackRange <= 0) return;
  const deltaY = e.clientY - vDragStartY;
  window.scrollTo(0, vDragStartScroll + deltaY * (maxScroll / trackRange));
  updateVScrollbar(); // 드래그 중엔 'scroll' 이벤트를 기다리지 않고 막대를 바로 따라오게 한다
});
function endVScrollDrag(){ vDragging = false; }
vScrollThumb.addEventListener('pointerup', endVScrollDrag);
vScrollThumb.addEventListener('pointercancel', endVScrollDrag);

// 세로 막대와 같은 이유(좁은 화면에서 확대하면 가로로 다 안 들어올 수
// 있음)지만, 가로는 페이지(window) 스크롤이 아니라 #stageWrap 자체의
// 스크롤이다 — #stageWrap이 overflow-x:auto라서 가로로 넘치는 내용은
// 페이지 밖으로 안 새어나가고 그 안에서만 스크롤된다(세로는 stageWrap에
// overflow-y 제한이 없어서 페이지 스크롤을 그대로 씀 — 그래서 세로/가로가
// 서로 다른 대상을 스크롤해야 함).
const hScrollThumb = document.getElementById('hScrollThumb');
function updateHScrollbar(){
  const viewportW = stageWrap.clientWidth;
  const scrollable = stageWrap.scrollWidth > viewportW + 1;
  hScrollTrack.style.display = scrollable ? 'block' : 'none';
  if (!scrollable) return;
  const trackW = hScrollTrack.clientWidth;
  const thumbW = Math.max(36, trackW * (viewportW / stageWrap.scrollWidth));
  const maxScroll = stageWrap.scrollWidth - viewportW;
  const ratio = maxScroll > 0 ? Math.min(1, Math.max(0, stageWrap.scrollLeft / maxScroll)) : 0;
  hScrollThumb.style.width = thumbW + 'px';
  hScrollThumb.style.left = (ratio * (trackW - thumbW)) + 'px';
}
stageWrap.addEventListener('scroll', updateHScrollbar, { passive: true });
window.addEventListener('resize', updateHScrollbar);
let hDragging = false, hDragStartX = 0, hDragStartScroll = 0;
hScrollThumb.addEventListener('pointerdown', e => {
  hDragging = true;
  hDragStartX = e.clientX;
  hDragStartScroll = stageWrap.scrollLeft;
  try { hScrollThumb.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
hScrollThumb.addEventListener('pointermove', e => {
  if (!hDragging) return;
  const viewportW = stageWrap.clientWidth;
  const trackW = hScrollTrack.clientWidth;
  const thumbW = hScrollThumb.offsetWidth;
  const maxScroll = stageWrap.scrollWidth - viewportW;
  const trackRange = trackW - thumbW;
  if (maxScroll <= 0 || trackRange <= 0) return;
  const deltaX = e.clientX - hDragStartX;
  stageWrap.scrollLeft = hDragStartScroll + deltaX * (maxScroll / trackRange);
  updateHScrollbar();
});
function endHScrollDrag(){ hDragging = false; }
hScrollThumb.addEventListener('pointerup', endHScrollDrag);
hScrollThumb.addEventListener('pointercancel', endHScrollDrag);

function renderDocBlank(){
  docCtx.fillStyle = '#fff';
  docCtx.fillRect(0, 0, docCanvas.width, docCanvas.height);
}

function renderDocImage(){
  docCtx.fillStyle = '#fff';
  docCtx.fillRect(0, 0, docCanvas.width, docCanvas.height);
  docCtx.drawImage(staticImg, 0, 0, docCanvas.width, docCanvas.height);
}

async function renderPdfPage(n){
  const page = await pdfDoc.getPage(n);
  const baseViewport = page.getViewport({ scale: 1 });
  if (n === currentPage || stageCssW === 0) setupStage(baseViewport.width, baseViewport.height);
  const renderViewport = page.getViewport({ scale: docCanvas.width / baseViewport.width });
  docCtx.fillStyle = '#fff';
  docCtx.fillRect(0, 0, docCanvas.width, docCanvas.height);
  await page.render({ canvasContext: docCtx, viewport: renderViewport }).promise;
}

function base64ToUint8Array(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function loadDoc(){
  if (!docId) {
    setupStage(naturalW, naturalH);
    renderDocBlank();
    attachPageListeners(1);
    return;
  }
  const res = await fetch(GAS_URL + '?action=hwphoto&id=' + encodeURIComponent(docId));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '문서를 불러오지 못했습니다.');
  const mime = json.photo.mime || '';
  const data = json.photo.data;
  const isHwpx = docTypeParam === 'hwpx' || /hwpx|zip/i.test(mime);
  if (isHwpx) {
    docKind = 'hwpx';
    await renderHwpxDoc(data);
  } else if (docTypeParam === 'pdf' || mime === 'application/pdf') {
    docKind = 'pdf';
    pdfDoc = await pdfjsLib.getDocument({ data: base64ToUint8Array(data) }).promise;
    totalPages = pdfDoc.numPages;
    currentPage = 1;
    await renderPdfPage(1);
    if (totalPages > 1) {
      document.getElementById('pageNav').style.display = 'flex';
      document.getElementById('pageNavSep').style.display = '';
      document.getElementById('multiPageHint').style.display = '';
      updatePageIndicator();
    }
  } else {
    docKind = 'image';
    const dataUrl = 'data:' + mime + ';base64,' + data;
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = dataUrl; });
    staticImg = img;
    setupStage(img.naturalWidth, img.naturalHeight);
    renderDocImage();
  }
  attachPageListeners(currentPage);
  updateSubmitBarVisibility();
}

// hwpx 문제집을 problembank.html/oedapnotegenerator.html과 같은 방식으로
// (marker 기반, 문항 단위) 파싱해서 오답노트처럼 예쁘게 렌더한다 — 통짜
// PDF/이미지가 아니라 실제 수식·표·이미지가 살아있는 HTML이라 확대해도
// 깨지지 않고, 캔버스로 찍어 보여주는 것보다 훨씬 보기 좋다. 문항 수가
// 많으면 세로로 아주 길어질 수 있어 페이지 개념이 없다 — 그냥 쭉 스크롤.
async function renderHwpxDoc(data){
  const zipData = await JSZip.loadAsync(base64ToUint8Array(data));
  const entry = await parseHwpx(zipData);
  const nums = [...entry.markers.keys()].sort((a, b) => a - b);
  let html = '';
  for (const num of nums) {
    const marker = entry.markers.get(num);
    let body = '';
    try { body = await hwpBodyXmlToHtml(marker.blockXml, entry); } catch (e) {}
    html += '<div class="hwpxQ"><div class="qNumLabel">' + num + '번</div>' + body + '</div>';
  }
  if (!nums.length) html = '<p class="hint">이 문서에서 문항을 찾지 못했습니다.</p>';

  const targetW = Math.min(stageWrap.clientWidth - 20, 900);
  docHtmlLayer.style.display = 'block';
  docHtmlLayer.style.width = targetW + 'px';
  docHtmlLayer.style.height = 'auto';
  docHtmlLayer.innerHTML = html;
  if (window.renderMathInElement) {
    try { renderMathInElement(docHtmlLayer, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
  }
  const measuredH = Math.max(docHtmlLayer.scrollHeight, 200);
  setupStage(targetW, measuredH);
  docCanvas.style.display = 'none';
  docHtmlLayer.style.width = stageCssW + 'px';
  docHtmlLayer.style.height = stageCssH + 'px';
}

function updatePageIndicator(){
  document.getElementById('pageIndicator').textContent = currentPage + ' / ' + totalPages;
  document.getElementById('prevPageBtn').disabled = currentPage <= 1;
  document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
}

async function goToPage(n){
  if (n < 1 || n > totalPages || n === currentPage) return;
  currentPage = n;
  await renderPdfPage(n);
  attachPageListeners(n);
  updatePageIndicator();
  // 쪽마다 따로 제출하는 방식이라(각 쪽 = 별도 제출 건), 1쪽을 제출하고
  // 2쪽으로 넘어오면 "제출 완료" 표시와 비활성화된 버튼이 그대로 남아있어
  // 2쪽을 제출할 방법이 없던 문제 — 쪽을 옮기면 이 쪽 기준으로 다시
  // 깨끗한 상태로 되돌린다.
  const statusEl = document.getElementById('submitStatus');

function pagePath(n){ return 'sessions/' + sessionId + '/pages/' + n + '/strokes'; }

function attachPageListeners(n){
  if (strokesRef) strokesRef.off();
  strokesCache = {};
  myStrokeIds = [];
  if (!db) { renderInkAll(); return; }
  strokesRef = db.ref(pagePath(n));
  strokesRef.on('child_added', snap => { strokesCache[snap.key] = snap.val(); scheduleRedraw(); });
  strokesRef.on('child_changed', snap => { strokesCache[snap.key] = snap.val(); scheduleRedraw(); });
  strokesRef.on('child_removed', snap => { delete strokesCache[snap.key]; scheduleRedraw(); });
}

let redrawScheduled = false;
function scheduleRedraw(){
  if (redrawScheduled) return;
  redrawScheduled = true;
  requestAnimationFrame(() => { redrawScheduled = false; renderInkAll(); });
}

function renderInkAll(){
  if (!inkCtx) return;
  inkCtx.clearRect(0, 0, stageCssW, stageCssH);
  Object.values(strokesCache).forEach(drawStroke);
}

function drawStroke(s){
  if (!s || !s.points || !s.points.length) return;
  if (s.points.length === 1) {
    const [x, y] = s.points[0];
    inkCtx.beginPath();
    inkCtx.fillStyle = s.color || '#000';
    inkCtx.arc(x * stageCssW, y * stageCssH, (s.width || 4) / 2, 0, Math.PI * 2);
    inkCtx.fill();
    return;
  }
  inkCtx.beginPath();
  inkCtx.strokeStyle = s.color || '#000';
  inkCtx.lineWidth = s.width || 4;
  s.points.forEach(([x, y], i) => {
    const px = x * stageCssW, py = y * stageCssH;
    if (i === 0) inkCtx.moveTo(px, py); else inkCtx.lineTo(px, py);
  });
  inkCtx.stroke();
}

function getNormPoint(e){
  const rect = inkCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  return [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))];
}

function distToSeg(p, a, b){
  const [px, py] = p, [ax, ay] = a, [bx, by] = b;
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function eraseAt(pt){
  const threshold = 0.018;
  Object.keys(strokesCache).forEach(id => {
    const s = strokesCache[id];
    if (!s || !s.points || !s.points.length) return;
    let hit = false;
    if (s.points.length === 1) {
      hit = Math.hypot(pt[0] - s.points[0][0], pt[1] - s.points[0][1]) < threshold;
    } else {
      for (let i = 0; i < s.points.length - 1; i++) {
        if (distToSeg(pt, s.points[i], s.points[i + 1]) < threshold) { hit = true; break; }
      }
    }
    if (hit) {
      delete strokesCache[id];
      if (strokesRef) strokesRef.child(id).remove();
      myStrokeIds = myStrokeIds.filter(x => x !== id);
      scheduleRedraw();
    }
  });
}

// 손가락(touch)은 필기 대상에서 아예 빼고 펜(pointerType==='pen')과
// 마우스만 필기로 인식한다 — 손가락으로 살짝만 스쳐도 자꾸 필기가 돼서
// 불편하다는 요청. 확대·축소는 이제 위 CSS(#inkCanvas touch-action:none)
// 덕분에 손가락 제스처가 아예 안 먹으므로 버튼(🔍-/🔍+)으로만 한다.
// 폰에는 펜이 없는 경우가 많아 손가락 필기가 꼭 필요하다는 요청 — 그런데
// 손가락을 무조건 다 필기로 받으면, 태블릿에서 펜으로 쓰는 동안 손바닥이
// 화면에 닿는 예전 문제(화면이 흔들리던 것과는 다른 문제 — 손바닥이 닿은
// 자리에 원치 않는 낙서가 남는 문제)가 되살아난다. 그래서 "펜이 실제로
// 눌려 있는 동안만" 손가락 입력을 무시한다(팜 리젝션) — 폰은 애초에 펜이
// 없으니 이 조건에 전혀 안 걸려서 손가락으로 항상 잘 써지고, 펜이 있는
// 태블릿은 펜을 쓰는 순간에만 손가락이 무시된다. touch-action:none(위
// #inkCanvas 스타일)이 화면 이동/확대는 이미 다 막고 있어서, 손가락으로
// 그림을 그려도 화면이 흔들리는 일은 없다.
let penIsDown = false;
inkCanvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && penIsDown) return;
  if (e.pointerType === 'pen') penIsDown = true;
  try { inkCanvas.setPointerCapture(e.pointerId); } catch (err) { /* 일부 브라우저/입력장치에서 캡처가 안 될 수 있음 — 캔버스 안에서 그리는 데는 지장 없음 */ }
  const pt = getNormPoint(e);
  if (currentTool === 'eraser') { drawing = 'erasing'; eraseAt(pt); return; }
  drawing = true;
  curStrokeId = strokesRef ? strokesRef.push().key : ('local_' + Date.now() + '_' + Math.random().toString(36).slice(2));
  curPoints = [pt];
  strokesCache[curStrokeId] = { by: role, color: penColor, width: penWidth, points: curPoints, t: Date.now() };
  scheduleRedraw();
});
inkCanvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && penIsDown) return;
  if (!drawing) return;
  const pt = getNormPoint(e);
  if (drawing === 'erasing') { eraseAt(pt); return; }
  curPoints.push(pt);
  strokesCache[curStrokeId].points = curPoints;
  scheduleRedraw();
  const now = Date.now();
  if (strokesRef && now - lastPushAt >= 150) {
    lastPushAt = now;
    strokesRef.child(curStrokeId).set({ by: role, color: penColor, width: penWidth, points: curPoints, t: firebase.database.ServerValue.TIMESTAMP });
  }
});
function endStroke(e){
  if (e && e.pointerType === 'pen') penIsDown = false;
  if (drawing === true && curStrokeId) {
    if (strokesRef) {
      strokesRef.child(curStrokeId).set({ by: role, color: penColor, width: penWidth, points: curPoints, t: firebase.database.ServerValue.TIMESTAMP });
    }
    myStrokeIds.push(curStrokeId);
  }
  drawing = false; curStrokeId = null; curPoints = [];
}
inkCanvas.addEventListener('pointerup', endStroke);
inkCanvas.addEventListener('pointercancel', endStroke);

function undoLast(){
  const id = myStrokeIds.pop();
  if (!id) return;
  delete strokesCache[id];
  if (strokesRef) strokesRef.child(id).remove();
  scheduleRedraw();
}

function clearAllStrokes(){
  if (!confirm('이 쪽의 필기를 모두 지울까요? (되돌릴 수 없습니다)')) return;
  const ids = Object.keys(strokesCache);
  strokesCache = {};
  myStrokeIds = [];
  if (strokesRef) ids.forEach(id => strokesRef.child(id).remove());
  scheduleRedraw();
}

document.getElementById('penBtn').addEventListener('click', () => {
  currentTool = 'pen';
  document.getElementById('penBtn').classList.add('active');
  document.getElementById('eraserBtn').classList.remove('active');
  inkCanvas.classList.remove('eraser');
});
document.getElementById('eraserBtn').addEventListener('click', () => {
  currentTool = 'eraser';
  document.getElementById('eraserBtn').classList.add('active');
  document.getElementById('penBtn').classList.remove('active');
  inkCanvas.classList.add('eraser');
});
document.querySelectorAll('.swatch').forEach(sw => {
  if (sw.dataset.color === penColor) sw.classList.add('active');
  sw.addEventListener('click', () => {
    penColor = sw.dataset.color;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
  });
});
document.querySelectorAll('.widthBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    penWidth = Number(btn.dataset.width);
    document.querySelectorAll('.widthBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
document.getElementById('undoBtn').addEventListener('click', undoLast);
document.getElementById('clearBtn').addEventListener('click', clearAllStrokes);
document.getElementById('prevPageBtn').addEventListener('click', () => goToPage(currentPage - 1));
document.getElementById('nextPageBtn').addEventListener('click', () => goToPage(currentPage + 1));
document.getElementById('zoomOutBtn').addEventListener('click', () => changeStageZoom(-STAGE_ZOOM_STEP));
document.getElementById('zoomInBtn').addEventListener('click', () => changeStageZoom(STAGE_ZOOM_STEP));

async function submitBoard(){
  if (role !== 'student') return;
  if (!studentName || !category || !mission) {
    document.getElementById('submitStatus').textContent = '제출 정보가 부족합니다 — 숙제 제출 화면에서 다시 열어주세요.';
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitStatus').textContent = '제출 중...';
  try {
    const out = document.createElement('canvas');
    out.width = docCanvas.width; out.height = docCanvas.height;
    const octx = out.getContext('2d');
    octx.fillStyle = '#fff';
    octx.fillRect(0, 0, out.width, out.height);
    if (docKind === 'hwpx') {
      // hwpx는 docCanvas가 아니라 docHtmlLayer(진짜 HTML)에 내용이 있으니,
      // 제출 직전에 html2canvas로 그 HTML을 통째로 이미지로 찍어서 합성한다
      // (studentnote.html의 오답노트 PDF 저장 기능과 같은 방식) — 문항이
      // 많아 세로로 길어도 캔버스 한 장으로 찍는 데는 문제없다.
      const docShot = await html2canvas(docHtmlLayer, { scale: docCanvas.width / stageCssW, backgroundColor: '#ffffff' });
      octx.drawImage(docShot, 0, 0, out.width, out.height);
    } else {
      octx.drawImage(docCanvas, 0, 0);
    }
    octx.drawImage(inkCanvas, 0, 0);
    const base64 = out.toDataURL('image/jpeg', 0.9).split(',')[1];
    await fetch(GAS_URL, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'submithw', name: studentName, class: className, cohort, category, mission,
        images: [{ data: base64, mime: 'image/jpeg' }],
        whiteboardSession: JSON.stringify({ session: sessionId, docId })
      })
    });
    document.getElementById('submitStatus').textContent = '제출 완료 ✓ 이 창은 닫으셔도 됩니다.';
    // 계속 비활성화 상태로 남아있으면(예전엔 그랬음) 다른 쪽으로 넘어가지
    // 않고 같은 쪽을 다시 고쳐서 다시 제출하고 싶을 때도 방법이 없었다 —
    // 중복 클릭 방지 목적만 채우면 되므로 잠깐 뒤에 다시 눌러쓸 수 있게 한다.
    setTimeout(() => { btn.disabled = false; }, 1200);
  } catch (e) {
    document.getElementById('submitStatus').textContent = '제출 실패: ' + e.message;
    btn.disabled = false;
  }
}
document.getElementById('submitBtn').addEventListener('click', submitBoard);

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(async () => {
    if (docKind === 'hwpx') {
      const targetW = Math.min(stageWrap.clientWidth - 20, 900);
      docHtmlLayer.style.width = targetW + 'px';
      docHtmlLayer.style.height = 'auto';
      const measuredH = Math.max(docHtmlLayer.scrollHeight, 200);
      setupStage(targetW, measuredH);
      docHtmlLayer.style.width = stageCssW + 'px';
      docHtmlLayer.style.height = stageCssH + 'px';
      renderInkAll();
      return;
    }
    if (!naturalW) return;
    setupStage(naturalW, naturalH);
    if (pdfDoc) await renderPdfPage(currentPage);
    else if (staticImg) renderDocImage();
    else renderDocBlank();
    renderInkAll();
  }, 200);
});

function initFirebase(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !cfg.databaseURL) {
    showBanner('⚠️ 아직 실시간 동기화 설정이 안 되어 있어요 — 혼자 필기하고 저장/제출은 되지만, 상대방과 실시간으로는 공유되지 않습니다.');
    return;
  }
  try {
    firebase.initializeApp(cfg);
    db = firebase.database();
    const connBadge = document.getElementById('connBadge');
    db.ref('.info/connected').on('value', snap => {
      const on = !!snap.val();
      connBadge.textContent = on ? '● 실시간 연결됨' : '● 연결 중...';
      connBadge.className = on ? 'on' : 'off';
    });
  } catch (e) {
    showBanner('⚠️ 실시간 동기화 연결 실패: ' + e.message + ' (혼자 필기는 가능합니다)');
  }
}

async function init(){
  initHeader();
  if (!sessionId) {
    showBanner('세션 정보가 없습니다. 숙제 제출 화면에서 다시 열어주세요.');
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  initFirebase();
  try {
    await loadDoc();
  } catch (e) {
    showBanner('문서를 불러오지 못했습니다: ' + e.message);
    setupStage(naturalW, naturalH);
    renderDocBlank();
    attachPageListeners(1);
  }
}
init();
</script>
