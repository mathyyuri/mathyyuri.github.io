<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MATHY YURI SYSTEM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MATHY">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{--font:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;--serif:'Gowun Batang','Noto Serif KR',Batang,serif;--disp:'Playfair Display','Noto Serif KR',serif;--it:'Cormorant Garamond','Playfair Display',serif}
body{--bg:#f5efe4;--bg2:#efe6d6;--card:#fffdf8;--ink:#33281f;--mut:#8b7d6c;--line:#e8dfcf;--ok:#3f8f6b;--warn:#c98a1b;--bad:#c2503f;--sh:0 8px 28px rgba(86,60,28,.07);
 --pri:#3b2d22;--pri2:#b0693f;--acc:#9c5530;--soft:#f4eadb;--soft2:#f9e9e1}
body[data-ac="ds"]{--pri:#3b2d22;--pri2:#b0693f;--acc:#9c5530;--soft:#f4eadb;--soft2:#f9e9e1}
body[data-ac="bd"]{--pri:#21493f;--pri2:#c8566f;--acc:#2f7a67;--soft:#e3f1ea;--soft2:#fbe8ee}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.muted{color:var(--mut)}
.sm{font-size:13px}
.eb{font-family:var(--it);font-style:italic;font-size:19px;color:var(--acc);line-height:1;margin-bottom:4px}
/* ── 로그인 ── */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:22px;background:radial-gradient(900px 420px at 50% -10%,#fff8ea 0%,transparent 70%),var(--bg)}
.login .lg{font-family:var(--disp);font-weight:900;letter-spacing:.04em;font-size:15px;color:var(--ink)}
.login .lg i{font-weight:600;color:#a8853f}
.login h1{font-family:var(--serif);color:var(--ink);margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-.5px;text-align:center;line-height:1.3;font-weight:400}
.login h1 em{font-style:normal;color:var(--acc)}
.login .sub{color:var(--mut);text-align:center;font-size:14px;margin-top:-8px}
.lgrid{display:grid;gap:16px;width:100%;max-width:880px;grid-template-columns:1fr}
@media(min-width:640px){.lgrid{grid-template-columns:1fr 1fr}.lcard{padding:34px 28px}}
.lcard{border:1px solid var(--line);border-radius:28px;padding:30px 26px;text-align:left;background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden;transition:.2s}
.lcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(86,60,28,.12)}
.lcard .t{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.5px}
.lcard .d{margin-top:6px;font-size:14px;color:var(--mut)}
.lcard .cl{margin-top:16px;display:flex;gap:6px;flex-wrap:wrap}
.lcard::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;opacity:.5}
.lcard.ds .t{color:#9c5530}.lcard.ds::after{background:#f6e2cf}
.lcard.bd .t{color:#2f7a67}.lcard.bd::after{background:#d9efe6}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px;width:100%;max-width:880px;box-shadow:var(--sh)}
.lbox h2{margin:0 0 4px;font-family:var(--serif);font-size:22px;color:var(--acc)}
.rolegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.rolebtn{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:18px 10px;font-weight:700;font-size:16px;transition:.15s}
.rolebtn:hover{border-color:var(--acc);background:#fff}
.rolebtn small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.plist{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(2,1fr)}
.pbtn{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:13px 14px;text-align:left;font-weight:700}
.pbtn:hover{border-color:var(--acc);background:#fff}
.pbtn small{display:block;font-weight:400;color:var(--mut)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px}
.demo-note{color:var(--mut);font-size:12px;text-align:center;max-width:520px}
/* ── 레이아웃 ── */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.shell>div{min-width:0}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:#f5efe4ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .brand{font-family:var(--serif);font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acc)}
.top .who{font-size:12px;color:var(--mut);text-align:right;line-height:1.3}
.top button.sw{background:var(--ink);border:0;color:var(--bg);border-radius:20px;padding:6px 13px;font-size:12px}
.main{padding:18px 16px 100px;min-width:0}
.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);background:#fffdf8f2;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(86,60,28,.15);z-index:30;padding:4px}
.bnav button{border:0;background:none;padding:7px 0 6px;font-size:11px;color:var(--mut);position:relative;border-radius:20px}
.bnav .ic{display:block;font-size:19px;line-height:1.25}
.bnav button.on{background:var(--ink);color:var(--bg);font-weight:700}
.bnav .nb,.nav .nb{position:absolute;top:1px;left:calc(50% + 4px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
.ph{margin:6px 0 18px}
.ph h1{margin:0;font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:-.6px;line-height:1.25}
.ph .s{color:var(--mut);font-size:13.5px;margin-top:4px}
.acsw{display:flex;gap:6px;margin-bottom:12px;background:var(--bg2);border-radius:24px;padding:4px}
.acsw button{flex:1;border:0;background:none;border-radius:20px;padding:8px;font-weight:700;font-size:13px;color:var(--mut)}
.acsw button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:7px 15px;font-size:13.5px;font-weight:600;color:var(--mut);transition:.15s}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.cl.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lbl{font-family:var(--it);font-style:italic;font-size:16px;color:var(--acc);margin:0 4px 0 0;align-self:center;flex:none}
@media(min-width:900px){
 body{font-size:16px;line-height:1.75}
 .shell{grid-template-columns:288px minmax(0,1fr)}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--line);color:var(--ink);padding:30px 22px}
 .top,.bnav{display:none}
 .main{padding:40px 54px 70px;max-width:1560px}
 .ph{margin-bottom:24px}
 .ph h1{font-size:38px}
 .sm{font-size:14px}
}
.side .logo{font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1}
.side .logo i{font-weight:600;color:#a8853f}
.side .nm{font-family:var(--serif);font-size:17px;color:var(--acc);margin:8px 0 22px}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav button{position:relative;text-align:left;border:0;background:none;color:var(--ink);padding:12px 16px;border-radius:24px;font-size:16px;font-weight:500;display:flex;gap:12px;align-items:center;transition:.15s}
.nav button:hover{background:#fff8}
.nav button.on{background:var(--ink);color:var(--bg);font-weight:700}
.nav .nb{position:static;margin-left:auto}
.side .me{border-top:1px solid var(--line);padding-top:16px;font-size:13.5px;color:var(--mut)}
.side .me b{display:block;font-size:16px;color:var(--ink);font-family:var(--serif)}
.side .me button{margin-top:12px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:9px;font-size:13.5px}
/* ── 카드·공통 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-family:var(--serif);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.card h3 .more{margin-left:auto;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--acc);background:none;border:0}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.grid .card{margin-bottom:0}
@media(min-width:900px){.grid.g2{grid-template-columns:repeat(2,1fr)}.grid.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1250px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1500px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px) and (max-width:1499px){.grid.g4{grid-template-columns:repeat(2,1fr)}}
.badge{display:inline-block;border-radius:12px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--acc);vertical-align:1px}
.badge.com{background:#f6ebc9;color:#8a6a12}
.badge.new{background:var(--bad);color:#fff}
.t-공지{background:#e8ecf7;color:#3a4f9a}.t-수업결과{background:#e1f1e8;color:#2c7653}.t-응원{background:#fbe3e8;color:#b0405b}
.t-행사{background:#fbe9d6;color:#a65a1a}.t-사진{background:#eee4f7;color:#6c43a3}.t-성적차트{background:#dff0f3;color:#2a6f82}.t-소통{background:#ece7de;color:#5f5444}
.btn{border:0;border-radius:24px;padding:10px 20px;font-weight:700;background:var(--ink);color:var(--bg);transition:.15s}
.btn:hover{opacity:.88}
.btn.sec{background:var(--soft);color:var(--acc)}
.btn.gh{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.rose{background:var(--pri2);color:#fff}
.btn.sm3{padding:6px 14px;font-size:13px}
.btn.dng{background:var(--card);color:var(--bad);border:1px solid #efcdc6}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.kpi{display:flex;gap:12px}
.kpi>div{flex:1;background:var(--bg);border-radius:18px;padding:12px 14px}
.kpi b{display:block;font-family:var(--serif);font-size:26px;letter-spacing:-.5px;line-height:1.3}
.kpi span{font-size:12px;color:var(--mut)}
.bar{height:10px;border-radius:8px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:8px}
.bar.ok i{background:var(--ok)}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:25;border:0;border-radius:30px;background:var(--ink);color:var(--bg);font-weight:700;padding:14px 22px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
@media(min-width:900px){.fab{bottom:34px;right:44px}}
.hero{background:linear-gradient(135deg,var(--soft) 0%,var(--soft2) 100%);border:1px solid var(--line);color:var(--ink);border-radius:30px;padding:30px 30px 28px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff70;z-index:0}
.hero h2,.hero p,.hero .dd{z-index:1}
.lcard.bd .badge{background:#e3f1ea;color:#2f7a67}
.hero h2{margin:0;font-family:var(--serif);font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:-.6px;line-height:1.35;position:relative}
.hero p{margin:6px 0 0;color:var(--mut);font-size:14px;position:relative}
.hero .dd{display:inline-block;margin-top:16px;background:var(--ink);color:var(--bg);border-radius:22px;padding:6px 16px;font-weight:600;font-size:14px;position:relative}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .tm{flex:none;min-width:58px;font-family:var(--serif);font-weight:700;color:var(--acc);font-size:15px}
.li .tx{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pri2);display:inline-block;margin-right:7px}
/* ── 소식 ── */
.feedwrap{display:grid;gap:20px}
@media(min-width:1200px){.feedwrap{grid-template-columns:minmax(0,1fr) 380px;align-items:start}.rail{position:sticky;top:24px}}
@media(max-width:1199px){.rail{display:none}}
.post{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
.post.pin{background:linear-gradient(180deg,#fffaf0,var(--card));border-color:#e6d3a8}
.post .hd{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.post h4{margin:10px 0 2px;font-family:var(--serif);font-size:20px;letter-spacing:-.4px;line-height:1.45;font-weight:700}
.post .meta{font-size:12.5px;color:var(--mut)}
.post .bd{margin-top:10px;white-space:normal;max-width:78ch}
.post .bd.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.post img.ph2{width:100%;max-width:640px;border-radius:18px;margin-top:12px;display:block;border:1px solid var(--line)}
.post .ft{display:flex;gap:16px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);flex-wrap:wrap}
.post .ft button{background:none;border:0;color:var(--mut);padding:0;font-size:13px}
.post .ft .rd{color:var(--acc);font-weight:700}
.cm{margin-top:12px;background:var(--bg);border-radius:18px;padding:12px 16px}
.cm .c{padding:7px 0;font-size:14px}
.cm .c b{margin-right:6px}
.cm .c span{color:var(--mut);font-size:12px;margin-left:6px}
.cin{display:flex;gap:8px;margin-top:8px}
.cin input{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 16px;min-width:0;background:#fff}
/* ── 달력 ── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.cal .h{background:var(--bg2);text-align:center;font-family:var(--it);font-style:italic;font-size:15px;padding:6px 0;color:var(--acc)}
.cal .d{background:var(--card);min-height:64px;padding:4px;font-size:12px;position:relative;border:0;text-align:left;vertical-align:top}
.cal .d.o{background:#faf5ec;color:#c5baa8}
.cal .d.t .n{background:var(--ink);color:var(--bg);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cal .d.sel{outline:2px solid var(--pri2);outline-offset:-2px}
.cal .d .n{font-weight:700;font-size:12px;display:inline-block;margin-bottom:2px}
.cal .e{display:block;font-size:10.5px;line-height:1.25;padding:1px 4px;border-radius:5px;margin-top:2px;background:var(--soft);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .e.ev{background:var(--soft2);color:#a14659}
.cal .e.cl{background:#f7ecc9;color:#8a6a12}
@media(min-width:900px){.cal .d{min-height:108px;padding:7px 9px;font-size:13px}.cal .e{font-size:12px;padding:2px 7px}}
.mon{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mon b{font-family:var(--serif);font-size:22px}
/* ── 영상 ── */
.vid{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card);text-align:left;padding:0;display:block;width:100%;box-shadow:var(--sh)}
.vid .th{aspect-ratio:16/9;background:linear-gradient(135deg,var(--acc),var(--pri));display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;position:relative}
.vid .th small{position:absolute;right:10px;bottom:8px;background:#0007;font-size:12px;border-radius:8px;padding:0 8px}
.vid .in{padding:12px 16px 16px}
/* ── 미션 ── */
.ms{display:flex;gap:12px;align-items:center}
.ck{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:16px;color:#fff}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck[disabled]{cursor:default}
.dd2{font-weight:800;font-family:var(--serif)}
.dd2.late{color:var(--bad)}.dd2.soon{color:var(--warn)}
.stlist{display:grid;gap:8px;margin-top:12px;grid-template-columns:repeat(2,1fr)}
.stb{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:8px 12px;background:#fff;font-size:14px;text-align:left}
.stb.on{background:#e6f4ec;border-color:#a9d6bd}
/* ── 성적 ── */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--bg);padding:9px 10px;text-align:left;font-size:12.5px;color:var(--mut);font-weight:600}
.tbl td{padding:10px;border-top:1px solid var(--line)}
.tbl input{width:72px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.tbl .bw{width:34%}
select.sel{border:1px solid var(--line);border-radius:20px;padding:9px 14px;background:#fff;max-width:100%}
.svgc{width:100%;height:auto;display:block}
/* ── 채팅 ── */
.chatw{display:grid;gap:16px}
@media(min-width:900px){.chatw{grid-template-columns:350px 1fr;align-items:start}.chatw .back{display:none}}
.tl{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--sh)}
.tl button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:var(--card);padding:13px 16px}
.tl button:first-child{border-top:0}
.tl button.on{background:var(--soft)}
.tl .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700}
.tl .av.p{background:var(--pri2);color:#fff}
.tl .tx{flex:1;min-width:0}

function examsFor(st){return DB.exams.filter(e=>(e.ac==='all'||e.ac===st.ac)&&(!e.cls||e.cls===st.cls));}
function scorePts(st){const out=[];examsFor(st).filter(e=>e.sc[st.id]!=null).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
 const peers=stuList(st.ac).filter(s=>s.cls===st.cls&&e.sc[s.id]!=null);
 out.push({n:e.n,short:e.short,v:e.sc[st.id],avg:peers.length?peers.reduce((a,s)=>a+e.sc[s.id],0)/peers.length:null});});return out;}
function chartSVG(pts){
 const W=600,H=240,pl=34,pr=16,pt=16,pb=34,iw=W-pl-pr,ih=H-pt-pb;
 const X=i=>pl+(pts.length===1?iw/2:iw*i/(pts.length-1)),Y=v=>pt+ih*(1-v/100);
 let s='<svg class="svgc" viewBox="0 0 '+W+' '+H+'">';
 [0,25,50,75,100].forEach(g=>{s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#e3e6ee"/><text x="'+(pl-6)+'" y="'+(Y(g)+4)+'" font-size="11" fill="#6a7388" text-anchor="end">'+g+'</text>';});
 const line=(key,style)=>{const p=pts.map((q,i)=>q[key]==null?null:X(i)+','+Y(q[key])).filter(Boolean).join(' ');return '<polyline points="'+p+'" fill="none" style="'+style+'" stroke-width="3" stroke-linejoin="round"/>';};
 s+=line('avg','stroke:#9aa3b8;stroke-dasharray:6 5')+line('v','stroke:var(--pri)');
 pts.forEach((q,i)=>{s+='<circle cx="'+X(i)+'" cy="'+Y(q.v)+'" r="5.5" style="fill:var(--pri)" stroke="#fff" stroke-width="2"/><text x="'+X(i)+'" y="'+(Y(q.v)-11)+'" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--pri)">'+q.v+'</text><text x="'+X(i)+'" y="'+(H-10)+'" font-size="12" fill="#6a7388" text-anchor="middle">'+esc(q.short)+'</text>';});
 return s+'</svg>';
}

function cutWhite(cv){
 const ctx=cv.getContext('2d'),w=cv.width,h=cv.height,im=ctx.getImageData(0,0,w,h),d=im.data;
 const isW=k=>d[k*4]>=244&&d[k*4+1]>=244&&d[k*4+2]>=244&&d[k*4+3]>200;
 if(!(isW(0)&&isW(w-1)&&isW((h-1)*w)&&isW(h*w-1)))return false;
 const seen=new Uint8Array(w*h),st=[];
 const push=(x,y)=>{const k=y*w+x;if(!seen[k]&&isW(k)){seen[k]=1;st.push(k);}};
 for(let x=0;x<w;x++){push(x,0);push(x,h-1);}for(let y=0;y<h;y++){push(0,y);push(w-1,y);}
 while(st.length){const k=st.pop(),x=k%w,y=(k/w)|0;d[k*4+3]=0;if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);if(y>0)push(x,y-1);if(y<h-1)push(x,y+1);}
 ctx.putImageData(im,0,0);return true;}

function okStyle(st){
 const out=[];String(st||'').split(';').forEach(d=>{const i=d.indexOf(':');if(i<0)return;const k=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim();
  if(k==='color'&&/^(#[0-9a-f]{3,8}|rgb\([\d\s,.%]+\)|[a-z]+)$/i.test(v))out.push('color:'+v);
  else if(k==='font-size'&&/^(\d{1,2}(\.\d+)?(px|pt|em|rem|%)|xx-small|x-small|small|medium|large|x-large|xx-large)$/i.test(v))out.push('font-size:'+v);
  else if(k==='font-weight'&&/^(bold|normal|[1-9]00)$/i.test(v))out.push('font-weight:'+v);
  else if(k==='font-style'&&/^(italic|normal)$/i.test(v))out.push('font-style:'+v);
  else if(k==='text-decoration'&&/^(underline|line-through|none)$/i.test(v))out.push('text-decoration:'+v);});
 return out.join(';');
}
function cleanNode(n){
 [].slice.call(n.childNodes).forEach(c=>{
  if(c.nodeType===3)return;
  if(c.nodeType!==1){n.removeChild(c);return;}
  cleanNode(c);
  const t=c.tagName;
  if(t==='IMG'){const mid=c.getAttribute('data-mid');[].slice.call(c.attributes).forEach(a=>c.removeAttribute(a.name));if(/^\d{1,12}$/.test(mid||''))c.setAttribute('data-mid',mid);else n.removeChild(c);return;}
  if(!OK_TAGS[t]){while(c.firstChild)n.insertBefore(c.firstChild,c);n.removeChild(c);return;}
  let st=okStyle(c.getAttribute('style'));
  if(t==='FONT'){const col=c.getAttribute('color'),sz=c.getAttribute('size');const sp=document.createElement('span');
   const map={'1':'x-small','2':'small','3':'medium','4':'large','5':'x-large','6':'xx-large','7':'xx-large'};
   let s2=st;if(col&&/^(#[0-9a-f]{3,8}|[a-z]+)$/i.test(col))s2+=(s2?';':'')+'color:'+col;if(sz&&map[sz])s2+=(s2?';':'')+'font-size:'+map[sz];
   if(s2)sp.setAttribute('style',s2);while(c.firstChild)sp.appendChild(c.firstChild);n.replaceChild(sp,c);return;}
  [].slice.call(c.attributes).forEach(a=>c.removeAttribute(a.name));
  if(st)c.setAttribute('style',st);
 });
}

function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}

 if(perm!=='granted'){toast('알림이 막혀 있어요. 브라우저(또는 휴대폰) 설정에서 이 사이트의 알림을 허용해 주세요');return;}
 try{

function diagRes(l){
 if(l.pending)return '<span class="muted">응답 기다리는 중… (잠시 뒤 [새로고침])</span>';
 if(l.err)return '<b style="color:#b84a4a">알림 서버에 닿지 못했어요</b><div class="muted sm">'+esc(l.err)+'</div>';
 if(l.status==null)return '<span class="muted">'+esc(l.note||'')+'</span>';
 let o=null;try{o=JSON.parse(l.resp||'');}catch(e){}
 if(l.status===200){const n=o&&o.sent;return n>0?'<b style="color:#2f7d5b">기기 '+n+'대에 보냈어요</b>'+(o.dead?'<div class="muted sm">꺼진 기기 '+o.dead+'대는 정리했어요</div>':''):'<b style="color:#b84a4a">보냈지만 기기에 닿지 못했어요</b><div class="muted sm">'+esc(JSON.stringify((o&&o.errors)||[]))+' — 오류 403·401 이면 알림 키(VAPID) 두 개가 서로 맞지 않는 거예요</div>';}
 if(l.status===401)return '<b style="color:#b84a4a">비밀 문구가 달라요</b><div class="muted sm">Supabase Secrets 의 PUSH_SECRET 과 push_config 에 넣은 문구가 같아야 해요</div>';
 if(l.status===404)return '<b style="color:#b84a4a">push-send 함수를 찾지 못했어요</b><div class="muted sm">push_config 의 주소와 함수 이름을 확인해 주세요</div>';
 if(l.status>=500)return '<b style="color:#b84a4a">함수 안에서 오류('+l.status+')</b><div class="muted sm">'+esc((o&&o.error)||l.resp||'')+'</div>';

}

function pctOf(h){return h.tot>0&&h.score!=null?h.score*100/h.tot:null;}
function hCnt(h){return msCnt(h.ox,h.n||String(h.ox||'').length);}
const GRAPH_FROM='2026-10-22';   // 누적 성적 그래프·자동 한마디는 이 날짜 이후 기록부터
function autoNote(name,H){
 const L=(H||[]).filter(h=>h.tot>0&&h.score!=null&&!h.old&&String(h.date)>=GRAPH_FROM);
 if(!L.length)return name+' 학생의 미션 기록이 쌓이면 이곳에서 학습 상황을 알려 드려요.';
 const R=L.slice(-5),avg=a=>a.reduce((x,y)=>x+y,0)/a.length,r1=v=>Math.round(v*10)/10;
 const mine=avg(R.map(pctOf)),ca=R.map(h=>h.avg!=null?h.avg*100/h.tot:null).filter(v=>v!=null),cls=ca.length?avg(ca):null,diff=cls==null?null:mine-cls;
 const last=R[R.length-1],prev=R.length>1?R[R.length-2]:null,trend=prev?pctOf(last)-pctOf(prev):0;
 const out=[];
 if(diff==null)out.push('최근 '+R.length+'개 미션 평균 '+r1(mine)+'%예요.');
 else if(diff>=8)out.push('최근 '+R.length+'개 미션 평균 '+r1(mine)+'%로 반 평균보다 '+r1(diff)+'%p 높아요. 탄탄하게 잘 따라오고 있어요.');
 else if(diff>=-3)out.push('최근 '+R.length+'개 미션 평균 '+r1(mine)+'%로 반 평균 수준이에요. 꾸준히 유지하고 있어요.');
 else out.push('최근 '+R.length+'개 미션 평균 '+r1(mine)+'%로 반 평균보다 '+r1(-diff)+'%p 낮아요. 기본 개념을 다시 짚어 볼 때예요.');
 if(trend>=10)out.push('직전 미션보다 '+r1(trend)+'%p 올라 상승세예요.');
 else if(trend<=-10)out.push('직전 미션보다 '+r1(-trend)+'%p 내려갔어요. 실수한 유형을 함께 점검해요.');
 const cur=L.filter(h=>!h.old).slice(-3);
 if(cur.length){let x=0,c=0;cur.forEach(h=>{const k=hCnt(h);x+=k.x;if(k.x===0&&k.b===0)c++;});
  out.push(x===0?'남은 오답이 없어요. 오답 정리를 끝까지 해냈어요.':'남은 오답이 '+x+'문제 있어요. 오답노트로 정리하면 점수가 더 올라가요.');
  out.push('최근 미션 '+cur.length+'개 중 '+c+'개를 클리어했어요.');}
 return name+' 학생은 '+out.join(' ');
}

 for(let st=0;st<n;st+=10){let c='';for(let q=st;q<Math.min(n,st+10);q++){const ch=(h.ox||'')[q];c+='<div class="pc'+(ch==='O'||ch==='X'||ch==='T'?' p'+ch:'')+'"><i>'+(q+1)+'</i><b>'+(sym[ch]||'·')+'</b></div>';}g+='<div class="pgrp">'+c+'</div>';}
 return '<div class="pgrid">'+g+'</div>';
}
function autoMissionNote(h){
 const c=hCnt(h),pc=pctOf(h),n=h.n||String(h.ox||'').length,det=RP&&RP.det&&RP.det[h.id],r1=v=>Math.round(v*10)/10,out=[];
 out.push(r1(h.score)+'점('+Math.round(pc)+'%)으로 '+h.cnt+'명 중 '+h.rk+'위예요.');
 if(h.avg!=null){const d=h.score-h.avg;out.push(Math.abs(d)<0.5?'반 평균과 비슷해요.':d>0?'반 평균보다 '+r1(d)+'점 높아요.':'반 평균보다 '+r1(-d)+'점 낮아요.');}
 if(c.x===0&&c.b===0&&c.o+c.t>0)out.push(c.t?'틀렸던 '+c.t+'문제를 모두 고쳐서 클리어했어요.':'모두 맞혀서 클리어했어요.');
 else if(c.x>0){const nums=[],U={};for(let i=0;i<n;i++)if((h.ox||'')[i]==='X'){nums.push(i+1);const u=det&&det.items[i]&&det.items[i].unit;if(u)U[u]=(U[u]||0)+1;}
  const ks=Object.keys(U).sort((a,b)=>U[b]-U[a]).slice(0,2);
  out.push('남은 오답이 '+c.x+'문제예요('+nums.slice(0,6).join(', ')+'번'+(nums.length>6?' 등':'')+').'+(ks.length?' '+ks.map(k=>k+' '+U[k]+'문제').join(', ')+'에서 틀렸어요.':'')+' 오답노트로 정리해 보세요.');}
 else if(c.b>0)out.push('기록이 비어 있는 문항이 '+c.b+'개 있어요.');
 return out.join(' ');
}

function barPair(L){
 const W=640,H=240,pl=34,pr=10,pt=18,pb=38,n=L.length,gw=(W-pl-pr)/n,bw=Math.max(8,Math.min(26,gw/2-4)),Y=v=>pt+(H-pt-pb)*(1-Math.max(0,Math.min(100,v))/100);
 let g='';[0,25,50,75,100].forEach(v=>{g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e6e9f1"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10.5" fill="#8a8f9e">'+v+'</text>';});
 L.forEach((h,i)=>{const cx=pl+gw*i+gw/2,my=pctOf(h),av=h.avg!=null?h.avg*100/h.tot:null;
  g+='<rect x="'+(cx-bw-1)+'" y="'+Y(my)+'" width="'+bw+'" height="'+(Y(0)-Y(my))+'" rx="3" fill="#b76e79"><title>'+esc(h.name+' · 내 '+Math.round(my)+'%')+'</title></rect><text x="'+(cx-bw/2-1)+'" y="'+(Y(my)-4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#b76e79">'+Math.round(my)+'</text>';
  if(av!=null)g+='<rect x="'+(cx+1)+'" y="'+Y(av)+'" width="'+bw+'" height="'+(Y(0)-Y(av))+'" rx="3" fill="#9aa1b3"><title>'+esc(h.name+' · 반 평균 '+Math.round(av)+'%')+'</title></rect><text x="'+(cx+bw/2+1)+'" y="'+(Y(av)-4)+'" text-anchor="middle" font-size="10" fill="#6a7388">'+Math.round(av)+'</text>';
  g+='<text x="'+cx+'" y="'+(H-pb+14)+'" text-anchor="middle" font-size="10" fill="#6a7388">'+esc(String(h.date).slice(5).replace('-','/'))+'</text><text x="'+cx+'" y="'+(H-pb+26)+'" text-anchor="middle" font-size="9.5" fill="#8a8f9e">'+esc(String(h.name).replace(/^교과서 미션 : |^모의 기출 : /,'').slice(0,6))+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>';
}
function unitBars(L){
 const U={};
 L.forEach(h=>{const d=RP.det&&RP.det[h.id];if(!d)return;d.items.forEach((it,i)=>{const u=it.unit||'기타',x=U[u]=U[u]||{mo:0,mt:0,co:0,ct:0},ch=(h.ox||'')[i];if(ch==='O'||ch==='X'||ch==='T'){x.mt++;if(ch==='O')x.mo++;}
  d.roster.forEach(r=>{const c=r.ox[i];if(c==='O'||c==='X'||c==='T'){x.ct++;if(c==='O')x.co++;}});});});
 const ks=Object.keys(U).filter(k=>U[k].mt>0).sort((a,b)=>U[b].mt-U[a].mt).slice(0,8);
 if(!ks.length)return '';
 return ks.map(k=>{const x=U[k],m=Math.round(x.mo*100/x.mt),c=x.ct?Math.round(x.co*100/x.ct):null;
  return '<div style="margin:8px 0"><div class="sm"><b>'+esc(k)+'</b> <span class="muted">'+x.mt+'문항</span></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:'+m+'%;background:#b76e79"></i></div><b style="width:38px;text-align:right;color:#b76e79">'+m+'%</b></div>'+
   (c!=null?'<div style="display:flex;align-items:center;gap:8px;margin-top:3px"><div style="flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:'+c+'%;background:#9aa1b3"></i></div><b style="width:38px;text-align:right;color:#6a7388">'+c+'%</b></div>':'')+'</div>';}).join('');
}
function donut(o,t,x){
 const tot=o+t+x;if(!tot)return '';const R=48,C=2*Math.PI*R;let off=0,svg='<svg viewBox="0 0 120 120" width="130" height="130"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="#eee" stroke-width="18"/>';
 [[o,'#5b8def'],[t,'#f0b429'],[x,'#e5566d']].forEach(a=>{const len=C*a[0]/tot;if(len>0){svg+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+a[1]+'" stroke-width="18" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';off+=len;}});
 return svg+'<text x="60" y="58" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2f3a">'+Math.round(o*100/tot)+'%</text><text x="60" y="74" text-anchor="middle" font-size="9" fill="#8a8f9e">정답률</text></svg>';
}

async function saveOx(){
 const e=DB.exams.find(x=>x.id===$('#oxe').value);if(!e)return;
 const pool=stuList(e.ac==='all'?curAc():e.ac).filter(s=>!e.cls||s.cls===e.cls),rows=[],bad=[];
 const norm=t=>String(t).replace(/\s/g,'').toLowerCase();
 $('#oxt').value.split('\n').forEach(l=>{l=l.trim();if(!l)return;
  const m=l.match(/^(\S+)[\s,:\t]+(.+)$/);if(!m){bad.push(l.slice(0,12)+' (형식)');return;}
  const hit=pool.filter(s=>norm(s.name)===norm(m[1]));
  if(hit.length!==1){bad.push(m[1]+(hit.length?' (이름 중복)':' (명단에 없음)'));return;}
  let ox='';for(const c of m[2]){if('Oo○ㅇ1'.indexOf(c)>=0)ox+='O';else if('Xx✕×0'.indexOf(c)>=0)ox+='X';}
  if(ox.length!==e.items.length){bad.push(m[1]+' (문항 수 '+ox.length+'개 ≠ '+e.items.length+'개)');return;}
  rows.push({sid:hit[0].id,ox:ox});});
 if(!rows.length){$('#oxr').innerHTML='<div class="note">저장할 줄이 없어요'+(bad.length?'<br>'+esc(bad.join(' / ')):'')+'</div>';return;}
 const j=await mut('results_save',{exam_id:e.id,rows:rows},{render:false});
 if(!j||!j.ok)return;
 S.rex=e.id;render();
 $('#oxr').innerHTML='<div class="note">'+j.n+'명 저장했어요'+(bad.length?'<br>못 넣은 줄: '+esc(bad.join(' / ')):'')+'</div>';
}

 const known=['다항식','방정식과 부등식','경우의 수','행렬','도형의 방정식','집합과 명제','함수와 그래프','함수'];
 (STATS&&STATS.units||[]).forEach(u=>{if(known.indexOf(u.unit)<0)known.push(u.unit);});
 let h='<div class="note">진짜 <b>모의고사 기출</b> 풀이영상만 올려요. <b>단원</b>별로 첫 화면(홈)에 보여요. 유튜브(일부공개) 주소를 붙여 넣으세요.</div>'+
  '<div class="card"><h3>영상 추가</h3><div class="row wrap"><input type="text" id="pv_u" list="pv_ul" placeholder="단원 (예: 함수)" style="border:1px solid var(--line);border-radius:16px;padding:10px 14px;width:170px"><datalist id="pv_ul">'+known.map(k=>'<option value="'+esc(k)+'">').join('')+'</datalist>'+
  '<input type="text" id="pv_t" placeholder="제목 (예: 2025 9월 모평 21번)" style="border:1px solid var(--line);border-radius:16px;padding:10px 14px;flex:1;min-width:200px"><input type="text" id="pv_l" placeholder="https://youtu.be/…" style="border:1px solid var(--line);border-radius:16px;padding:10px 14px;flex:1;min-width:200px"><button class="btn" data-a="pvadd">추가</button></div></div>';
 if(!L.length)return h+'<div class="card"><div class="empty">아직 올린 영상이 없어요</div></div>';
 units.forEach(u=>{h+='<div class="card"><h3>'+esc(u)+' <span class="badge">'+L.filter(v=>v.unit===u).length+'개</span></h3><table class="tbl"><tr><th>제목</th><th>주소</th><th></th></tr>'+
  L.map((v,i)=>v.unit!==u?'':'<tr><td><b>'+esc(v.title||'')+'</b></td><td class="sm">'+esc(String(v.url).replace(/^https?:\/\//,'').slice(0,40))+(ytId(v.url)?'':' <span style="color:#b84a4a">(유튜브 주소가 아니에요)</span>')+'</td><td><button class="btn sm3 gh" data-a="pvmv" data-i="'+i+'" data-d="-1">▲</button> <button class="btn sm3 gh" data-a="pvmv" data-i="'+i+'" data-d="1">▼</button> <button class="btn sm3 dng" data-a="pvdel" data-i="'+i+'">삭제</button></td></tr>').join('')+'</table></div>';});
 return h;
}

/* ── 메시지: 사진 · 파일 (끌어다 놓기 · 붙여넣기 · 첨부 버튼) ── */
let ATT=[];const MIMG={};
const FILE_URL=API_URL.replace('ac_api','ac_file');
const FIN=document.createElement('input');FIN.type='file';FIN.multiple=true;FIN.style.display='none';FIN.accept='.jpg,.jpeg,.png,.gif,.webp,.heic,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.hwpx,.txt,.csv,.zip';
document.body.appendChild(FIN);FIN.onchange=()=>{addFiles(FIN.files);FIN.value='';};
function fmtSize(n){return n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';}
function attBar(){return ATT.map((a,i)=>'<span class="attc">'+esc(a.name)+' <small>'+fmtSize(a.size)+'</small><button type="button" data-a="attdel" data-i="'+i+'">×</button></span>').join('');}
function attHtml(m){
 if(!m.a||!m.a.length)return '';
 return m.a.map(f=>/^image\//.test(f.m)&&!/heic/.test(f.m)?'<img class="mimg" data-fid="'+f.id+'" src="'+(MIMG[f.id]||BLANK)+'" alt="'+esc(f.n)+'">':'<button type="button" class="mfile" data-a="dlfile" data-fid="'+f.id+'" data-n="'+esc(f.n)+'">'+esc(f.n)+' <small>'+fmtSize(f.z)+'</small> · 받기</button>').join('');
}
async function fileApi(id){
 try{const r=await fetch(FILE_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:API_KEY,Authorization:'Bearer '+API_KEY},body:JSON.stringify({p_token:TOKEN,p_id:+id})});return r.ok?await r.json():null;}catch(e){return null;}
}
async function loadMsgFiles(){
 for(const el of [...document.querySelectorAll('img.mimg[data-fid]')]){
  const id=el.dataset.fid;if(MIMG[id]){el.src=MIMG[id];continue;}
  const j=await fileApi(id);if(j&&j.ok){MIMG[id]=j.data;el.src=j.data;el.style.minHeight='0';}
 }
}
function dataBlobUrl(d,type){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:type||'application/octet-stream'}));}
function readFile(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f);});}
async function prepImage(f){
 const d=await readFile(f);if(!d)return null;
 if(!/^image\/(jpeg|png|webp)$/.test(f.type))return {name:f.name,data:d,size:f.size};
 return new Promise(res=>{const im=new Image();im.onload=()=>{const M=1600,w=im.width,h=im.height;if(w<=M&&h<=M&&f.size<900000){res({name:f.name,data:d,size:f.size});return;}
  const k=Math.min(1,M/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const out=c.toDataURL('image/jpeg',0.85);res({name:f.name.replace(/\.\w+$/,'')+'.jpg',data:out,size:Math.round(out.length*3/4)});};
  im.onerror=()=>res({name:f.name,data:d,size:f.size});im.src=d;});
}
async function addFiles(list){
 const ok=/\.(jpe?g|png|gif|webp|heic|pdf|docx?|xlsx?|pptx?|hwpx?|txt|csv|zip)$/i;
 for(const f of [].slice.call(list)){
  if(ATT.length>=5){toast('파일은 한 번에 5개까지예요');break;}
  const nm=f.name||('붙여넣은 사진.'+((f.type||'image/png').split('/')[1]||'png'));
  if(!ok.test(nm)){toast('보낼 수 없는 파일이에요: '+nm);continue;}
  if(f.size>3*1048576&&!/^image\//.test(f.type)){toast('파일이 너무 커요 (3MB까지): '+nm);continue;}
  const a=/^image\//.test(f.type)?await prepImage(f):{name:nm,data:await readFile(f),size:f.size};
  if(!a||!a.data){toast('파일을 읽지 못했어요: '+nm);continue;}
  if(a.data.length>4200000){toast('사진이 너무 커요 (3MB까지): '+nm);continue;}
  if(!a.name||a.name==='image.png')a.name=nm;
  ATT.push(a);
 }
 const b=$('#attbar');if(b)b.innerHTML=attBar();
}
['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{if(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types||[],'Files')>=0)e.preventDefault();}));
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.chat');if(c)c.classList.add('dz');});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.chat');if(c&&!c.contains(e.relatedTarget))c.classList.remove('dz');});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.chat');if(!c)return;c.classList.remove('dz');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});
document.addEventListener('paste',e=>{if(e.target&&e.target.id==='min'&&e.clipboardData&&e.clipboardData.files&&e.clipboardData.files.length){e.preventDefault();addFiles(e.clipboardData.files);}});
document.addEventListener('click',e=>{const im=e.target.closest&&e.target.closest('img.mimg');if(im&&MIMG[im.dataset.fid]){window.open(dataBlobUrl(MIMG[im.dataset.fid]),'_blank');}});
async function sendMsg(key){
 const i=$('#min'),tx=i.value.trim();if(!tx&&!ATT.length)return;const p=key.split(':');
 i.disabled=true;const sb=document.querySelector('[data-a="send"]');if(sb)sb.disabled=true;
 const files=ATT.map(a=>({name:a.name,data:a.data}));
 const j=await mut('msg_send',isStaff()?{sid:p[0],kind:p[1],text:tx,files:files}:{text:tx,files:files});
 if(j&&j.ok!==false){ATT=[];const ab=$('#attbar');if(ab)ab.innerHTML=attBar();}
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;const n=$('#min');if(n&&(!j||j.ok===false)){n.disabled=false;n.value=tx;if(sb)sb.disabled=false;}else if(n)n.focus();
}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target.closest('[data-enter]');if(!t)return;
 if(t.dataset.enter==='comment'){const b=document.querySelector('[data-a="comment"][data-id="'+t.dataset.id+'"]');if(b)b.click();}
 if(t.dataset.enter==='send')sendMsg(t.dataset.key);});
document.addEventListener('change',async e=>{const t=e.target.closest('[data-ch]');if(!t)return;const c=t.dataset.ch;
 if(c==='exsel'){S.exsel=t.value;render();}
 if(c==='rpsel'){S.rpSid=t.value;RP=undefined;render();}
 if(c==='nfrom'||c==='nto'){if(me().role!=='admin'){toast('원장만 바꿀 수 있어요');render();return;}DB.set.notif[c==='nfrom'?'from':'to']=t.value;const j=await saveNotif();if(j&&j.ok)toast('저장했어요');}
 if(c==='wscope'){const o=scopeObj(t.value);$('#wncnt').textContent='받는 학부모 '+targetsOf(o).filter(x=>x.role==='parent').length+'명';}
 if(c==='rex'){S.rex=t.value;S.rstu='';render();}
 if(c==='rstu'){S.rstu=t.value;render();}
 if(c==='season'){const cur=DB.set.season,base=(cur&&typeof cur==='object')?cur:{},o=Object.assign({ds:5,bd:0},base);o[curAc()]=+t.value;await mut('settings_set',{key:'season',value:o});}
 if(c==='score'){await mut('score_set',{exam_id:t.dataset.eid,sid:t.dataset.sid,score:t.value.trim()===''?null:Math.max(0,Math.min(100,+t.value))});toast('점수를 저장했어요');}
 if(c==='stuac'){$('#sf_c').innerHTML=classOpts(t.value,null);}
 if(c==='wimg'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.tmpImg=cv.toDataURL('image/jpeg',.72);$('#wpv').innerHTML='<img class="pv" src="'+S.tmpImg+'">';};im.src=r.result;};r.readAsDataURL(f);}
});

 $('#app').innerHTML='<div class="landing"><div class="lmain"><h1 class="big">MATHY <i>YURI</i></h1><div class="syslbl">SYSTEM</div><div class="sko" style="margin-top:14px">불러오는 중…</div></div></div>';
 const p=await api('public');
 if(p&&p.ok){PUB.season=p.season;PUB.face=p.face||null;applyClasses(p.classes);PUB.pv=Array.isArray(p.pastvideos)?p.pastvideos:[];PUB.ok=true;}else PUB.ok=false;
 if(TOKEN&&PUB.ok){const ok=await resync();if(!ok){TOKEN=null;try{localStorage.removeItem(TOKEN_KEY);}catch(e){}}}
 render(0);
