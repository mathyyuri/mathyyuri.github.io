<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>스커담 관리자 | MATHY YURI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0d0d0d;--ink:#1a1816;--cream:#f6efe2;--cream-2:#ede3cf;--card:#fbf7ee;--mint:#a8dcc8;--mint-d:#2d7a64;--pink:#eab4c0;--pink-d:#b8566d;--line:#d9ccb3;--muted:#7b7467;
--serif:'Noto Serif KR','Playfair Display',serif;--disp:'Playfair Display','Noto Serif KR',serif;--sans:'Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
[hidden]{display:none!important}
button{font-family:var(--sans);cursor:pointer}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);padding:20px}
.lbox{background:var(--card);border-radius:18px;padding:30px 24px;width:100%;max-width:380px}
.lbox .eyebrow{font-family:var(--disp);letter-spacing:.24em;font-size:11px;color:var(--mint-d)}
.lbox h1{font-family:var(--serif);font-size:22px;margin:6px 0 18px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;font-family:var(--sans);font-size:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--mint-d);box-shadow:0 0 0 3px rgba(168,220,200,.45)}
.lbox input{margin-bottom:10px}
.btn{border:0;background:var(--black);color:var(--cream);border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.mint{background:var(--mint);color:var(--black)}
.btn.sm{padding:8px 12px;font-size:13px}
.msg{color:var(--pink-d);font-size:13.5px;margin-top:10px}

/* top */
.top{background:var(--black);color:var(--cream);padding:16px 0;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:18px}
.top h1 small{display:block;font-family:var(--disp);letter-spacing:.2em;font-size:10px;color:var(--mint);font-weight:500}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.top .btn.ghost{color:var(--cream);border-color:rgba(246,239,226,.5)}

/* summary */
.sec-title{font-family:var(--disp);font-style:italic;color:var(--pink-d);font-size:15px;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .n{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.1}
.stat .n small{font-size:13px;font-family:var(--sans);font-weight:500;color:var(--muted);margin-left:4px}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.hl{background:var(--black);color:var(--cream);border-color:var(--black)}
.stat.hl .l,.stat.hl .n small{color:var(--mint)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tally{list-style:none}
.tally li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tally li:last-child{border-bottom:0}
.tally b{font-family:var(--disp);font-size:16px}
.note-list{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.two{grid-template-columns:1fr}}

/* filters */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.chk-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.chk-row label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk-row input{width:18px;height:18px;accent-color:var(--black)}
.count{font-size:13px;color:var(--muted);margin:14px 0 8px}

/* cards */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.rcard.done{background:#eef6f1;border-color:var(--mint-d)}
.rcard.old{opacity:.6}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rname{font-family:var(--serif);font-weight:700;font-size:17px}
.rname span{font-family:var(--sans);font-weight:400;font-size:13.5px;color:var(--muted);margin-left:6px}
.rtime{font-size:12.5px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:12px;border-radius:999px;padding:3px 10px;font-weight:700}
.b-yes{background:var(--mint);color:#0d3d30}
.b-maybe{background:var(--cream-2);color:var(--ink)}
.b-no{background:var(--pink);color:#6b2536}
.b-old{background:#ddd;color:#555}
.b-chk{background:var(--black);color:var(--mint)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;margin-top:12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{word-break:break-word}
.kv a{color:var(--mint-d);font-weight:700;text-decoration:none}
.opinion{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.ractions{display:flex;gap:8px;align-items:flex-start;margin-top:12px;flex-wrap:wrap}
.ractions textarea{flex:1;min-width:180px;min-height:44px;font-size:14px;padding:9px 11px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:var(--cream);padding:11px 18px;border-radius:999px;font-size:14px;z-index:50}
footer{height:50px}
</style>
</head>
<body>

<!-- 로그인 -->
<section id="login">
  <form class="lbox" id="lform">
    <div class="eyebrow">MATHY YURI · ADMIN</div>
    <h1>스커담 관리자</h1>
    <input type="email" id="email" placeholder="이메일" autocomplete="username" required>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn full" type="submit">로그인</button>
    <p class="msg" id="lmsg" hidden></p>
  </form>
</section>

<!-- 관리 화면 -->
<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <h1><small>MATHY YURI · ADMIN</small>스커담 사전조사</h1>
      <div class="acts">
        <button class="btn mint sm" id="refresh">새로고침</button>
        <button class="btn ghost sm" id="csv">엑셀(CSV) 받기</button>
        <button class="btn ghost sm" id="logout">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="sec-title">한눈에 보기</div>
    <div class="grid" id="stats"></div>

    <div class="sec-title">어떤 반에 관심이 있을까요 <span style="color:var(--muted);font-family:var(--sans);font-style:normal;font-size:12px">(중복 선택 포함)</span></div>
    <div class="grid" id="interest"></div>

    <div class="sec-title">커피 주문표 <span style="color:var(--muted);font-family:var(--sans);font-style:normal;font-size:12px">(참석 확정·고민 중만 집계)</span></div>
    <div class="panel">
      <ul class="tally" id="drinks"></ul>
      <div class="note-list" id="drinkNotes"></div>
      <button class="btn ghost sm" id="copyDrinks" style="margin-top:12px">주문표 복사</button>
    </div>

    <div class="sec-title">걱정되는 것 / 학년 분포</div>
    <div class="two">
      <div class="panel"><ul class="tally" id="worries"></ul></div>
      <div class="panel"><ul class="tally" id="grades"></ul></div>
    </div>

    <div class="sec-title">응답 목록</div>
    <div class="filters">
      <input type="text" id="q" placeholder="이름·학교·전화 검색">
      <select id="fAtt"><option value="">참석 전체</option><option>참석 확정</option><option>고민 중</option><option>참석 어려움</option></select>
      <select id="fCls"><option value="">관심 반 전체</option><option>공수내모</option><option>예비고1 정규반</option><option>중2 대수 기초반</option><option>아직 고민 중</option></select>
      <select id="fGrade"><option value="">학년 전체</option></select>
    </div>
    <div class="chk-row">
      <label><input type="checkbox" id="fUnchecked"> 미확인만</label>
      <label><input type="checkbox" id="fLatest" checked> 최신 응답만 (재제출 정리)</label>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </main>
  <footer></footer>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ★★★ Supabase 주소와 키를 여기에 붙여넣으세요 (skdam.html과 같은 값) ★★★ */
const SUPABASE_URL = "https://eqllmvfbcdtzercliicy.supabase.co";
const SUPABASE_KEY = "sb_publishable_OcoOR7ERpt8BFBLuQ2CoWw_lELDDCEV";
const TABLE = "skdam_survey";

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = null, rows = [];

function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

function hdr(withToken){
  const h = {'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
  if(withToken) h.Authorization = 'Bearer ' + withToken;
  else if(SUPABASE_KEY.indexOf('eyJ') === 0) h.Authorization = 'Bearer ' + SUPABASE_KEY;
  return h;
}
const configured = () => SUPABASE_URL.indexOf('http') === 0 && SUPABASE_KEY.indexOf('여기에') !== 0;

/* ---------- 로그인 ---------- */
$('#lform').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('#lmsg'); msg.hidden = true;
  if(!configured()){ msg.textContent = 'Supabase 주소와 키가 아직 입력되지 않았어요. (파일 안의 "https://eqllmvfbcdtzercliicy.supabase.co" 부분)'; msg.hidden = false; return; }
  try{
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {method:'POST', headers:hdr(null), body:JSON.stringify({email:$('#email').value.trim(), password:$('#pw').value})});
    if(!r.ok) throw new Error('login');
    token = (await r.json()).access_token;
    try{ sessionStorage.setItem('skdam_t', token); }catch(_){}
    $('#pw').value = '';
    enter();
  }catch(err){
    msg.textContent = '로그인에 실패했어요. 이메일과 비밀번호를 확인해 주세요.'; msg.hidden = false;
  }
});

function enter(){ $('#login').hidden = true; $('#app').hidden = false; load(); }
function logout(){ token = null; try{ sessionStorage.removeItem('skdam_t'); }catch(_){} $('#app').hidden = true; $('#login').hidden = false; }
$('#logout').addEventListener('click', logout);

/* ---------- 데이터 ---------- */
async function load(){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.desc`, {headers:hdr(token)});
    if(r.status === 401 || r.status === 403){ logout(); $('#lmsg').textContent='로그인이 만료됐어요. 다시 로그인해 주세요.'; $('#lmsg').hidden=false; return; }
    if(!r.ok) throw new Error(r.status);
    rows = await r.json();
    markLatest();
    buildGradeFilter();
    render();
  }catch(err){ toast('불러오지 못했어요. 잠시 후 새로고침해 주세요.'); }
}
function keyOf(r){ return (r.parent_phone||'').replace(/\D/g,'') + '|' + (r.student_name||'').trim(); }
function markLatest(){ const seen = new Set(); rows.forEach(r => { const k = keyOf(r); r._latest = !seen.has(k); seen.add(k); }); }
function buildGradeFilter(){
  const cur = $('#fGrade').value;
  const gs = Array.from(new Set(rows.map(r=>r.grade).filter(Boolean)));
  $('#fGrade').innerHTML = '<option value="">학년 전체</option>' + gs.map(g=>`<option>${esc(g)}</option>`).join('');
  $('#fGrade').value = cur;
}

/* ---------- 집계 ---------- */
function tally(list){ const m = {}; list.forEach(x => { if(x) m[x] = (m[x]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function liHtml(entries, empty){ return entries.length ? entries.map(([k,v])=>`<li><span>${esc(k)}</span><b>${v}</b></li>`).join('') : `<li style="color:var(--muted)">${empty||'아직 없어요'}</li>`; }
const splitList = s => (s||'').split(',').map(x=>x.trim()).filter(Boolean);
let drinkTextForCopy = '';

function renderSummary(){
  const act = rows.filter(r=>r._latest);
  const att = k => act.filter(r=>r.attendance===k);
  const people = list => list.reduce((n,r)=> n + 1 + (r.drink2 ? 1 : 0), 0);
  const yes = att('참석 확정'), maybe = att('고민 중'), no = att('참석 어려움');
  const unchecked = act.filter(r=>!r.checked).length;
  $('#stats').innerHTML = `
    <div class="stat hl"><div class="n">${act.length}<small>가정</small></div><div class="l">응답</div></div>
    <div class="stat"><div class="n">${yes.length}<small>가정 · ${people(yes)}명</small></div><div class="l">참석 확정</div></div>
    <div class="stat"><div class="n">${maybe.length}<small>가정 · ${people(maybe)}명</small></div><div class="l">고민 중</div></div>
    <div class="stat"><div class="n">${no.length}<small>가정</small></div><div class="l">참석 어려움</div></div>
    <div class="stat"><div class="n">${unchecked}</div><div class="l">미확인</div></div>`;

  const cls = {'공수내모':0,'예비고1 정규반':0,'중2 대수 기초반':0,'아직 고민 중':0};
  act.forEach(r => splitList(r.classes).forEach(c => { if(c in cls) cls[c]++; }));
  $('#interest').innerHTML = Object.entries(cls).map(([k,v],i)=>`<div class="stat ${k==='중2 대수 기초반'?'hl':''}"><div class="n">${v}</div><div class="l">${esc(k)}</div></div>`).join('');

  const orderRows = act.filter(r => r.attendance !== '참석 어려움');
  const base = s => (s||'').split(' / 요청:')[0].trim();
  const drinkList = []; const notes = [];
  orderRows.forEach(r => {
    [r.drink1, r.drink2].forEach((d, i) => {
      if(!d) return;
      const b = base(d);
      if(b && b !== '음료 없음') drinkList.push(b);
      const m = d.split(' / 요청:')[1];
      if(m) notes.push(`${r.student_name}${i?'(동반)':''}: ${m.trim()}`);
    });
  });
  const dt = tally(drinkList);
  $('#drinks').innerHTML = liHtml(dt, '아직 주문이 없어요');
  $('#drinkNotes').innerHTML = notes.length ? '<b>요청사항</b><br>' + notes.map(esc).join('<br>') : '';
  drinkTextForCopy = dt.map(([k,v])=>`${k} x ${v}`).join('\n') + (notes.length ? '\n\n[요청사항]\n' + notes.join('\n') : '');

  $('#worries').innerHTML = liHtml(tally(act.flatMap(r=>splitList(r.worries))));
  $('#grades').innerHTML = liHtml(tally(act.map(r=>r.grade)));
}

/* ---------- 목록 ---------- */
function filtered(){
  const q = $('#q').value.trim().toLowerCase();
  const fa = $('#fAtt').value, fc = $('#fCls').value, fg = $('#fGrade').value;
  const un = $('#fUnchecked').checked, lt = $('#fLatest').checked;
  return rows.filter(r => {
    if(lt && !r._latest) return false;
    if(fa && r.attendance !== fa) return false;
    if(fc && !splitList(r.classes).includes(fc)) return false;
    if(fg && r.grade !== fg) return false;
    if(un && r.checked) return false;
    if(q){
      const hay = [r.student_name,r.school,r.parent_phone,r.student_phone,r.opinion].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
const fmt = iso => new Date(iso).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const badgeCls = a => a==='참석 확정' ? 'b-yes' : a==='고민 중' ? 'b-maybe' : 'b-no';

function renderList(){
  const list = filtered();
  $('#count').textContent = `${list.length}건 표시`;
  if(!list.length){ $('#list').innerHTML = '<div class="empty">조건에 맞는 응답이 없어요.</div>'; return; }
  $('#list').innerHTML = list.map(r => `
    <article class="rcard ${r.checked?'done':''} ${r._latest?'':'old'}" data-id="${esc(r.id)}">
      <div class="rhead">
        <div>
          <div class="rname">${esc(r.student_name)}<span>${esc(r.school)} ${esc(r.grade)}</span></div>
          <div class="badges">
            <span class="badge ${badgeCls(r.attendance)}">${esc(r.attendance)}</span>
            ${r.checked ? '<span class="badge b-chk">확인 완료</span>' : ''}
            ${r._latest ? '' : '<span class="badge b-old">이전 응답</span>'}
          </div>
        </div>
        <div class="rtime">${esc(fmt(r.created_at))}</div>
      </div>
      <dl class="kv">
        <dt>학부모</dt><dd><a href="tel:${esc((r.parent_phone||'').replace(/\D/g,''))}">${esc(r.parent_phone)}</a></dd>
        ${r.student_phone ? `<dt>학생</dt><dd><a href="tel:${esc(r.student_phone.replace(/\D/g,''))}">${esc(r.student_phone)}</a></dd>` : ''}
        ${r.leave_info ? `<dt>참석 방식</dt><dd>${esc(r.leave_info)}</dd>` : ''}
        <dt>음료</dt><dd>${esc(r.drink1||'-')}${r.drink2 ? '<br>+ ' + esc(r.drink2) : ''}</dd>
        <dt>관심 반</dt><dd>${esc(r.classes||'-')}</dd>
        <dt>걱정</dt><dd>${esc(r.worries||'-')}</dd>
      </dl>
      ${r.opinion ? `<div class="opinion">${esc(r.opinion)}</div>` : ''}
      <div class="ractions">
        <button class="btn ${r.checked?'ghost':''} sm" data-act="toggle">${r.checked ? '확인 취소' : '확인 완료'}</button>
        <textarea data-act="memo" placeholder="메모 (통화 내용 등)" rows="1">${esc(r.admin_memo||'')}</textarea>
      </div>
    </article>`).join('');
}
function render(){ renderSummary(); renderList(); }

/* ---------- 수정(확인 버튼·메모) ---------- */
async function patch(id, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', headers:{...hdr(token),'Prefer':'return=minimal'}, body:JSON.stringify(body)});
  if(r.status === 401 || r.status === 403){ logout(); return false; }
  return r.ok;
}
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act="toggle"]'); if(!b) return;
  const id = b.closest('.rcard').dataset.id;
  const row = rows.find(x => x.id === id);
  const nv = !row.checked;
  const ok = await patch(id, {checked:nv, checked_at: nv ? new Date().toISOString() : null});
  if(ok){ row.checked = nv; row.checked_at = nv ? new Date().toISOString() : null; render(); toast(nv ? '확인 완료로 표시했어요' : '확인을 취소했어요'); }
  else toast('저장에 실패했어요');
});
$('#list').addEventListener('focusout', async e => {
  const t = e.target.closest('[data-act="memo"]'); if(!t) return;
  const id = t.closest('.rcard').dataset.id;
  const row = rows.find(x => x.id === id);
  if((row.admin_memo||'') === t.value) return;
  const ok = await patch(id, {admin_memo: t.value || null});
  if(ok){ row.admin_memo = t.value || null; toast('메모를 저장했어요'); } else toast('메모 저장에 실패했어요');
});

/* ---------- 필터·버튼 ---------- */
['q','fAtt','fCls','fGrade','fUnchecked','fLatest'].forEach(id => {
  $('#'+id).addEventListener(id==='q'?'input':'change', renderList);
});
$('#refresh').addEventListener('click', () => { load(); toast('새로고침했어요'); });
$('#copyDrinks').addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText(drinkTextForCopy); toast('주문표를 복사했어요'); }
  catch(_){ toast('복사가 막혀 있어요. 직접 선택해서 복사해 주세요'); }
});
$('#csv').addEventListener('click', () => {
  const cols = [['created_at','접수시간'],['attendance','참석'],['leave_info','참석방식'],['student_name','학생이름'],['school','중학교'],['grade','학년'],['parent_phone','학부모전화'],['student_phone','학생전화'],['drink1','음료1'],['drink2','음료2'],['classes','관심반'],['worries','걱정'],['opinion','의견'],['checked','확인'],['admin_memo','메모']];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const body = filtered().map(r => cols.map(([k]) => q(k==='checked' ? (r.checked?'O':'') : r[k])).join(',')).join('\n');
  const blob = new Blob(['﻿' + cols.map(c=>q(c[1])).join(',') + '\n' + body], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'skdam_survey.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
});

/* ---------- 시작 ---------- */
(function init(){
  let t = null; try{ t = sessionStorage.getItem('skdam_t'); }catch(_){}
  if(t && configured()){ token = t; enter(); }
})();
</script>
