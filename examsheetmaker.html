<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내신기출 시험지 만들기 — MATHY YURI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="hwpx-lib.js?v=2"></script>
<style>
:root{
  --cream:#FBF8F1; --ink:#1A1A1A; --gold:#A8853F; --gold-line:#E6DCC6;
  --mint:#7FC8B4; --mint-deep:#3E8F79; --pink-deep:#C64E71;
  --serif:'Playfair Display','Noto Serif KR',serif; --kserif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
  /* 포인트 색깔 — accentSelect로 고르면 JS가 이 두 변수만 바꿔서 전체
     디자인(로고 글자색, 표 라벨칸 배경)이 한 번에 바뀐다. */
  --accent:#3E8F79; --accent-soft:#EAF4F0;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--cream);color:var(--ink)}
header{padding:12px 20px;background:#fff;border-bottom:1px solid var(--gold-line);display:flex;align-items:center;gap:12px}
header h1{font-family:var(--serif);font-size:18px;font-weight:900;margin:0}
header a{font-size:12px;color:var(--gold);text-decoration:none}
.layout{display:flex;gap:0;align-items:flex-start}
.panel{width:340px;flex:0 0 340px;padding:16px;background:#fff;border-right:1px solid var(--gold-line);position:sticky;top:0;max-height:100vh;overflow-y:auto}
.panel h2{font-family:var(--kserif);font-size:14px;margin:18px 0 8px;color:var(--gold)}
.panel h2:first-child{margin-top:0}
.panel .hint{font-size:11.5px;color:rgba(26,26,26,.55);margin:4px 0 8px;line-height:1.5}
.panel input[type=text],.panel input[type=number],.panel select{width:100%;padding:6px 8px;font-size:13px;border:1px solid var(--gold-line);border-radius:4px;margin-bottom:6px;font-family:inherit}
.panel label{display:block;font-size:11px;color:rgba(26,26,26,.6);margin-bottom:2px}
.panel button{width:100%;padding:8px;font-size:13px;font-weight:700;background:var(--ink);color:var(--cream);border:none;border-radius:4px;cursor:pointer;margin-bottom:6px}
.panel button:hover:not(:disabled){background:var(--mint-deep)}
.panel button:disabled{opacity:.5;cursor:default}
.panel button.secondary{background:#fff;color:var(--gold);border:1px solid var(--gold)}
.rangeRow{display:flex;gap:6px;align-items:center}
.rangeRow input{width:60px;flex:0 0 auto}
#status{font-size:12px;color:var(--mint-deep);min-height:1.4em;margin:4px 0}
#status.err{color:var(--pink-deep)}
#qOrderList{border:1px solid var(--gold-line);border-radius:6px;max-height:340px;overflow-y:auto}
.qOrderRow{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--gold-line);font-size:12px;background:#fff}
.qOrderRow:last-child{border-bottom:none}
.qOrderRow .qDrag{cursor:grab;color:rgba(26,26,26,.35)}
.qOrderRow .qNumBadge{font-weight:900;color:var(--gold);flex:0 0 22px}
.qOrderRow .qPreview{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(26,26,26,.7)}
.qOrderRow label{display:flex;align-items:center;gap:3px;font-size:10.5px;color:rgba(26,26,26,.6);flex:0 0 auto;margin:0}
.qOrderRow.dragOver{background:var(--gold-line)}

.previewWrap{flex:1;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-x:auto}
.pageBlock{display:flex;flex-direction:column;align-items:center;gap:6px}
.pageBlock .pageTools{display:flex;gap:8px}
.pageBlock .pageTools button{font-size:11px;padding:4px 10px;background:#fff;border:1px solid var(--gold-line);border-radius:4px;cursor:pointer;color:var(--gold)}
.pageBlock .pageTools button:hover{background:var(--gold-line)}

.examSheet{position:relative;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.18);overflow:hidden;padding:0 14mm}
.examHeadTable{margin-top:12mm;border-collapse:collapse;width:100%;font-size:11px;font-family:var(--sans)}
.examHeadTable td{border:1px solid var(--ink);padding:2.6mm 3mm;vertical-align:middle}
.examHeadTable .ehLabel{background:var(--accent-soft);font-weight:700;text-align:center;width:15%;color:var(--ink);letter-spacing:.02em}
.examHeadTable .ehSchool{font-family:var(--kserif);font-weight:900;font-size:17px;text-align:center;letter-spacing:.01em}
.examHeadTable .ehLogo{text-align:center;padding:1mm 2mm}
.examHeadTable .ehLogo .wordmarkText{font-family:var(--serif);font-style:italic;font-weight:900;font-size:16px;color:var(--accent);line-height:1.25}
.examHeadTable .ehLogo img{max-width:100%;max-height:16mm;display:block;margin:0 auto}
.examSimpleHead{margin-top:8mm;padding-bottom:2mm;border-bottom:1.4px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;font-size:11px}
.examSimpleHead .pageNo{font-family:var(--serif);font-size:20px;font-weight:900}
.examSimpleHead .wordmark{font-family:var(--serif);font-style:italic;font-weight:900;color:var(--accent)}
.examSimpleHead .wordmark img{max-height:9mm;display:block}
/* top은 페이지 1(표 머리말)과 이후 페이지(간단 머리말)의 높이가 달라서
   고정할 수 없다 — JS가 페이지를 그릴 때 style.top으로 직접 넣어준다.
   bottom을 고정해서 칸이 항상 페이지 맨 아래까지 닿게 하고(6번 요청),
   .examQCol이 flex+space-between이라 그 안 문제들도 이 높이에 맞춰
   간격이 자동으로 벌어진다(2번 요청). */
.examQBody{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;position:absolute;left:14mm;right:14mm;bottom:16mm}
.examQCol{border-left:1px solid var(--gold-line);padding-left:8mm;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.examQCol:first-child{border-left:none;padding-left:0}
.examQBlock{display:flex;align-items:flex-start;gap:2.5mm;break-inside:avoid}
.examQBlock.forceBreakMark{outline:1.5px dashed var(--pink-deep);outline-offset:2px}
.examQNum{flex:0 0 auto;font-family:var(--serif);font-weight:900;font-size:21px;color:var(--ink);line-height:1.3}
.examQBody2{flex:1;min-width:0;font-size:11.5px;line-height:1.6}
.examQBody2 p{margin:0 0 2mm}
.examQBody2 img{max-width:100%;height:auto;display:block;margin:2mm auto}
.examQBody2 table{border-collapse:collapse;margin:2mm 0}
.examQBody2 td{border:1px solid var(--gold-line);padding:0.5mm 1.2mm;font-size:9.5px;text-align:center;vertical-align:middle}
/* 객관식 선택지(①②③④⑤) — hwpx-lib.js가 만드는 .choiceRow/.choiceItem에
   맞는 간격 규칙을 이 페이지가 안 갖고 있어서(다른 페이지는 각자 갖고
   있음, 예: studentnote.html:4618) 선택지가 다닥다닥 붙어 나왔다 —
   3칸 그리드로 1,2,3이 한 줄을 꽉 채우고 4,5는 자동으로 1,2 자리 밑에
   맞춰지도록(studentnote.html과 동일한 값). */
.choiceRow{display:grid;grid-template-columns:repeat(3,1fr);row-gap:2mm;column-gap:4mm;margin:2mm 0}
.choiceItem{min-width:0;overflow-wrap:break-word}
.examFoot{position:absolute;bottom:8mm;left:0;right:0;text-align:center}
.examFoot .pageBox{display:inline-flex;align-items:center;border:1px solid var(--ink);padding:1mm 4mm;font-size:10px}
.examFoot .pageBox .cur{padding-right:2mm}
.examFoot .pageBox .tot{padding-left:2mm;border-left:1px solid var(--ink);transform:skewX(-15deg);display:inline-block}
</style>
</head>
<body>
<header>
  <h1>📄 내신기출 시험지 만들기</h1>
  <a href="problembank.html">← 문제은행으로</a>
</header>
<div class="layout">
  <div class="panel">
    <h2>1. hwpx 파일 선택</h2>
    <p class="hint">문제은행에 올리지 않고 내 컴퓨터의 hwpx 파일을 바로 불러옵니다.</p>
    <input type="file" id="hwpxFile" accept=".hwpx">
    <div id="status"></div>

    <h2>2. 시험지 정보</h2>
    <label>학교명</label>
    <input type="text" id="fSchool" placeholder="예: 수도여자고등학교">
    <label>시행일 / 고사 종류</label>
    <input type="text" id="fExamDate" placeholder="예: 2025년 2학기 중간고사" value="2025년 2학기 중간고사">
    <label>과목명</label>
    <input type="text" id="fSubject" placeholder="예: 공통수학 2" value="공통수학 2">
    <label>과목 코드</label>
    <input type="text" id="fSubjectCode" placeholder="예: 00" value="00">
    <label>고사 구분(하단 표)</label>
    <input type="text" id="fExamKind" placeholder="예: 중간고사" value="중간고사">
    <label>선택형+서술형 개수 표기 (직접 수정 가능, 예: 16+6)</label>
    <input type="text" id="fQCountLabel" placeholder="자동 계산됨(수정 가능)">
    <label>로고/서명 이미지 (없으면 "Mathy Yuri" 글자로 표시)</label>
    <input type="file" id="logoFile" accept="image/*">
    <label>포인트 색깔</label>
    <select id="accentSelect">
      <option value="mint">민트</option>
      <option value="navy">네이비</option>
      <option value="gold">골드</option>
      <option value="pink">핑크</option>
      <option value="blue">블루</option>
    </select>

    <h2>3. 페이지 크기</h2>
    <select id="pageSizeSelect">
      <option value="A4">A4 (210×297mm)</option>
      <option value="B4">B4 (257×364mm)</option>
    </select>
    <button type="button" id="regenerateBtn" disabled>다시 배치하기</button>

    <h2>4. 문제 순서 · 줄바꿈</h2>
    <p class="hint">⠿를 드래그해 순서를 바꾸고, "새 단"에 체크하면 그 문제부터 강제로 다음 단(또는 페이지)에서 시작합니다. 바뀌면 "다시 배치하기"를 눌러 반영하세요.</p>
    <div id="qOrderList"></div>

    <h2>5. 내보내기</h2>
    <p class="hint">페이지 범위를 비워두면 전체를 저장합니다.</p>
    <div class="rangeRow">
      <input type="number" id="pdfStart" min="1" placeholder="시작">
      <span>~</span>
      <input type="number" id="pdfEnd" min="1" placeholder="끝">
    </div>
    <button type="button" id="savePdfBtn" class="secondary" disabled>PDF로 저장</button>
  </div>

  <div class="previewWrap" id="previewWrap">
    <p class="hint">hwpx 파일을 선택하면 여기에 시험지 미리보기가 나타납니다.</p>
  </div>
</div>

<script>
const PAGE_SIZES = { A4: { w: 210, h: 297 }, B4: { w: 257, h: 364 } };
const CONTENT_SIDE_MM = 14, CONTENT_BOTTOM_MM = 16, COL_GAP_MM = 8;
const PAGE1_HEAD_MM = 34, OTHER_HEAD_MM = 16; // 표지형 머리말(표) vs 이후 페이지 간단 머리말이 차지하는 높이
const COLUMNS_PER_PAGE = 2;

let hwpxEntry = null; // parseHwpx 결과
let questions = []; // [{num, bodyHtml, choiceCount, forceBreak}]
let pageSize = 'A4';
let lastLayoutPages = []; // [[colHtml, colHtml], ...] — 페이지별 두 칸의 최종 HTML
let logoDataUrl = null; // 업로드한 로고/서명 이미지(base64) — 없으면 "Mathy Yuri" 글자로 대체

const statusEl = document.getElementById('status');
const previewWrap = document.getElementById('previewWrap');
const qOrderListEl = document.getElementById('qOrderList');
const regenerateBtn = document.getElementById('regenerateBtn');
const savePdfBtn = document.getElementById('savePdfBtn');

// ---------- 로고/서명 이미지 ----------
document.getElementById('logoFile').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { logoDataUrl = reader.result; renderHeadFootOnly(); };
  reader.readAsDataURL(file);
});

// ---------- 포인트 색깔 ----------
const ACCENT_THEMES = {
  mint: { name: '민트', strong: '#3E8F79', soft: '#EAF4F0' },
  navy: { name: '네이비', strong: '#2C4A6E', soft: '#EAF0F6' },
  gold: { name: '골드', strong: '#A8853F', soft: '#F1EADA' },
  pink: { name: '핑크', strong: '#C64E71', soft: '#FBEAEF' },
  blue: { name: '블루', strong: '#3B6FA0', soft: '#EAF2FA' },
};
document.getElementById('accentSelect').addEventListener('change', (e) => {
  const t = ACCENT_THEMES[e.target.value];
  if (!t) return;
  document.documentElement.style.setProperty('--accent', t.strong);
  document.documentElement.style.setProperty('--accent-soft', t.soft);
});

function setStatus(msg, isErr) {
  statusEl.textContent = msg || '';
  statusEl.className = isErr ? 'err' : '';
}

// ---------- 1. hwpx 로드 ----------
document.getElementById('hwpxFile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  setStatus('파일을 읽는 중...');
  previewWrap.innerHTML = '';
  try {
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const entry = await parseHwpx(zip);
    const nums = [...entry.markers.keys()].sort((a, b) => a - b);
    if (!nums.length) throw new Error('문제를 하나도 찾지 못했습니다.');
    const qs = [];
    for (const num of nums) {
      const blockXml = entry.markers.get(num).blockXml;
      let bodyHtml = '';
      try { bodyHtml = await hwpBodyXmlToHtml(blockXml, entry); } catch (e) { bodyHtml = '<p class="hint">(렌더링 실패)</p>'; }
      const choiceCount = (bodyHtml.match(/class="choiceItem"/g) || []).length;
      qs.push({ num, bodyHtml, choiceCount, forceBreak: false });
    }
    hwpxEntry = entry;
    questions = qs;
    regenerateBtn.disabled = false;
    savePdfBtn.disabled = false;
    renderQOrderList();
    setStatus(`${qs.length}개 문제를 불러왔습니다.`);
    await regenerateLayout();
  } catch (e) {
    setStatus('불러오기 실패: ' + e.message, true);
  }
});

// ---------- 2/3. 정보 입력 — 값이 바뀌면 머리말만 다시 그림(재배치 불필요) ----------
['fSchool', 'fExamDate', 'fSubject', 'fSubjectCode', 'fExamKind', 'fQCountLabel'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderHeadFootOnly);
});
document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
  pageSize = e.target.value;
});

// ---------- 4. 문제 순서 목록(드래그) ----------
function shortPreview(html) {
  const txt = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  return txt.slice(0, 28);
}
let dragSrcQNum = null;
function renderQOrderList() {
  qOrderListEl.innerHTML = '';
  questions.forEach(q => {
    const row = document.createElement('div');
    row.className = 'qOrderRow';
    row.draggable = true;
    row.dataset.num = q.num;
    row.innerHTML = `
      <span class="qDrag">⠿</span>
      <span class="qNumBadge">${q.num}</span>
      <span class="qPreview" title="${shortPreview(q.bodyHtml)}">${shortPreview(q.bodyHtml)}</span>
      <label><input type="checkbox" class="qForceBreak"${q.forceBreak ? ' checked' : ''}> 새 단</label>
    `;
    row.querySelector('.qForceBreak').addEventListener('change', (e) => { q.forceBreak = e.target.checked; });
    row.addEventListener('dragstart', () => { dragSrcQNum = q.num; });
    row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('dragOver'); });
    row.addEventListener('dragleave', () => row.classList.remove('dragOver'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('dragOver');
      if (dragSrcQNum == null || dragSrcQNum === q.num) return;
      const srcIdx = questions.findIndex(x => x.num === dragSrcQNum);
      const dstIdx = questions.findIndex(x => x.num === q.num);
      const [moved] = questions.splice(srcIdx, 1);
      questions.splice(dstIdx, 0, moved);
      dragSrcQNum = null;
      renderQOrderList();
    });
    qOrderListEl.appendChild(row);
  });
}

// ---------- mm ↔ px ----------
function mmToPxRatio() {
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;width:100mm;';
  document.body.appendChild(d);
  const ratio = d.getBoundingClientRect().width / 100;
  d.remove();
  return ratio;
}

// ---------- 문제들을 칸(column) 단위로 연속해서 채워 넣기 ----------
// studentnote.html의 paginateQuestionsWithOverflow와 달리(그건 문항 하나가
// 칸 하나를 통째로 차지하는 오답노트 전용 배치), 여기는 실제 시험지처럼
// 여러 문제가 한 칸 안에 이어서 빼곡히 들어가야 한다 — 그래서 새로 짠
// "연속 채우기" 알고리즘: 문제를 하나씩 측정해서 칸에 넣다가 넘치면 다음
// 칸으로 넘긴다. "새 단" 체크한 문제는 그 자리에서 무조건 다음 칸부터
// 새로 시작.
function packQuestionsIntoColumns(qs, colWidthPx, colHeightPxFor) {
  const stage = document.createElement('div');
  stage.style.cssText = `position:absolute;visibility:hidden;left:-9999px;top:0;width:${colWidthPx}px;font-family:'Noto Sans KR',sans-serif;font-size:11.5px;line-height:1.6;`;
  document.body.appendChild(stage);
  const measure = (html) => {
    stage.innerHTML = html;
    if (window.renderMathInElement) {
      try { renderMathInElement(stage, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
    }
    return stage.getBoundingClientRect().height;
  };

  const columns = [];
  let curCol = [], curHeight = 0;
  function pushCol() { columns.push(curCol); curCol = []; curHeight = 0; }

  qs.forEach(q => {
    const html = `<div class="examQBlock${q.forceBreak ? ' forceBreakMark' : ''}"><div class="examQNum">${q.num}.</div><div class="examQBody2">${q.bodyHtml}</div></div>`;
    if (q.forceBreak && curCol.length > 0) pushCol();
    const maxH = colHeightPxFor(columns.length);
    const h = measure(html);
    if (curCol.length > 0 && curHeight + h > maxH) pushCol();
    curCol.push(html);
    curHeight += h;
  });
  if (curCol.length) columns.push(curCol);
  stage.remove();
  return columns;
}

// ---------- 머리말/꼬리말만 다시 그리기(레이아웃 유지) ----------
function headTableHtml() {
  const school = document.getElementById('fSchool').value.trim() || '학교명';
  const examDate = document.getElementById('fExamDate').value.trim();
  const subject = document.getElementById('fSubject').value.trim();
  const subjectCode = document.getElementById('fSubjectCode').value.trim();
  const examKind = document.getElementById('fExamKind').value.trim();
  const totalPages = lastLayoutPages.length || 1;
  const qCountLabel = document.getElementById('fQCountLabel').value.trim() || autoQCountLabel();
  return `<table class="examHeadTable">
    <tr>
      <td class="ehLabel">시행일</td><td>${escapeHtml(examDate)}</td>
      <td class="ehSchool" colspan="3">${escapeHtml(school)}</td>
      <td class="ehLogo" rowspan="3">${logoDataUrl ? `<img src="${logoDataUrl}" alt="로고">` : '<span class="wordmarkText">Mathy<br>Yuri</span>'}</td>
    </tr>
    <tr>
      <td class="ehLabel">과목 코드</td><td>${escapeHtml(subjectCode)}</td>
      <td class="ehLabel">선택형</td>
      <td class="ehLabel">과목명</td><td>${escapeHtml(subject)}</td>
    </tr>
    <tr>
      <td class="ehLabel">문제 쪽수</td><td>총${totalPages}쪽</td>
      <td class="ehLabel">${escapeHtml(qCountLabel)}</td>
      <td class="ehLabel">고사</td><td>${escapeHtml(examKind)}</td>
    </tr>
  </table>`;
}
function autoQCountLabel() {
  const objective = questions.filter(q => q.choiceCount >= 4).length;
  const subjective = questions.length - objective;
  return objective + '+' + subjective;
}
function renderHeadFootOnly() {
  if (!lastLayoutPages.length) return;
  document.querySelectorAll('.examSheet').forEach((sheet, i) => {
    const headSlot = sheet.querySelector('.examHeadSlot');
    if (headSlot) headSlot.innerHTML = i === 0 ? headTableHtml() : simpleHeadHtml(i + 1);
  });
}
function simpleHeadHtml(pageNum) {
  const logo = logoDataUrl ? `<img src="${logoDataUrl}" alt="로고">` : 'Mathy Yuri';
  return `<div class="examSimpleHead"><span class="pageNo">${pageNum}</span><span class="wordmark">${logo}</span></div>`;
}

// ---------- 전체 재배치 ----------
async function regenerateLayout() {
  if (!questions.length) return;
  regenerateBtn.disabled = true;
  setStatus('배치하는 중...');
  try {
    const { w, h } = PAGE_SIZES[pageSize];
    const ratio = mmToPxRatio();
    const colWidthMm = (w - CONTENT_SIDE_MM * 2 - COL_GAP_MM) / COLUMNS_PER_PAGE;
    const colWidthPx = colWidthMm * ratio;
    const page1HeightMm = h - PAGE1_HEAD_MM - CONTENT_BOTTOM_MM;
    const otherHeightMm = h - OTHER_HEAD_MM - CONTENT_BOTTOM_MM;
    const colHeightMmFor = (colIdx) => (colIdx < COLUMNS_PER_PAGE ? page1HeightMm : otherHeightMm);
    const colHeightPxFor = (colIdx) => colHeightMmFor(colIdx) * ratio;

    const columns = packQuestionsIntoColumns(questions, colWidthPx, colHeightPxFor);
    const pages = [];
    for (let i = 0; i < columns.length; i += COLUMNS_PER_PAGE) pages.push(columns.slice(i, i + COLUMNS_PER_PAGE));
    lastLayoutPages = pages;

    previewWrap.innerHTML = '';
    pages.forEach((cols, pageIdx) => {
      const pageNum = pageIdx + 1;
      const colHeightMm = colHeightMmFor(pageIdx * COLUMNS_PER_PAGE);
      const colsHtml = cols.map(colBlocks => `<div class="examQCol" style="height:${colHeightMm}mm">${colBlocks.join('')}</div>`).join('');
      const sheet = document.createElement('div');
      sheet.className = 'examSheet';
      sheet.style.width = w + 'mm';
      sheet.style.height = h + 'mm';
      const headMm = pageIdx === 0 ? PAGE1_HEAD_MM : OTHER_HEAD_MM;
      sheet.innerHTML = `
        <div class="examHeadSlot">${pageIdx === 0 ? headTableHtml() : simpleHeadHtml(pageNum)}</div>
        <div class="examQBody" style="top:${headMm}mm">${colsHtml}</div>
        <div class="examFoot"><span class="pageBox"><span class="cur">${pageNum}</span><span class="tot">${pages.length}</span></span></div>
      `;
      const block = document.createElement('div');
      block.className = 'pageBlock';
      const tools = document.createElement('div');
      tools.className = 'pageTools';
      tools.innerHTML = `<button type="button" class="saveImgBtn">🖼 이 페이지 이미지로 저장</button>`;
      tools.querySelector('.saveImgBtn').addEventListener('click', () => saveSheetAsImage(sheet, pageNum));
      block.appendChild(sheet);
      block.appendChild(tools);
      previewWrap.appendChild(block);
    });
    if (window.renderMathInElement) {
      try { renderMathInElement(previewWrap, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
    }
    setStatus(`총 ${pages.length}쪽으로 배치되었습니다.`);
  } catch (e) {
    setStatus('배치 실패: ' + e.message, true);
  } finally {
    regenerateBtn.disabled = false;
  }
}
regenerateBtn.addEventListener('click', regenerateLayout);

// ---------- 이미지/PDF 저장 (studentnote.html의 captureSheet/buildAndSavePdf와 같은 방식) ----------
async function captureSheet(el) {
  return await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
}
async function saveSheetAsImage(sheet, pageNum) {
  try {
    const canvas = await captureSheet(sheet);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `내신기출_${pageNum}쪽.png`;
    a.click();
  } catch (e) {
    alert('이미지 저장 실패: ' + e.message);
  }
}
savePdfBtn.addEventListener('click', async () => {
  if (!lastLayoutPages.length) return;
  const sheets = [...document.querySelectorAll('.examSheet')];
  const startVal = Number(document.getElementById('pdfStart').value) || 1;
  const endVal = Number(document.getElementById('pdfEnd').value) || sheets.length;
  const start = Math.max(1, Math.min(startVal, sheets.length));
  const end = Math.max(start, Math.min(endVal, sheets.length));
  const targetSheets = sheets.slice(start - 1, end);
  if (!targetSheets.length) return;
  savePdfBtn.disabled = true;
  const orig = savePdfBtn.textContent;
  try {
    const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDFCtor) throw new Error('PDF 라이브러리를 불러오지 못했습니다');
    const pageWmm = PAGE_SIZES[pageSize].w;
    let pdf = null;
    for (let i = 0; i < targetSheets.length; i++) {
      savePdfBtn.textContent = `캡처 중... (${i + 1}/${targetSheets.length})`;
      const canvas = await captureSheet(targetSheets[i]);
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const pageHmm = pageWmm * (canvas.height / canvas.width);
      if (!pdf) pdf = new jsPDFCtor({ orientation: 'portrait', unit: 'mm', format: [pageWmm, pageHmm] });
      else pdf.addPage([pageWmm, pageHmm], 'portrait');
      pdf.addImage(imgData, 'JPEG', 0, 0, pageWmm, pageHmm, undefined, 'FAST');
    }
    pdf.save(`내신기출_${start}-${end}쪽.pdf`);
  } catch (e) {
    alert('PDF 저장 실패: ' + e.message);
  } finally {
    savePdfBtn.disabled = false;
    savePdfBtn.textContent = orig;
  }
});
</script>
