<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일일일모 오답노트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg: #fdfbf7;
  --card: #ffffff;
  --dark: #3a3530;
  --gold: #c8a84b;
  --gold-deep: #a8853f;
  --line: #eae5da;
  --pink: #e58ba4;
  --pink-deep: #c64e71;
  --mint: #8ba8a1;
  --mint-deep: #5b8a80;
}
* { box-sizing: border-box; }
.hidden { display: none !important; }
body { font-family: 'Poppins', 'Noto Serif KR', serif; background: var(--bg); color: var(--dark); margin: 0; padding: 20px 16px 60px; }
.wrap { max-width: 720px; margin: 0 auto; }
h1 { text-align: center; font-family: 'Noto Serif KR'; font-size: 1.3rem; margin: 0 0 4px; }
.sub { text-align: center; font-size: 0.75rem; color: #999; letter-spacing: 1px; margin: 0 0 26px; }

.loginCard, .searchCard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.fieldRow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fieldRow input { flex: 1; min-width: 160px; padding: 11px 13px; border-radius: 10px; border: 1px solid #ddd; font-size: 0.9rem; font-family: inherit; }
.fieldRow button { background: var(--dark); color: #fff; border: none; padding: 11px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; }
.fieldRow button:disabled { background: #bbb; }
.msg { font-size: 0.8rem; margin-top: 8px; min-height: 16px; }
.msg.err { color: var(--pink-deep); }
.msg.ok { color: var(--mint-deep); }

.noteHeader { text-align: center; margin: 30px 0 20px; }
.noteHeader .name { font-family: 'Noto Serif KR'; font-weight: 900; font-size: 1.5rem; }
.noteHeader .meta { font-size: 0.8rem; color: #999; margin-top: 4px; }
.printBtn { display: block; margin: 0 auto 24px; background: var(--gold); color: #fff; border: none; padding: 11px 26px; border-radius: 20px; font-weight: 700; cursor: pointer; font-family: inherit; }

.roundBlock { margin-bottom: 30px; }
.roundBlock h2 { font-family: 'Noto Serif KR'; font-size: 1rem; color: var(--gold-deep); border-bottom: 2px solid var(--gold); padding-bottom: 6px; margin-bottom: 14px; }
.qCard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; break-inside: avoid; }
.qHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; }
.metaTag { font-size: 0.66rem; font-weight: 700; padding: 2px 9px; border-radius: 9px; }
.metaTag.확실 { background: #fbeaee; color: var(--pink-deep); }
.metaTag.애매 { background: #fbf6ea; color: var(--gold-deep); }
.metaTag.모름 { background: #eef0f5; color: #4a5a80; }
.metaTag.미제출 { background: #f3f3f3; color: #999; }
.correctTag { background: #eaf4f0; color: var(--mint-deep); }
.stem { font-size: 0.92rem; line-height: 1.75; margin-bottom: 10px; }
.stem img { max-width: 100%; }
.choices { font-size: 0.9rem; color: #222; line-height: 1.9; margin-bottom: 12px; }
.choices .ci { display: inline-block; margin-right: 22px; }
.choices.imgGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choices.imgGrid .ci { margin: 0; min-width: 0; }
.choices.imgGrid img { max-width: 100%; max-height: 120px; width: auto; height: auto; object-fit: contain; display: block; }
.choices.longList .ci { display: block; margin-right: 0; }
.video { display: inline-block; margin-bottom: 8px; font-size: 0.78rem; font-weight: 700; color: var(--pink-deep); text-decoration: none; background: #fbeaee; padding: 5px 12px; border-radius: 10px; }
.ytFacade { position: relative; width: 100%; max-width: 420px; aspect-ratio: 16/9; background-size: cover; background-position: center; background-color: #eee; border-radius: 10px; cursor: pointer; margin-bottom: 8px; overflow: hidden; }
.ytFacade::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.15); }
.ytFacade .ytPlayBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 52px; height: 52px; background: rgba(0,0,0,.68); border-radius: 50%; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 1; }
.ytIframe { width: 100%; max-width: 420px; aspect-ratio: 16/9; border: none; border-radius: 10px; margin-bottom: 8px; display: block; }
.solBox { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
.solBox .ans { font-weight: 700; color: var(--mint-deep); font-size: 0.85rem; margin-bottom: 6px; }
.solBox .expl { font-size: 0.82rem; line-height: 1.75; color: #555; }
.solBox .expl b { color: var(--gold-deep); }
.emptyMsg { text-align: center; color: #bbb; padding: 40px 0; }

.chkRow { display: inline-block; font-size: 0.78rem; color: #8a6d2b; margin: 0 0 8px; cursor: pointer; }
.chkRow input { margin-right: 4px; }
@media print {
  .chkRow, .loginCard, .searchCard, .printBtn, .ytFacade, .ytIframe { display: none !important; }
  body { padding: 0; background: #fff; }
  .qCard { box-shadow: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>📓 일일일모 오답노트</h1>
  <p class="sub">MATHY YURI · DAECHI ACADEMY (강사 전용)</p>

  <div class="loginCard" id="loginCard">
    <div class="fieldRow">
      <input type="password" id="keyInput" placeholder="원장님/조교 비밀번호" autocomplete="off">
      <button type="button" id="loginBtn">로그인</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="searchCard hidden" id="searchCard">
    <div class="fieldRow">
      <input type="text" id="nameInput" placeholder="학생 이름" autocomplete="off">
      <button type="button" id="searchBtn">오답노트 불러오기</button>
    </div>
    <div class="msg" id="searchMsg">정답이 공개된 회차의 오답 + 맞혔지만 확신 없었던 문항을 모아 보여줍니다 — 비공개 회차는 제외됩니다.</div>
  </div>

  <div id="noteArea"></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbynxupIBGMhIb6knPPTzCgQ3No_nId6YdjoKsvoFGZAEk4HkVztI0a6Wto5UfUww8e1/exec';
let myKey = '';

function $(id) { return document.getElementById(id); }

async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(GAS_URL + '?' + qs);
  return res.json();
}

$('loginBtn').addEventListener('click', async () => {
  const key = $('keyInput').value.trim();
  const msg = $('loginMsg');
  if (!key) { msg.textContent = '비밀번호를 입력하세요.'; msg.className = 'msg err'; return; }
  msg.textContent = '확인 중...';
  msg.className = 'msg';
  try {
    // dailyquizmetaanalysis는 requireStaff — 아무 회차나 넣어서 키 검증에 재사용.
    const json = await apiGet({ action: 'dailyquizmetaanalysis', round: 1, key });
    if (!json.ok) { msg.textContent = '비밀번호가 올바르지 않습니다.'; msg.className = 'msg err'; return; }
    myKey = key;
    $('loginCard').classList.add('hidden');
    $('searchCard').classList.remove('hidden');
  } catch (e) {
    msg.textContent = '서버 연결에 실패했습니다.'; msg.className = 'msg err';
  }
});
$('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('searchBtn').addEventListener('click', loadWrongNote);
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadWrongNote(); });

function renderMath(el) {
  if (window.renderMathInElement) {
    try { renderMathInElement(el, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
  }
}

// studentnote.html에서 체크박스로 문제를 고른 뒤 넘어오면 ?sel=회차:번호,...
// 형태로 붙어온다 — 있으면 그 문제들만 걸러서 보여준다(원장님 요청:
// "내가 문제를 선택해서 하는 방식으로"). 없으면(직접 검색) 예전처럼
// 전체를 보여준다.
function parseSelParam() {
  const raw = new URLSearchParams(location.search).get('sel');
  if (!raw) return null;
  return new Set(raw.split(',').filter(Boolean));
}

async function loadWrongNote() {
  const name = $('nameInput').value.trim();
  const msg = $('searchMsg');
  const area = $('noteArea');
  if (!name) { msg.textContent = '학생 이름을 입력하세요.'; msg.className = 'msg err'; return; }
  msg.textContent = '불러오는 중...';
  msg.className = 'msg';
  area.innerHTML = '';
  try {
    const json = await apiGet({ action: 'dailyquizwronglist', name, key: myKey });
    if (!json.ok) { msg.textContent = json.error || '불러오지 못했습니다.'; msg.className = 'msg err'; return; }
    msg.textContent = ''; msg.className = 'msg';
    const selFilter = parseSelParam();
    let rounds = json.rounds || [];
    if (selFilter) {
      rounds = rounds
        .map(r => ({ ...r, items: r.items.filter(it => selFilter.has(`${r.round}:${it.num}`)) }))
        .filter(r => r.items.length);
    }
    const totalCount = rounds.reduce((s, r) => s + r.items.length, 0);
    if (!totalCount) {
      area.innerHTML = `<div class="emptyMsg">${escapeHtml(name)} 학생 — ${selFilter ? '선택한 문제가 없습니다.' : '정답 공개된 회차 중 복습할 문제(오답 · 확신 낮게 맞은 문제)가 없습니다.<br>(그런 문제가 없거나, 해당 회차가 아직 공개 전입니다)'}</div>`;
      return;
    }
    let html = `
      <div class="noteHeader">
        <div class="name">${escapeHtml(name)}의 일일일모 오답노트</div>
        <div class="meta">${rounds.length}개 회차 · 총 ${totalCount}문제${selFilter ? ' (선택한 문제만)' : ''}</div>
      </div>
      <button type="button" class="printBtn" onclick="window.print()">🖨️ 인쇄 / PDF로 저장</button>
    `;
    rounds.forEach(r => {
      const school = ROUND_SCHOOLS[r.round];
      html += `<div class="roundBlock"><h2>${r.round}회차${school ? ` (${school} 기출)` : ''} — ${r.items.length}문제</h2>`;
      r.items.forEach(it => {
        const metaTag = it.meta ? `<span class="metaTag ${it.meta}">${it.meta}</span>` : '';
        // 맞히긴 했지만 1차 시도 확신이 '확실'이 아니었던 문항(원장님 요청,
        // 2026-09-12) — 오답이 아니라는 걸 바로 알 수 있게 별도 태그로 구분.
        // 결국은 맞혔지만 왜 여기 실렸는지 이유를 구분해서 보여준다 —
        // 1차 시도 자체가 틀렸던 경우(나중에 재도전으로 정정)와, 1차에
        // 맞히긴 했는데 확신이 낮았던 경우는 서로 다른 신호라서(원장님
        // 요청, 2026-09-15) 같은 "확신 낮음" 문구로 뭉뚱그리면 안 된다.
        const correctTag = it.correct
          ? (it.firstAttemptWrong ? `<span class="metaTag correctTag">1차 오답 · 정정됨</span>` : `<span class="metaTag correctTag">맞음 · 확신 낮음</span>`)
          : '';
        const quickAnswer = cleanQuickAnswer(it.quickAnswer);
        html += `<div class="qCard">
          <div class="qHead"><span>${it.num}번</span>${metaTag}${correctTag}</div>
          <div class="stem">${it.stemHtml || ''}</div>
          ${choiceToggleHtml(r.round, it)}
          ${ytThumbHtml(it.video)}
          <div class="solBox">
            <div class="ans">정답: ${answerValueText(it)}</div>
            ${quickAnswer || it.explanation ? `<div class="expl">${quickAnswer ? `<b>빠른정답</b><br>${quickAnswer}` : ''}${it.explanation ? `${quickAnswer ? '<br><br>' : ''}<b>해설</b><br>${it.explanation}` : ''}</div>` : '<div class="expl">이 문항엔 해설이 저장돼 있지 않습니다.</div>'}
          </div>
        </div>`;
      });
      html += '</div>';
    });
    area.innerHTML = html;
    renderMath(area); bindChoiceToggles(area);
  } catch (e) {
    msg.textContent = '불러오지 못했습니다: ' + (e.message || String(e));
    msg.className = 'msg err';
  }
}

/* 풀이영상 — index.html의 ytEmbed와 같은 방식: 링크로 새 탭 열지 않고
   썸네일을 먼저 보여주다가 누르면 그 자리에서 재생(원장님 요청). */
function ytEmbed(url) {
  if (!url) return null;
  let m = url.match(/youtube\.com\/shorts\/([\w-]{6,})/);
  if (m) return { id: m[1] };
  m = url.match(/youtu\.be\/([\w-]{6,})/);
  if (m) return { id: m[1] };
  m = url.match(/[?&]v=([\w-]{6,})/);
  if (m) return { id: m[1] };
  return null;
}
function ytThumbHtml(url) {
  const yt = ytEmbed(url);
  if (!yt) return '';
  return `<div class="ytFacade" data-yid="${yt.id}" style="background-image:url('https://i.ytimg.com/vi/${yt.id}/hqdefault.jpg')"><span class="ytPlayBtn">▶</span></div>`;
}
document.addEventListener('click', e => {
  const facade = e.target.closest('.ytFacade');
  if (!facade) return;
  const iframe = document.createElement('iframe');
  iframe.className = 'ytIframe';
  iframe.src = `https://www.youtube.com/embed/${facade.dataset.yid}?autoplay=1`;
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
  iframe.allowFullscreen = true;
  facade.replaceWith(iframe);
});

// 일일일모 오답노트는 같은 문제를 반복해서 보다 보니 "정답은 ④"처럼
// 선지 번호 자체를 외워버리는 학생이 많다는 리포트(2026-09-15) — 선지를
// 아예 안 보여주고 단답형처럼 실제 정답 값만 보여준다. 값은 정답 번호
// (answer)에 해당하는 선지 원문에서 동그라미 숫자만 뗀 것.
// 선지는 기본으로 숨긴다 — 학생들이 보기 번호(정답 번호)를 외워 버려서 오답노트의 의미가 사라지기 때문(원장님 요청).
// 다만 선지가 없으면 답을 낼 수 없는 문제(예: "좌표는?")가 있어서, 카드마다 "선지 넣기"를 체크하면
// 그 문제만 선지를 함께 보여준다. 체크 상태는 이 브라우저에 기억한다.
const CHOICE_KEY = 'dqwn_choices_v1';
function loadChoiceSet() { try { return new Set(JSON.parse(localStorage.getItem(CHOICE_KEY) || '[]')); } catch (e) { return new Set(); } }
function saveChoiceSet(set) { try { localStorage.setItem(CHOICE_KEY, JSON.stringify([...set])); } catch (e) {} }
function choiceToggleHtml(round, it) {
  const html = choicesHtml(it.choices);
  if (!html) return '';
  const key = round + ':' + it.num, on = loadChoiceSet().has(key);
  return `<label class="chkRow"><input type="checkbox" class="chkChoice" data-key="${key}"${on ? ' checked' : ''}> 선지 넣기</label>` +
    `<div class="choiceWrap" data-key="${key}"${on ? '' : ' style="display:none"'}>${html}</div>`;
}
function bindChoiceToggles(root) {
  root.querySelectorAll('.chkChoice').forEach(cb => cb.addEventListener('change', () => {
    const set = loadChoiceSet(); cb.checked ? set.add(cb.dataset.key) : set.delete(cb.dataset.key); saveChoiceSet(set);
    const w = root.querySelector('.choiceWrap[data-key="' + cb.dataset.key + '"]'); if (w) w.style.display = cb.checked ? '' : 'none';
  }));
}
// 일일일모는 전부 객관식이라 선지가 문제의 일부다 — 오답노트에도 선지를 함께 싣는다.
// 그림 선지는 한 행 2개, 짧은 선지는 한 줄에 이어서, 긴 선지는 한 줄에 하나씩.
function choicesHtml(choices) {
  const cs = (choices || []).filter(c => String(c || '').trim());
  if (!cs.length) return '';
  const hasImg = cs.some(c => /<img\b/i.test(c));
  const plainLen = Math.max.apply(null, cs.map(c => String(c).replace(/<[^>]*>/g, '').replace(/\\\(|\\\)/g, '').length));
  const cls = hasImg ? 'choices imgGrid' : plainLen > 34 ? 'choices longList' : 'choices';
  return `<div class="${cls}">${cs.map(c => `<span class="ci">${c}</span>`).join(hasImg ? '' : ' ')}</div>`;
}
function answerValueText(it) {
  const idx = Number(it.answer) - 1;
  const choice = (it.choices || [])[idx];
  if (!choice) return it.answer != null && it.answer !== '' ? String(it.answer) : '−';
  return choice.replace(/^[①②③④⑤]\s*/, '');
}
// 빠른정답 필드는 원래 "[정답] ④ 20/3"처럼 선지 번호를 같이 담고 있어서,
// 그대로 보여주면 선지를 감춘 의미가 없다 — 앞의 "[정답] ④" 부분만 지운다.
function cleanQuickAnswer(qa) {
  if (!qa) return '';
  return qa.replace(/^\s*\[정답\]\s*[①②③④⑤]?\s*/, '').trim();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 회차(1~30) ↔ 그 회차 문제의 출처 학교 — 다른 일일일모 화면들과 동일한
// 목록(표시용).
const ROUND_SCHOOLS = [
  '', '수원여고', '부천북고', '광휘고', '보라고', '동패고', '능동고', '안곡고', '고양동산고', '도래울고', '백운고',
  '고림고', '광덕고', '상일고', '성포고', '화정고', '덕산고', '저동고', '소명여고', '소래고', '풍무고',
  '광명고', '중산고', '부명고', '권선고', '송림고', '구리고', '화수고', '서현고', '수택고', '과전외고',
];

// studentnote.html에서 "선택한 문제로 오답노트 열기" 버튼으로 들어오면
// ?name=&key=(&sel=)가 같이 붙어온다 — 로그인/검색을 또 안 하고 바로
// 결과가 뜨게 자동으로 채워서 실행한다. sel은 loadWrongNote 안의
// parseSelParam이 location.search에서 직접 다시 읽으므로 여기선 그대로
// 둔다. 직접 이 페이지에 들어온 경우(파라미터 없음)는 기존처럼 로그인
// 화면부터 시작.
(function autoLoadFromUrl() {
  const qp = new URLSearchParams(location.search);
  const urlKey = qp.get('key');
  const urlName = qp.get('name');
  if (!urlKey || !urlName) return;
  window.addEventListener('load', () => {
    $('keyInput').value = urlKey;
    $('loginBtn').click();
    const tryFill = () => {
      if ($('searchCard').classList.contains('hidden')) { setTimeout(tryFill, 200); return; }
      $('nameInput').value = urlName;
      $('searchBtn').click();
    };
    setTimeout(tryFill, 200);
  });
})();
</script>
</body>
