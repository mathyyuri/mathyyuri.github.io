<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제 가져오기 · MATHY YURI</title>
<style>
:root{--navy:#1f3a6e;--gold:#a8853f;--rose:#b76e79;--bg:#f5f1e8;--line:#e3dccb;--ink:#2b2f3a;--mut:#8a8f9e;--ok:#2f7d5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6}
.top{background:linear-gradient(90deg,#1f3a6e,#2c4d8f);color:#fff;padding:14px 18px}.top b{font-family:Georgia,serif;font-style:italic;color:#f0d9a0;font-size:20px;margin-right:10px}
.wrap{max-width:860px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 6px;font-size:18px}.muted{color:var(--mut);font-size:13px}
input[type=password]{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;width:240px}
button{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}
button.g{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.bar{height:12px;background:#eef0f5;border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .2s}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border-bottom:1px solid #eee;padding:5px 6px;text-align:left}th{background:#f4f6fa}
.ok{color:var(--ok);font-weight:700}.err{color:#b84a4a;font-weight:700}.hidden{display:none}
</style>
</head>
<body>
<div class="top"><b>MATHY YURI</b>문제 가져오기</div>
<div class="wrap">
  <div class="card" id="loginCard">
    <h2>원장 비밀번호</h2>
    <div class="muted" style="margin-bottom:10px">원장만 쓸 수 있어요. 비밀번호는 이 화면 밖으로 저장되지 않아요.</div>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="off"> <button id="loginBtn">확인</button>
    <div class="err" id="lerr" style="margin-top:8px"></div>
  </div>

  <div class="card hidden" id="mainCard">
    <h2>문제 묶음 파일 올리기</h2>
    <div class="muted" style="margin-bottom:12px">컴퓨터에서 만들어 둔 <b>보강_1_그림_*.json</b>, <b>보강_2_문제_*.json</b> 파일을 한꺼번에 골라 주세요 (폴더를 열고 Ctrl+A). 이름순으로 그림 → 문제 순서로 올라가요.<br>
    같은 문제는 한 번만 저장되고, 같은 파일을 다시 올려도 중복으로 들어가지 않아요. 도중에 멈춰도 다시 처음부터 올리면 돼요.</div>
    <input type="file" id="files" multiple accept=".json,application/json">
    <div style="margin:12px 0"><button id="go" disabled>올리기 시작</button> <span id="sel" class="muted"></span></div>
    <div class="bar"><i id="pbar"></i></div>
    <div id="status" class="muted"></div>
    <table id="log" class="hidden"><tr><th>파일</th><th>그림</th><th>출처</th><th>문제</th><th>출처기록</th><th>해설</th><th></th></tr></table>
    <div id="sum" style="margin-top:12px;font-weight:700"></div>
  </div>
</div>
<script>
'use strict';
var qs=new URLSearchParams(location.search);
var RPC='https://eqllmvfbcdtzercliicy.supabase.co/rest/v1/rpc/';
var KEY='sb_publishable_OcoOR7ERpt8BFBLuQ2CoWw_lELDDCEV',TK='acadapp_tok_v1',tok=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
try{tok=localStorage.getItem(TK)}catch(e){}
async function call(fn,args){
 var r;try{r=await fetch(RPC+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(args)})}catch(e){return {ok:false,error:'인터넷 연결을 확인해 주세요'}}
 if(!r.ok)return {ok:false,error:'서버 오류 '+r.status+(r.status===404?' — 8_문제가져오기.sql 을 먼저 실행해 주세요':'')};
 try{return await r.json()}catch(e){return {ok:false,error:'서버 응답을 읽지 못했어요'}}}
async function check(){
 if(!tok)return false;
 var j=await call('mathy_import',{p_token:tok,p_batch:{}});
 if(j&&j.ok)return true;
 if(j&&/8_문제가져오기/.test(j.error||'')){$('#lerr').textContent=j.error}
 return false}
function show(ok){$('#loginCard').classList.toggle('hidden',ok);$('#mainCard').classList.toggle('hidden',!ok)}
async function init(){show(await check())}
$('#loginBtn').onclick=async function(){
 $('#lerr').textContent='';
 var j=await call('ac_api',{p_action:'login',p_token:null,p_args:{academy:'ds',role:'admin',password:$('#pw').value}});
 if(!j||!j.ok){$('#lerr').textContent=(j&&j.error)||'로그인하지 못했어요';return}
 tok=j.token;try{localStorage.setItem(TK,tok)}catch(e){}
 $('#pw').value='';
 if(await check())show(true);else $('#lerr').textContent=$('#lerr').textContent||'원장 비밀번호가 맞는지, 8_문제가져오기.sql 을 실행했는지 확인해 주세요'};
var FILES=[];
$('#files').onchange=function(){
 FILES=[].slice.call(this.files).filter(function(f){return /\.json$/i.test(f.name)}).sort(function(a,b){return a.name<b.name?-1:1});
 var mb=FILES.reduce(function(a,f){return a+f.size},0)/1048576;
 $('#sel').textContent=FILES.length?FILES.length+'개 파일 · '+mb.toFixed(1)+'MB':'';$('#go').disabled=!FILES.length};
$('#go').onclick=async function(){
 var btn=this;btn.disabled=true;$('#files').disabled=true;
 var tb=$('#log');tb.classList.remove('hidden');while(tb.rows.length>1)tb.deleteRow(1);
 var tot={figures:0,sources:0,problems:0,occ:0,tags:0,expl:0};$('#sum').textContent='';
 for(var i=0;i<FILES.length;i++){
  var f=FILES[i];$('#status').textContent='올리는 중… ('+(i+1)+' / '+FILES.length+') '+f.name;$('#pbar').style.width=(i*100/FILES.length)+'%';
  var b;try{b=JSON.parse(await f.text())}catch(e){addRow(f.name,null,'파일을 읽지 못했어요');break}
  var j=await call('mathy_import',{p_token:tok,p_batch:b});
  if(!j||!j.ok){addRow(f.name,null,(j&&j.error)||'올리지 못했어요');$('#status').innerHTML='<span class="err">멈췄어요. 위 오류를 확인하고 같은 파일들을 다시 골라 올려 주세요(이미 올라간 건 건너뛰어요).</span>';btn.disabled=false;$('#files').disabled=false;return}
  Object.keys(tot).forEach(function(k){tot[k]+=(j[k]||0)});addRow(f.name,j)}
 $('#pbar').style.width='100%';$('#status').textContent='';
 $('#sum').innerHTML='<span class="ok">끝났어요.</span> 새로 들어간 것 — 그림 '+tot.figures+' · 출처 '+tot.sources+' · 문제 '+tot.problems+' · 출처 기록 '+tot.occ+' · 해설 '+tot.expl+'<div class="muted" style="font-weight:400;margin-top:4px">이미 있던 문제와 겹치는 것은 새로 세지 않아요. 홈 화면의 "저장된 문제" 숫자가 늘어났는지 확인해 보세요.</div>';
 btn.disabled=false;$('#files').disabled=false};
function addRow(name,j,err){
 var tr=$('#log').insertRow(-1);
 tr.innerHTML='<td>'+esc(name)+'</td>'+(j?'<td>'+j.figures+'</td><td>'+j.sources+'</td><td>'+j.problems+'</td><td>'+j.occ+'</td><td>'+j.expl+'</td><td class="ok">✓</td>':'<td colspan="5" class="err">'+esc(err)+'</td><td></td>')}
init();
</script>
</body>
</html>
