  /* ── 수업 진행표 (메인 화면: 회차 목차) ── */
  function planOf(cls) { var c = S.plan && S.plan.classes ? S.plan.classes.filter(function (x) { return x.cls === cls; })[0] : null; return c ? c.rows : null; }
  function planState(rows) {      // 날짜 기준: 지났으면 진행됨, 오늘이면 오늘 수업, 아직이면 예정
