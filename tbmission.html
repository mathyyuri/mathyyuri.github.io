function fixTex(t){
 t=t.split(String.fromCharCode(0xe04d)).join(' '+BS+'mid ');
 t=t.replace(/\^\s*(-?\d+)/g,function(m,d){return '^{'+d+'}'}).replace(/-&gt;|->/g,BS+'rightarrow ');
 if(t.indexOf(BS+'begin{cases}{')>=0){t=t.replace(/\{?\\begin\{cases\}\{/g,BS+'begin{cases}').replace(/\\end\{cases\}\}+/g,BS+'end{cases}').split('#').join(BS+BS).replace(/(?:&amp;\s*){2,}/g,'&amp; ')}
 return t.replace(/(?:_\{\s*\})+/g,'')}
function fixStem(h){
 h=String(h||'').replace(new RegExp(BS+BS+'\\((.*?)'+BS+BS+'\\)','gs'),function(m,t){return BS+'('+fixTex(t)+BS+')'});
 return h.replace(/\s*\[\s*\d+(?:\.\d+)?\s*점\s*\]/g,'').replace(/<p>\s*<\/p>/g,'')}
function emp(td){return td.textContent.replace(/\s/g,'')===''&&!td.querySelector('img,table,.katex')}

 [].slice.call(root.querySelectorAll('table.hwpTbl')).reverse().forEach(function(t){
  if(!root.contains(t))return;var rows=[].slice.call(t.rows),nested=!!t.querySelector('table');
  var syn=!nested&&rows.length===3&&rows[0].cells.length>=4&&rows.every(function(r){return r.cells.length===rows[0].cells.length})&&emp(rows[1].cells[0])&&emp(rows[2].cells[0]);
  if(syn){t.className='syn';return}
  var tds=[].slice.call(t.querySelectorAll('td')).filter(function(td){return td.closest('table')===t}),ne=tds.filter(function(td){return !emp(td)});
  if(!ne.length&&!nested){t.parentNode.removeChild(t);return}
  if(!nested&&ne.length>2&&!t.querySelector('.hwpBogi')){t.className='grid';t.style.cssText='border-collapse:collapse;margin:8px auto';tds.forEach(function(td){td.style.cssText='border:1px solid #8a7f68;padding:4px 10px;text-align:center'});return}
  var box=document.createElement('div');box.className='cbox';ne.forEach(function(td){var d=document.createElement('div');d.innerHTML=td.innerHTML;box.appendChild(d)});t.parentNode.replaceChild(box,t)})}

 [].forEach.call(root.querySelectorAll('img[data-fig]'),function(im){var f=S.figs[im.getAttribute('data-fig')];if(f)im.src=f;im.className='fig'});

 var items=S.ex.items,n=items.length,G=S.R.filter(function(r){return r.ox&&r.score!=null}),tot=Math.round(items.reduce(function(a,it){return a+(+it.pts||1)},0)*100)/100;
 G.forEach(function(r){r.s=r.score==null?0:Math.round(+r.score*10)/10});G.sort(function(a,b){return b.s-a.s});
 G.forEach(function(r,i){r.rk=(i&&G[i-1].s===r.s)?G[i-1].rk:i+1});
 var cls={};G.forEach(function(r){(cls[r.cls]=cls[r.cls]||[]).push(r)});
 Object.keys(cls).forEach(function(k){cls[k].forEach(function(r,i,a){r.crk=(i&&a[i-1].s===r.s)?a[i-1].crk:i+1})});
 var rate=[],cnt=[];for(var i=0;i<n;i++){var o=0,t=0;G.forEach(function(r){var v=okAt(r,i);if(v!=null){t++;o+=v}});rate.push(t?o/t:null);cnt.push({o:o,t:t})}
 var crate={};Object.keys(cls).forEach(function(k){crate[k]=items.map(function(_,i){var o=0,t=0;cls[k].forEach(function(r){var v=okAt(r,i);if(v!=null){t++;o+=v}});return t?o/t:null})});
 S.C={items:items,n:n,G:G,tot:tot,cls:cls,rate:rate,cnt:cnt,crate:crate,avg:G.length?G.reduce(function(a,r){return a+r.s},0)/G.length:0}}

function parseSheet(t){
 var out=[],bad=[];
 t.split(/\r?\n/).forEach(function(line){
  var cells=line.split('\t').map(function(c){return c.trim()}).filter(Boolean);if(!cells.length)return;
  if(cells.length<3&&line.indexOf(',')>0)cells=line.split(',').map(function(c){return c.trim()}).filter(Boolean);
  var nm='',cl='',sc='',ph='',ph2='';
  cells.forEach(function(c){var d=c.replace(/[^0-9]/g,'');
   if(/^0?1[0-9]{9,10}$/.test(d)&&d.length>=10){ph2=ph;ph=d}
   else if(/^(S\+|S|A\+|A|B|T)(-?[A-Za-z]*)?반?$/i.test(c)||/반$/.test(c)||/Class|공수내모/i.test(c)){if(!cl)cl=(/^(S\+|S|A\+|A|B)$/i.test(c)?c.toUpperCase()+'반':c)}
   else if(/(고|중|고등학교|중학교)$/.test(c)&&!sc)sc=c
   else if(/^[가-힣]{2,4}$/.test(c)&&!nm)nm=c});
  if(!nm||!ph){bad.push(line.slice(0,30));return}
  out.push({cls:cl,name:nm,school:sc,phone:ph.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3')})});
 return {rows:out,bad:bad}}

 if(a==='noteabsent'){var sid0=b.getAttribute('data-sid'),r0=+b.getAttribute('data-r'),st0=(S.studs||[]).filter(function(x){return x.id===sid0})[0];if(st0&&confirm(st0.name+' 학생을 '+r0+'회차 오답노트 미참여(교재 미제출)로 표시할까요?')){if(await noteMark(st0,r0))await noteRefreshList()}return}
 if(a==='notebulk'){var td=noteBulk();if(td.length&&confirm('교재 미제출 미참여로 표시할까요?\n'+td.map(function(t){return '· '+t.st.name+' '+t.r+'회차'}).join('\n'))){for(var q=0;q<td.length;q++)await noteMark(td[q].st,td[q].r,true);await noteRefreshList()}return}
 if(a==='noterefresh'){S.notes=null;render();return}
 if(a==='more'){S.lim=(S.lim||30)+30;render();return}
 if(a==='imp'){openImp();return}
 if(a==='new'){openNew();return}
 if(a==='newok'){newOk();return}
 if(a==='infosave'){saveInfo();return}
 if(a==='mvup'){moveIn(b.getAttribute('data-id'),-1);return}
 if(a==='mvdn'){moveIn(b.getAttribute('data-id'),1);return}
 if(a==='impgo'){runImp();return}
 if(a==='stu'){openStu();return}
 if(a==='sprev'||a==='sok'){var P=parseSheet($('#sst').value);
  if(a==='sprev'){$('#sres').innerHTML='<b>'+P.rows.length+'명</b> 찾았어요.'+(P.bad.length?'<br>건너뜀: '+esc(P.bad.join(' / ')):'')+'<div style="max-height:160px;overflow:auto;margin-top:6px">'+P.rows.map(function(r){return esc(r.cls)+' · '+esc(r.name)+' · '+esc(r.school)+' · '+esc(r.phone.slice(0,-4))+'****'}).join('<br>')+'</div>';return}
  if(!P.rows.length){alert('등록할 학생을 찾지 못했어요');return}
  var ac=$('#sa').value,jj=await api('students_import',{rows:P.rows.map(function(r){return {academy:ac,cls:r.cls,name:r.name,school:r.school,phone:r.phone}})});
  if(!jj||!jj.ok){alert((jj&&jj.error)||'등록하지 못했어요');return}
  var jl=await ms('students');S.studs=jl&&jl.ok?jl.students:S.studs;renderStu();$('#sres').innerHTML='<b>'+jj.n+'명 등록했어요.</b>'+(jj.bad&&jj.bad.length?'<br>등록하지 못함: '+esc(jj.bad.map(function(x){return x.name+'('+x.error+')'}).join(', ')):'');return}
 if(a==='nsave'){var id=b.getAttribute('data-id'),inp=document.querySelector('[data-nid="'+id+'"]'),jn2=await ms('nick',{sid:id,nick:inp.value});alert(jn2&&jn2.ok?'저장했어요':((jn2&&jn2.error)||'저장하지 못했어요'));return}
});
document.addEventListener('change',function(ev){var t=ev.target;
 if(t.id==='whosel'){S.who=t.value;render()}
 if(t.id==='gsel'){S.gwho=t.value;render()}
 if(t.id==='ovsel'){S.ovSid=t.value;S.hist=null;render();loadHist().then(render)}
 if(t.id==='impf'&&t.files&&t.files[0])readImp(t.files[0]);});
document.addEventListener('input',function(ev){var t=ev.target;if(t.getAttribute&&t.getAttribute('data-nk')&&S.GN)S.GN[t.getAttribute('data-nk')]=t.value;if(t.classList&&t.classList.contains('oxin')&&t.getAttribute('data-k')){var k=t.getAttribute('data-k'),v=normOx(t.value),n=S.C?S.C.n:0,L=document.querySelector('[data-len="'+k+'"]');if(L)L.innerHTML=v?'<span style="color:'+(v.length===n?'#2f7d5b':'#b84a4a')+'">'+v.length+'/'+n+'</span>':''}});
render();if(S.tok)boot();
})();
</script></body></html>
