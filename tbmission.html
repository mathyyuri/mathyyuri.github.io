<style>

.mc .t{font-family:var(--fk);font-size:19px;font-weight:700;margin:2px 0 6px}.mc .k{display:flex;gap:16px;margin-top:10px}.mc .k b{font-size:20px;font-family:var(--fk);display:block}.mc .k span{font-size:11.5px;color:var(--mute)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px}.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 16px;font-size:13.5px;font-weight:700;color:var(--mute)}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}.tbl th{background:#f1f3f8;font-size:12.5px}.tbl td.l{text-align:left}
tr.me td{background:#fff6e0}tr.me td:first-child{box-shadow:inset 4px 0 0 var(--rose)}
.cb{display:inline-block;padding:1px 9px;border-radius:12px;font-weight:700;font-size:12px;line-height:1.6}
.bar{position:relative;height:10px;background:#eef0f5;border-radius:5px;min-width:80px}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--rose)}.bar.n i{background:var(--navy)}
.oxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}.ox{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 2px;text-align:center;line-height:1.25}.ox i{display:block;font-style:normal;font-size:11px;color:var(--mute)}.ox b{font-size:18px}.ox span{display:block;font-size:10.5px;color:var(--mute)}.ox.o b{color:var(--navy)}.ox.o{background:#f1f5fc}.ox.x b{color:var(--rose)}.ox.x{background:#fdf1f3;border-color:#f0cdd3}.ox.t b{color:#b7791f}.ox.t{background:#fff8e6;border-color:#ecd9a6}.mx td.t{color:#b7791f;background:#fff8e6;font-weight:700}
.mxw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}table.mx{border-collapse:separate;border-spacing:0;font-size:12.5px}.mx th,.mx td{padding:4px 5px;text-align:center;border-bottom:1px solid #eef0f5;min-width:26px;background:#fff}.mx th{position:sticky;top:0;background:#f1f3f8;z-index:2;font-size:11.5px}.mx td.nm,.mx th.nm{position:sticky;left:0;z-index:3;text-align:left;min-width:92px;background:#fff;border-right:1px solid var(--line);font-weight:700}.mx th.nm{background:#f1f3f8;z-index:4}.mx td.o{color:var(--navy);font-weight:700}.mx td.x{color:var(--rose);background:#fdf1f3;font-weight:700}.mx tr.me td{background:#fff6e0}.mx tr.me td.x{background:#fbe6e9}.mx tr.rt td{background:#faf6ee;font-weight:700;font-size:11px;color:#555}
.pc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}.pc .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.pc .no{font-family:var(--fk);font-weight:700;font-size:20px;color:var(--rose)}
.q{font-size:15px;line-height:1.85;word-break:keep-all}.q p{margin:0 0 6px}.q img.fig{max-width:100%;max-height:260px;display:block;margin:6px auto}.q .cbox{border:1px solid #6f6450;padding:8px 12px;margin:8px 0;border-radius:4px}.q .hwpBlankBox{display:inline-block;min-width:40px;border-bottom:1.5px solid #7d7364}
.ch{display:grid;gap:4px 14px;margin-top:8px;font-size:14.5px}.ch.c5{grid-template-columns:repeat(5,1fr)}.ch.c3{grid-template-columns:repeat(3,1fr)}.ch.c2{grid-template-columns:1fr 1fr}.ch.c1{grid-template-columns:1fr}.ch span b{color:var(--rose);margin-right:6px;font-weight:500}
.an{background:#faf6ee;border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:13.5px;line-height:1.8;margin-top:10px}.an b{color:var(--navy)}
.tag{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11.5px;font-weight:700;background:#eef0f5;color:#444}.tag.hard{background:#fbe6e9;color:#a8434f}.tag.mid{background:#fbf1d6;color:#8a6a14}.tag.easy{background:#e3f0e8;color:#2f6a4c}
.mdl{position:fixed;inset:0;background:rgba(20,26,45,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto}.mdl[hidden]{display:none}.mb{background:#fff;border-radius:14px;width:min(760px,100%);padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.35)}.mb h3{margin:0 0 8px;font-family:var(--fk)}
.mb textarea{width:100%;min-height:150px;border:1px solid #d9deea;border-radius:10px;padding:10px;font-family:Consolas,monospace;font-size:13px}
.oxin{width:100%;border:1px solid #d9deea;border-radius:8px;padding:6px 8px;font-family:Consolas,monospace;font-size:14px;letter-spacing:.5px;min-width:160px}
.note1{background:#fbf3ea;border-left:5px solid #c9855a;padding:10px 14px;border-radius:6px;font-size:13px;line-height:1.7;margin-bottom:12px}
.empty{padding:30px 10px;text-align:center;color:var(--mute);line-height:1.8}
.ub{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}.ub .nm{width:130px;flex:none}.ub .bar{flex:1}.ub b{width:70px;text-align:right;font-size:12.5px}
@media(max-width:640px){.wrap{padding:10px 8px 50px}.card{padding:12px}.top h1{font-size:15px}.tbl{font-size:12.5px}.hide-m{display:none}}

<script>
(function(){
'use strict';
var BS=String.fromCharCode(92);
var qs=new URLSearchParams(location.search);
var RPC='https://eqllmvfbcdtzercliicy.supabase.co/rest/v1/rpc/';
var KEY='sb_publishable_OcoOR7ERpt8BFBLuQ2CoWw_lELDDCEV',TK='acadapp_tok_v1';
var AC={ds:'대치에스플러스학원',bd:'분당미래탐구'};
var CCOL={'S+':'#1f3a6e','S':'#b76e79','A+':'#c9a55d','A':'#8d94a3','B':'#c5c9d2'};
var CIRC='①②③④⑤';
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cn(c){return String(c||'').replace(/반$/,'')}
function cc(c){return CCOL[cn(c)]||'#a0a6b5'}
function ct(c){var k=cn(c);return (k==='A+'||k==='B'||!CCOL[k])?'#2b2f3a':'#fff'}
function badge(c){return '<span class="cb" style="background:'+cc(c)+';color:'+ct(c)+'">'+esc(cn(c)||'-')+'</span>'}
function pct(a,b){return b?Math.round(a*100/b):0}
var S={tok:null,me:null,list:[],cards:{},sel:null,ex:null,R:[],C:null,view:'my',who:null,prob:{},figs:{},sort:'no',studs:null,msg:''};
try{S.tok=localStorage.getItem(TK)}catch(e){}

/* ───────── 서버 ───────── */
async function call(fn,args){
 var r;try{r=await fetch(RPC+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(args)})}catch(e){return {ok:false,error:'인터넷 연결을 확인해 주세요'}}
 if(!r.ok)return {ok:false,error:'서버 오류 '+r.status+(r.status===404?' — 4_교과서미션_서버.sql 을 먼저 실행해 주세요':'')};
 try{return await r.json()}catch(e){return {ok:false,error:'서버 응답을 읽지 못했어요'}}}
async function api(a,args){var j=await call('ac_api',{p_action:a,p_token:S.tok,p_args:args||{}});guard(j);return j}
async function ms(a,args){var j=await call('ac_mission',{p_action:a,p_token:S.tok,p_args:args||{}});guard(j);return j}
function guard(j){if(j&&j.ok===false&&/다시 로그인/.test(j.error||''))logout(true)}
function logout(soft){S.tok=null;S.me=null;try{localStorage.removeItem(TK)}catch(e){}if(!soft||true)render()}
var isStaff=function(){return S.me&&(S.me.role==='admin'||S.me.role==='ta')};
var isAdmin=function(){return S.me&&S.me.role==='admin'};

/* ───────── 문제 글 다듬기 (HWP 변환 흔적) ───────── */
function fixTex(t){
 t=t.split(String.fromCharCode(0xe04d)).join(' '+BS+'mid ');
 t=t.replace(/\^\s*(-?\d+)/g,function(m,d){return '^{'+d+'}'}).replace(/-&gt;|->/g,BS+'rightarrow ');
 if(t.indexOf(BS+'begin{cases}{')>=0){t=t.replace(/\{?\\begin\{cases\}\{/g,BS+'begin{cases}').replace(/\\end\{cases\}\}+/g,BS+'end{cases}').split('#').join(BS+BS).replace(/(?:&amp;\s*){2,}/g,'&amp; ')}
 return t.replace(/(?:_\{\s*\})+/g,'')}
function fixStem(h){
 h=String(h||'').replace(new RegExp(BS+BS+'\\((.*?)'+BS+BS+'\\)','gs'),function(m,t){return BS+'('+fixTex(t)+BS+')'});
 return h.replace(/\s*\[\s*\d+(?:\.\d+)?\s*점\s*\]/g,'').replace(/<p>\s*<\/p>/g,'')}
function emp(td){return td.textContent.replace(/\s/g,'')===''&&!td.querySelector('img,table,.katex')}
function fixTables(root){
 [].slice.call(root.querySelectorAll('table.hwpTbl')).reverse().forEach(function(t){
  if(!root.contains(t))return;var rows=[].slice.call(t.rows),nested=!!t.querySelector('table');
  var syn=!nested&&rows.length===3&&rows[0].cells.length>=4&&rows.every(function(r){return r.cells.length===rows[0].cells.length})&&emp(rows[1].cells[0])&&emp(rows[2].cells[0]);
  if(syn){t.className='syn';return}
  var tds=[].slice.call(t.querySelectorAll('td')).filter(function(td){return td.closest('table')===t}),ne=tds.filter(function(td){return !emp(td)});
  if(!ne.length&&!nested){t.parentNode.removeChild(t);return}
  if(!nested&&ne.length>2&&!t.querySelector('.hwpBogi')){t.className='grid';t.style.cssText='border-collapse:collapse;margin:8px auto';tds.forEach(function(td){td.style.cssText='border:1px solid #8a7f68;padding:4px 10px;text-align:center'});return}
  var box=document.createElement('div');box.className='cbox';ne.forEach(function(td){var d=document.createElement('div');d.innerHTML=td.innerHTML;box.appendChild(d)});t.parentNode.replaceChild(box,t)})}
function mathIn(root){
 [].forEach.call(root.querySelectorAll('img[data-fig]'),function(im){var f=S.figs[im.getAttribute('data-fig')];if(f)im.src=f;im.className='fig'});
 fixTables(root);
 try{renderMathInElement(root,{delimiters:[{left:BS+'(',right:BS+')',display:false}],throwOnError:false})}catch(e){}}
function chHtml(ch){
 if(!ch||!ch.length)return '';var L=0;ch.forEach(function(c){L=Math.max(L,String(c).replace(/<[^>]+>/g,'').replace(/\\[a-zA-Z]+/g,'x').replace(/[{}\\()\s]/g,'').length)});
 var n=L<=7?5:L<=14?3:L<=30?2:1;return '<div class="ch c'+n+'">'+ch.map(function(c,i){return '<span><b>'+CIRC[i]+'</b>'+fixStem(c)+'</span>'}).join('')+'</div>'}

/* ───────── 계산 ───────── */
function okAt(r,i){var c=r.ox&&r.ox[i];return c==='O'?1:(c==='X'||c==='T')?0:null}
function calc(){
 var items=S.ex.items,n=items.length,G=S.R.filter(function(r){return r.ox}),tot=Math.round(items.reduce(function(a,it){return a+(+it.pts||1)},0)*100)/100;
 G.forEach(function(r){r.s=r.score==null?0:+r.score});G.sort(function(a,b){return b.s-a.s});
 G.forEach(function(r,i){r.rk=(i&&G[i-1].s===r.s)?G[i-1].rk:i+1});
 var cls={};G.forEach(function(r){(cls[r.cls]=cls[r.cls]||[]).push(r)});
 Object.keys(cls).forEach(function(k){cls[k].forEach(function(r,i,a){r.crk=(i&&a[i-1].s===r.s)?a[i-1].crk:i+1})});
 var rate=[],cnt=[];for(var i=0;i<n;i++){var o=0,t=0;G.forEach(function(r){var v=okAt(r,i);if(v!=null){t++;o+=v}});rate.push(t?o/t:null);cnt.push({o:o,t:t})}
 var crate={};Object.keys(cls).forEach(function(k){crate[k]=items.map(function(_,i){var o=0,t=0;cls[k].forEach(function(r){var v=okAt(r,i);if(v!=null){t++;o+=v}});return t?o/t:null})});
 S.C={items:items,n:n,G:G,tot:tot,cls:cls,rate:rate,cnt:cnt,crate:crate,avg:G.length?G.reduce(function(a,r){return a+r.s},0)/G.length:0}}
function meRow(){return S.R.filter(function(r){return r.me})[0]}
function whoRow(){var k=isStaff()?S.who:null;return isStaff()?(S.R.filter(function(r){return r.k===k})[0]||null):meRow()}
function groups(by){var o={},ord=[];S.C.items.forEach(function(it,i){var k=it[by]||'기타';if(!o[k]){o[k]=[];ord.push(k)}o[k].push(i)});return ord.map(function(k){return {k:k,idx:o[k]}})}
function rateCls(r){return r==null?'':r>=.8?'easy':r>=.5?'mid':'hard'}
function rateTxt(r){return r==null?'-':Math.round(r*100)+'%'}

/* ───────── 화면 ───────── */
function render(){
 var a=$('#app');
 if(!S.tok||!S.me){a.innerHTML=vLogin();return}
 var h='<div class="top"><div class="in"><span class="logo">MATHY YURI</span><h1>교과서 미션</h1><span class="sp"></span><span class="chipu">'+esc(S.me.name||'')+(isStaff()?' · '+(isAdmin()?'원장':'조교'):(S.me.role==='parent'?' · 학부모':' · 학생'))+'</span>'+
  (!isStaff()?'<button class="tb g" data-a="nick">'+(S.ex?'이 미션 닉네임':'기본 닉네임')+'</button>':'')+(isAdmin()?'<button class="tb g" data-a="imp">이전 기록 가져오기</button><button class="tb g" data-a="stu">학생 관리</button>':'')+'<button class="tb" data-a="out">로그아웃</button></div></div><div class="wrap">';
 h+=S.ex?vDetail():vList();
 a.innerHTML=h+'</div>';
 if(S.ex)after();else loadCards()}
function vLogin(){
 return '<div class="login"><div class="card"><div class="logo" style="color:#a8853f">MATHY YURI</div><h2>교과서 미션</h2><div class="muted sm" style="margin-bottom:12px">정오표 · 정답률 · 오답노트</div>'+
 '<div class="fld"><label>학원</label><div class="seg" id="lac"><button class="on" data-ac="ds">대치에스플러스</button><button data-ac="bd">분당미래탐구</button></div></div>'+
 '<div class="fld"><label>구분</label><div class="seg" id="lrole"><button class="on" data-role="student">학생</button><button data-role="parent">학부모</button><button data-role="admin">원장</button><button data-role="ta">조교</button></div></div>'+
 '<div class="fld" id="fname"><label>이름</label><input id="lname" autocomplete="off"></div><div class="fld"><label id="lpl">학부모 전화번호 뒤 4자리</label><input id="lpin" type="password" autocomplete="off" inputmode="numeric"></div>'+
 '<button class="btn" style="width:100%;margin-top:6px" data-a="login">들어가기</button><div class="err" id="lerr"></div></div></div>'}
var LOGIN={ac:'ds',role:'student'};
function catOf(m){return m.cat||'기타'}
function mineHtml(m){
 var c=S.cards[m.id];
 if(c===undefined)return '<div class="muted sm" style="margin-top:10px">불러오는 중…</div>';
 if(!c)return '<div class="muted sm" style="margin-top:10px">내 기록이 없어요</div>';
 return '<div class="k"><div><b>'+c.me.s+'점</b><span>내 점수</span></div><div><b>'+c.rk+'위 / '+c.n+'</b><span>전체 순위</span></div><div><b>'+c.acc+'%</b><span>정답률</span></div></div>'}
function visList(){return S.list.filter(function(m){return !S.cat||catOf(m)===S.cat}).slice(0,S.lim||30)}
function vList(){

 if(a==='close'){$('#md').hidden=true;return}
 if(a==='icls'){S.icls=b.getAttribute('data-v');render();return}
 if(a==='paste'){openPaste();return}if(a==='pasteok'){pasteOk();return}
 if(a==='saveox'){saveOx();return}

 if(a==='delmis'){if(!confirm('이 미션과 정오표 기록을 모두 삭제할까요?'))return;var jd=await ms('delete',{exam_id:S.ex.id});if(jd&&jd.ok){S.list=S.list.filter(function(m){return m.id!==S.ex.id});S.ex=null;render()}else alert((jd&&jd.error)||'삭제하지 못했어요');return}
 if(a==='mknote'){S.who=b.getAttribute('data-k');S.view='note';render();return}
 if(a==='mknote2'){var wsel=$('#notewho'),range=document.querySelector('#noterange .on').getAttribute('data-r'),sol=$('#notesol')?$('#notesol').checked:false,keys;
  if(isStaff()){var v=wsel.value;keys=v==='__all'?S.C.G.map(function(r){return r.k}):v.indexOf('cls:')===0?S.C.G.filter(function(r){return r.cls===v.slice(4)}).map(function(r){return r.k}):[v]}else keys=[meRow().k];
  makeNote(keys,range,sol);return}
 if(a==='nick'){var per=!!S.ex,nk=prompt(per?'이 미션에서 쓸 닉네임을 적어 주세요 (2~10자, 친구 이름과 같으면 안 돼요). 비우면 기본 닉네임으로 돌아가요.':'기본 닉네임을 정해 주세요 (2~10자). 미션마다 따로 정하려면 미션을 연 뒤 이 버튼을 눌러요.');if(nk===null)return;var jn=await ms('nick',per?{nick:nk,exam_id:S.ex.id}:{nick:nk});alert(jn&&jn.ok?'바꿨어요':((jn&&jn.error)||'바꾸지 못했어요'));if(S.ex)await openMission(S.ex.id,S.view);return}
 if(a==='cat'){S.cat=b.getAttribute('data-v');S.lim=30;render();return}
 if(a==='more'){S.lim=(S.lim||30)+30;render();return}
 if(a==='imp'){openImp();return}
 if(a==='impgo'){runImp();return}
 if(a==='stu'){openStu();return}
 if(a==='sprev'||a==='sok'){var P=parseSheet($('#sst').value);
  if(a==='sprev'){$('#sres').innerHTML='<b>'+P.rows.length+'명</b> 찾았어요.'+(P.bad.length?'<br>건너뜀: '+esc(P.bad.join(' / ')):'')+'<div style="max-height:160px;overflow:auto;margin-top:6px">'+P.rows.map(function(r){return esc(r.cls)+' · '+esc(r.name)+' · '+esc(r.school)+' · '+esc(r.phone.slice(0,-4))+'****'}).join('<br>')+'</div>';return}
  if(!P.rows.length){alert('등록할 학생을 찾지 못했어요');return}
  var ac=$('#sa').value,jj=await api('students_import',{rows:P.rows.map(function(r){return {academy:ac,cls:r.cls,name:r.name,school:r.school,phone:r.phone}})});
  if(!jj||!jj.ok){alert((jj&&jj.error)||'등록하지 못했어요');return}
  var jl=await ms('students');S.studs=jl&&jl.ok?jl.students:S.studs;renderStu();$('#sres').innerHTML='<b>'+jj.n+'명 등록했어요.</b>'+(jj.bad&&jj.bad.length?'<br>등록하지 못함: '+esc(jj.bad.map(function(x){return x.name+'('+x.error+')'}).join(', ')):'');return}
 if(a==='nsave'){var id=b.getAttribute('data-id'),inp=document.querySelector('[data-nid="'+id+'"]'),jn2=await ms('nick',{sid:id,nick:inp.value});alert(jn2&&jn2.ok?'저장했어요':((jn2&&jn2.error)||'저장하지 못했어요'));return}
});
document.addEventListener('change',function(ev){var t=ev.target;
 if(t.id==='whosel'){S.who=t.value;render()}
 if(t.id==='impf'&&t.files&&t.files[0])readImp(t.files[0]);});
document.addEventListener('input',function(ev){var t=ev.target;if(t.classList&&t.classList.contains('oxin')&&t.getAttribute('data-k')){var k=t.getAttribute('data-k'),v=normOx(t.value),n=S.C?S.C.n:0,L=document.querySelector('[data-len="'+k+'"]');if(L)L.innerHTML=v?'<span style="color:'+(v.length===n?'#2f7d5b':'#b84a4a')+'">'+v.length+'/'+n+'</span>':''}});
render();if(S.tok)boot();
})();
