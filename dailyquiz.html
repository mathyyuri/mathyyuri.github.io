<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일일일모 | MATHY YURI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root {
  --bg: #fdfbf7;
  --card: #ffffff;
  --dark: #3a3530;
  --gold: #c8a84b;
  --gold-deep: #a8853f;
  --line: #eae5da;
  --pink: #e58ba4;
  --pink-deep: #c64e71;
  --mint: #8ba8a1;
  --mint-deep: #5b8a80;
  --blue: #8a96b8;
  --shadow: 0 10px 30px rgba(58,53,48,0.06);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Poppins', 'Noto Serif KR', serif; background: var(--bg); color: var(--dark); margin: 0; padding: 0; min-height: 100vh; }
.wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }
.hidden { display: none !important; }

/* ---------- 필기 풀이 제출 (whiteboard.html 연동) ---------- */
.wbSolveBtn {
  width: 100%; margin-top: 4px; padding: 11px; border-radius: 12px; border: 1.5px dashed var(--mint-deep);
  background: #f4f9f7; color: var(--mint-deep); font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: inherit;
}
.wbSolveBtn:active { background: #e9f3ef; }
.docModal { display: none; position: fixed; inset: 0; background: rgba(26,26,26,0.6); z-index: 500; }
.docModal.open { display: flex; flex-direction: column; }
.docModalBar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--dark); color: #fff; font-size: 0.85rem; }
.docModalBar button { background: var(--pink-deep); border: none; color: #fff; padding: 9px 14px; font-size: 0.78rem; font-weight: 700; border-radius: 8px; cursor: pointer; }
#docModalFrame { flex: 1; border: none; width: 100%; background: #fff; }

/* ---------- header ---------- */
.appHeader { text-align: center; padding: 26px 20px 16px; }
.appHeader h1 { margin: 0; font-size: 1.15rem; letter-spacing: 3px; font-weight: 700; }
.appHeader p { margin: 4px 0 0; font-size: 0.68rem; opacity: 0.45; letter-spacing: 2px; }

/* ---------- login ---------- */
#screen-login { padding: 20px; flex: 1; display: flex; align-items: center; }
.loginCard { width: 100%; background: var(--card); border-radius: 20px; padding: 34px 26px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.loginCard h2 { text-align: center; font-family: 'Noto Serif KR'; font-size: 1.3rem; margin: 0 0 6px; }
.loginCard .sub { text-align: center; font-size: 0.78rem; opacity: 0.5; margin: 0 0 26px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; color: #777; margin-bottom: 7px; }
.field input { width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid #ddd; background: var(--bg); font-size: 1rem; outline: none; font-family: inherit; }
.field input:focus { border-color: var(--gold); }
.loginBtn { width: 100%; background: var(--dark); color: #fff; padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
.loginBtn:disabled { background: #bbb; }
.errMsg { color: var(--pink-deep); font-size: 0.8rem; margin-top: 12px; min-height: 18px; text-align: center; }

/* ---------- rounds ---------- */
#screen-rounds { padding: 8px 18px 20px; flex: 1; }
.userBar { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; border: 1px solid var(--line); }
.userBar .who { font-weight: 700; font-family: 'Noto Serif KR'; font-size: 0.95rem; }
.userBar .who small { display: block; font-weight: 400; font-size: 0.68rem; opacity: 0.5; margin-top: 2px; }
.userBar button { background: none; border: 1px solid #ddd; border-radius: 20px; padding: 6px 13px; font-size: 0.72rem; color: #999; cursor: pointer; }
.rankLinkRow { text-align: center; margin-bottom: 16px; }
.rankLinkRow a { font-size: 0.78rem; color: var(--gold-deep); text-decoration: none; font-weight: 600; }
.roundGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.roundBtn {
  aspect-ratio: 1/1; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: 'Poppins'; cursor: pointer; color: var(--dark);
}
.roundBtn .n { font-size: 1.05rem; font-weight: 700; }
.roundBtn .lbl { font-size: 0.55rem; opacity: 0.5; letter-spacing: 0.5px; }
.roundBtn.locked { background: #f2f0eb; color: #bbb; border-style: dashed; cursor: not-allowed; }
.roundBtn.locked .lbl { opacity: 0.6; }
/* 회차별 점수 배지 — 점수가 한눈에 크게 보이도록 회차 번호는 작게 줄이고
   점수를 주인공으로 키움. 재도전 단계(2차/3차)는 색으로 바로 구분되게
   (2차=골드, 3차=핑크로 "얼마 안 남았다" 느낌 강하게, 완료=민트). */
.roundBtn.hasStatus .n { font-size: 0.62rem; font-weight: 600; opacity: 0.5; }
.roundBtn .rbScore { font-size: 1.15rem; font-weight: 800; line-height: 1.15; margin-top: 1px; }
.roundBtn .rbTag { font-size: 0.55rem; font-weight: 700; padding: 1.5px 8px; border-radius: 8px; margin-top: 3px; letter-spacing: 0.3px; }
.roundBtn.rbDone { border-color: var(--mint-deep); background: #f3f8f6; }
.roundBtn.rbDone .rbScore { color: var(--mint-deep); }
.roundBtn.rbAttempt2 { border-color: var(--gold); background: #fdf8ee; }
.roundBtn.rbAttempt2 .rbScore { color: var(--gold-deep); }
.roundBtn.rbAttempt2 .rbTag { background: var(--gold); color: #fff; }
.roundBtn.rbAttempt3 { border-color: var(--pink-deep); background: #fdf1f4; }
.roundBtn.rbAttempt3 .rbScore { color: var(--pink-deep); }
.roundBtn.rbAttempt3 .rbTag { background: var(--pink-deep); color: #fff; }
.legendNote { text-align: center; font-size: 0.7rem; color: #aaa; margin-top: 16px; line-height: 1.6; }

/* ---------- quiz ---------- */
#screen-quiz { padding: 0 18px 20px; flex: 1; display: flex; flex-direction: column; }
.quizTop { padding: 10px 0 14px; }
.roundPdfBtn { width: 100%; margin-top: 10px; padding: 11px; border-radius: 12px; border: 1.5px dashed var(--gold-deep); background: #fbf6ea; color: var(--gold-deep); font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: inherit; }
.roundPdfBtn:active { background: #f6ecd4; }
.progressRow { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #999; margin-bottom: 8px; }
.progressRow b { color: var(--dark); font-weight: 700; }
.progressBar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progressBar > div { height: 100%; background: var(--gold); transition: width 0.25s; }
.qCard { background: var(--card); border-radius: 18px; padding: 22px 20px; box-shadow: var(--shadow); border: 1px solid var(--line); flex: 1; }
.qStem { font-size: 0.98rem; line-height: 1.75; margin-bottom: 20px; word-break: keep-all; }
.qStem img { max-width: 100%; border-radius: 8px; }
.choiceList { display: flex; flex-direction: column; gap: 9px; margin-bottom: 22px; }
.choiceBtn {
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 13px 15px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--bg);
  font-size: 0.92rem; line-height: 1.5; cursor: pointer; font-family: inherit; color: var(--dark);
}
.choiceBtn .num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 1.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: #999; }
.choiceBtn.picked { background: #fbf3e2; border-color: var(--gold); }
.choiceBtn.picked .num { background: var(--gold); border-color: var(--gold); color: #fff; }
.metaLabel { font-size: 0.76rem; font-weight: 700; color: #999; margin-bottom: 9px; letter-spacing: 0.5px; }
.metaRow { display: flex; gap: 8px; margin-bottom: 4px; }
.metaBtn { flex: 1; padding: 11px 4px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--bg); font-size: 0.82rem; font-weight: 600; color: #999; cursor: pointer; font-family: inherit; }
.metaBtn[data-m="확실"].picked { background: var(--mint-deep); border-color: var(--mint-deep); color: #fff; }
.metaBtn[data-m="애매"].picked { background: var(--gold); border-color: var(--gold); color: #fff; }
.metaBtn[data-m="모름"].picked { background: var(--pink-deep); border-color: var(--pink-deep); color: #fff; }
.quizNav { display: flex; gap: 10px; margin-top: 18px; }
.navBtn { flex: 1; padding: 15px; border-radius: 13px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit; }
.navBtn.prevBtn { background: var(--card); color: #999; border: 1.5px solid var(--line); flex: 0 0 78px; }
.navBtn.nextBtn { background: var(--dark); color: #fff; }
.navBtn.nextBtn:disabled { background: #ddd; color: #aaa; cursor: not-allowed; }
.hintMsg { text-align: center; font-size: 0.72rem; color: #bbb; margin-top: 10px; }

/* ---------- results ---------- */
#screen-result { padding: 8px 18px 30px; flex: 1; }
.scoreCard { background: var(--dark); color: #fff; border-radius: 20px; padding: 26px 20px; text-align: center; margin-bottom: 18px; }
.scoreCard .label { font-size: 0.72rem; letter-spacing: 2px; opacity: 0.6; }
.scoreCard .score { font-family: 'Noto Serif KR'; font-weight: 900; font-size: 2.4rem; margin: 6px 0; color: var(--gold); }
.scoreCard .sub { font-size: 0.78rem; opacity: 0.7; }
.resultGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-bottom: 20px; }
.resultCell { aspect-ratio: 1/1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; gap: 1px; }
.resultCell.ok { background: #e9f3ef; color: var(--mint-deep); }
.resultCell.no { background: #fbeaee; color: var(--pink-deep); }
.resultCell .pts { font-size: 0.58rem; font-weight: 400; opacity: 0.75; }
.retryBox { background: var(--card); border: 1.5px solid var(--pink); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.retryBox .ttl { font-weight: 700; font-size: 0.88rem; margin-bottom: 4px; }
.retryBox .desc { font-size: 0.74rem; color: #999; margin-bottom: 14px; line-height: 1.5; }
.retryItem { border-top: 1px solid var(--line); padding: 14px 0; }
.retryItem:first-of-type { border-top: none; }
.retryItem .qn { font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.retryWbBtn { font-weight: 600; font-size: 0.68rem; color: var(--mint-deep); background: #f4f9f7; border: 1px solid var(--mint-deep); border-radius: 8px; padding: 4px 8px; cursor: pointer; font-family: inherit; }
.retryChoices { display: flex; flex-wrap: wrap; gap: 6px; }
.retryChoiceBtn { padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-size: 0.78rem; cursor: pointer; font-family: inherit; }
.retryChoiceBtn.picked { background: var(--gold); border-color: var(--gold); color: #fff; }
.submitRetryBtn { width: 100%; background: var(--pink-deep); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 0.92rem; cursor: pointer; margin-top: 6px; }
.submitRetryBtn:disabled { background: #ddd; color: #aaa; }
.lockedNote { font-size: 0.72rem; color: #bbb; margin-top: 6px; }
.hardBox { background: var(--card); border: 1.5px solid var(--gold); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.hardBox .ttl { font-weight: 700; font-size: 0.88rem; margin-bottom: 4px; }
.hardBox .desc { font-size: 0.74rem; color: #999; margin-bottom: 14px; line-height: 1.5; }
.hardItem { border-top: 1px solid var(--line); padding: 14px 0; }
.hardItem:first-of-type { border-top: none; }
.hardItem .hqHead { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; }
.hardItem .hqRate { font-size: 0.7rem; font-weight: 700; color: #fff; background: var(--pink-deep); padding: 2px 9px; border-radius: 10px; }
.hardItem .hqStem { font-size: 0.88rem; line-height: 1.7; margin-bottom: 8px; }
.hardItem .hqChoices { font-size: 0.8rem; color: #777; margin-bottom: 8px; line-height: 1.8; }
.hardItem .hqAnswer { font-weight: 700; color: var(--mint-deep); font-size: 0.82rem; margin-bottom: 6px; }
.hardItem .hqExpl { font-size: 0.8rem; line-height: 1.7; padding-top: 8px; border-top: 1px dashed var(--line); color: #555; }
.hardItem .hqExpl b { color: var(--gold-deep); }
.hardItem .hqVideo { display: inline-block; margin-bottom: 8px; font-size: 0.8rem; font-weight: 700; color: var(--pink-deep); text-decoration: none; background: #fbeaee; padding: 5px 12px; border-radius: 10px; }
.resultFoot { display: flex; gap: 10px; margin-top: 10px; }
.resultFoot button { flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; color: var(--dark); }
</style>
</head>
<body>
<div class="wrap">
  <div class="appHeader">
    <h1>일일일모</h1>
    <p>MATHY YURI · DAECHI ACADEMY</p>
  </div>

  <!-- ============ 로그인 ============ -->
  <div id="screen-login">
    <div class="loginCard">
      <h2>일일일모 응시</h2>
      <p class="sub">로그인하고 오늘의 회차를 풀어보세요</p>
      <div class="field">
        <label>이름</label>
        <input id="in-name" type="text" placeholder="이름을 입력하세요" autocomplete="name">
      </div>
      <div class="field">
        <label>학부모 휴대폰 뒷 4자리</label>
        <input id="in-pw" type="password" inputmode="numeric" maxlength="4" placeholder="뒷 4자리">
      </div>
      <button class="loginBtn" id="loginBtn">시작하기</button>
      <div class="errMsg" id="loginMsg"></div>
    </div>
  </div>

  <!-- ============ 회차 선택 ============ -->
  <div id="screen-rounds" class="hidden">
    <div class="userBar">
      <div class="who"><span id="whoText">-</span><small id="whoClass"></small></div>
      <button id="logoutBtn">로그아웃</button>
    </div>
    <div class="rankLinkRow"><a href="dailyquizranking.html">🏆 랭킹 보러가기 →</a></div>
    <div class="roundGrid" id="roundGrid"></div>
    <p class="legendNote">잠긴 회차는 아직 준비 중이에요.<br>초록 테두리는 이미 응시를 마친 회차예요.</p>
  </div>

  <!-- ============ 응시 화면 ============ -->
  <div id="screen-quiz" class="hidden">
    <div class="quizTop">
      <div class="progressRow"><span id="quizRoundLabel">1회차</span><span><b id="quizIdx">1</b> / <span id="quizTotal">15</span></span></div>
      <div class="progressBar"><div id="quizProgressBar" style="width:6.6%"></div></div>
      <button type="button" class="roundPdfBtn hidden" id="roundPdfBtn">📄 이 회차 PDF로 한번에 풀기</button>
    </div>
    <div class="qCard">
      <div class="qStem" id="qStem"></div>
      <div class="choiceList" id="qChoices"></div>
      <div class="metaLabel">이 문제, 어느 정도 확신하나요?</div>
      <div class="metaRow" id="qMeta">
        <button class="metaBtn" data-m="확실" type="button">확실</button>
        <button class="metaBtn" data-m="애매" type="button">애매</button>
        <button class="metaBtn" data-m="모름" type="button">모름</button>
      </div>
      <button class="wbSolveBtn" id="wbSolveBtn" type="button">✍️ 풀어서 제출 (필기)</button>
    </div>
    <div class="quizNav">
      <button class="navBtn prevBtn" id="prevBtn" type="button">이전</button>
      <button class="navBtn nextBtn" id="nextBtn" type="button" disabled>다음</button>
    </div>
    <p class="hintMsg" id="quizHint">보기와 확신 정도를 골라주세요 ("모름"을 고르면 보기는 안 골라도 돼요)</p>
  </div>

  <!-- ============ 정오표/결과 ============ -->
  <div id="screen-result" class="hidden">
    <div class="scoreCard">
      <div class="label" id="resultRoundLabel">1회차 결과</div>
      <div class="score" id="resultScore">0점</div>
      <div class="sub" id="resultSub">15문제 중 0개 정답</div>
    </div>
    <div class="resultGrid" id="resultGrid"></div>
    <div id="retryBoxWrap"></div>
    <div id="hardQuestionsWrap"></div>
    <div class="resultFoot">
      <button id="backToRoundsBtn" type="button">회차 목록으로</button>
      <button id="viewRankBtn" type="button">랭킹 보기</button>
    </div>
  </div>
</div>

<!-- ============ 필기 풀이 제출 모달 (whiteboard.html) ============ -->
<div class="docModal" id="docModal">
  <div class="docModalBar"><span id="docModalTitle"></span><button type="button" id="docModalClose">← 돌아가기</button></div>
  <iframe id="docModalFrame"></iframe>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbynxupIBGMhIb6knPPTzCgQ3No_nId6YdjoKsvoFGZAEk4HkVztI0a6Wto5UfUww8e1/exec';

// 회차(1~30) ↔ 그 회차 문제의 출처 학교 — dailyquizranking.html과 동일한
// 목록(계산엔 안 쓰이는 표시용이라 시트로 안 빼고 각 파일에 그대로 둠).
const ROUND_SCHOOLS = [
  '', '수원여고', '부천북고', '광휘고', '보라고', '동패고', '능동고', '안곡고', '고양동산고', '도래울고', '백운고',
  '고림고', '광덕고', '상일고', '성포고', '화정고', '덕산고', '저동고', '소명여고', '소래고', '풍무고',
  '광명고', '중산고', '부명고', '권선고', '송림고', '구리고', '화수고', '서현고', '수택고', '과전외고',
];
const LOGIN_KEY = 'dailyQuizLoginCreds';

let me = null; // {name, pw}
let activeRounds = [];      // [1,2,3,...]
let doneRounds = new Set(); // 완료(전부 채점 완료) 회차
let currentRound = null;
let questions = [];         // [{num,difficulty,points,stemHtml,choices}]
let qIndex = 0;
let answers = {};           // num -> {choice, meta}
let submitCount = 0;        // 이 회차에서 몇 번째 제출인지(1차, 2차...)
let lastResult = null;      // dailyquizresult 응답

function $(id) { return document.getElementById(id); }
function show(id) {
  ['screen-login', 'screen-rounds', 'screen-quiz', 'screen-result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}
function renderMath(el) {
  if (window.renderMathInElement) {
    try { renderMathInElement(el, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
  }
}

/* ---------- API ---------- */
async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(GAS_URL + '?' + qs);
  return res.json();
}
async function apiPost(body) {
  await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
}

/* ---------- 필기 풀이 제출 (whiteboard.html 연동) ----------
   객관식 채점(자동)과는 별개 — 학생이 실제로 풀이 과정을 손으로 써서
   제출하면 기존 "숙제 채점 대기" 화면(studentnote.html)에 그대로 같이
   뜨도록, submithw가 이미 쓰는 category/mission 체계를 그대로 재사용한다
   (원장님 요청: 새 화면 만들지 말고 기존 채점 대기 화면 재사용). 점수에는
   전혀 영향 없는 참고용 첨부일 뿐이다. */
function deterministicSessionId(str) {
  let h1 = 0, h2 = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = (h1 * 31 + c) >>> 0;
    h2 = (h2 * 131 + c) >>> 0;
  }
  return 'dq-' + h1.toString(36).padStart(7, '0') + h2.toString(36).padStart(7, '0');
}
// 문제 지문+선택지를 화면 밖에 잠깐 그려서 이미지로 캡처한다 — 필기
// 화면에 백지가 아니라 실제 문제가 보여야(원장님 요청) 그 위에 풀이를
// 쓸 수 있으므로, whiteboard.html이 이미 지원하는 "이미지 문서 위에
// 필기"(docId+docType=image) 방식에 얹기 위해 문제를 이미지로 만든다.
async function buildQuestionSnapshotBase64(num) {
  const q = questions.find(x => x.num === num);
  if (!q) return null;
  // 필기 가능한 흰 캔버스는 이 이미지의 실제 픽셀 크기 그대로 만들어지므로
  // (whiteboard.html의 loadDoc이 img.naturalWidth/Height로 캔버스를 잡음),
  // 문제 내용만큼만 만들면 문제 아래로는 필기가 안 되는 좁은 캔버스가
  // 된다(원장님 리포트 — 화면 대부분이 필기 안 되는 여백으로 남음). 문제
  // 밑에 풀이 쓸 여백을 넉넉히 남겨서 캔버스 자체를 세로로 길게 만든다.
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed; left:-9999px; top:0; width:640px; min-height:1700px; background:#fff; padding:28px; font-family:"Noto Serif KR",serif; font-size:19px; line-height:1.85; color:#1a1a1a; box-sizing:border-box;';
  const choicesHtml = q.choices.map((c, i) => `<div style="margin-top:10px;">${i + 1}) ${c}</div>`).join('');
  box.innerHTML = `<div style="font-weight:700; font-size:15px; color:#a8853f; margin-bottom:16px;">${currentRound}회차 ${num}번</div><div>${q.stemHtml}</div><div style="margin-top:20px;">${choicesHtml}</div><div style="margin-top:36px; padding-top:14px; border-top:1.5px dashed #ddd; font-size:13px; color:#bbb;">✏️ 여기부터 풀이를 적어보세요</div>`;
  document.body.appendChild(box);
  renderMath(box);
  await new Promise(r => setTimeout(r, 250)); // KaTeX가 다 그릴 때까지 잠깐 대기
  let base64 = null;
  try {
    const canvas = await html2canvas(box, { scale: 2, backgroundColor: '#ffffff' });
    base64 = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
  } catch (e) { /* 캡처 실패해도 백지 필기로라도 열리게 아래서 그냥 넘어감 */ }
  document.body.removeChild(box);
  return base64;
}
async function openWhiteboardModal(round, num) {
  const mission = round + '회차 ' + num + '번';
  const category = '일일일모';
  const sessionId = deterministicSessionId(me.name + '|' + category + '|' + mission);
  $('docModal').classList.add('open');
  $('docModalFrame').src = 'about:blank';
  $('docModalTitle').textContent = mission + ' 풀이 — 준비 중...';

  let docId = '', docType = '';
  try {
    const base64 = await buildQuestionSnapshotBase64(num);
    if (base64) {
      const res = await fetch(GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'uploaddoc', data: base64, mime: 'image/jpeg', name: mission }),
      });
      const json = await res.json();
      if (json.ok) { docId = json.result.id; docType = 'image'; }
    }
  } catch (e) { /* 실패해도 백지 필기로라도 열리게 그냥 진행 */ }

  const p = new URLSearchParams({
    session: sessionId, role: 'student', name: me.name, class: me.class, cohort: me.cohort,
    category, mission, submit: '1',
  });
  if (docId) { p.set('docId', docId); p.set('docType', docType); }
  $('docModalFrame').src = 'whiteboard.html?' + p.toString();
  $('docModalTitle').textContent = mission + ' 풀이';
}
function closeDocModal() {
  $('docModal').classList.remove('open');
  $('docModalFrame').src = 'about:blank';
}
$('docModalClose').addEventListener('click', closeDocModal);

// 회차 전체가 담긴 PDF가 원장님이 미리 연결해둔 게 있으면(admin.html
// "회차별 PDF 원본 연결"), 문제마다 새로 캡처하지 않고 그 PDF 위에서
// 15문제를 한 번에 필기할 수 있는 버튼을 보여준다 — 객관식 채점(점수)과는
// 완전히 별개, 참고용 필기 첨부일 뿐이다.
async function checkRoundPdf(round) {
  const btn = $('roundPdfBtn');
  btn.classList.add('hidden');
  try {
    const json = await apiGet({ action: 'assigneddoc', cohort: me.cohort, category: '일일일모', mission: round + '회차' });
    if (json.docId) {
      btn.classList.remove('hidden');
      btn.onclick = () => openRoundPdfWhiteboard(round, json.docId, json.docType || 'pdf');
    }
  } catch (e) { /* 연결된 PDF가 없거나 조회 실패 — 버튼 그냥 숨김 유지 */ }
}
function openRoundPdfWhiteboard(round, docId, docType) {
  const mission = round + '회차';
  const category = '일일일모';
  const sessionId = deterministicSessionId(me.name + '|' + category + '|' + mission);
  const p = new URLSearchParams({
    session: sessionId, role: 'student', name: me.name, class: me.class, cohort: me.cohort,
    category, mission, submit: '1', docId, docType,
  });
  $('docModalFrame').src = 'whiteboard.html?' + p.toString();
  $('docModalTitle').textContent = mission + ' PDF 풀이';
  $('docModal').classList.add('open');
}

/* ---------- 로그인 ---------- */
async function doLogin(silent) {
  const name = silent ? me.name : $('in-name').value.trim();
  const pw = silent ? me.pw : $('in-pw').value.trim();
  const msg = $('loginMsg');
  if (!silent) {
    msg.textContent = '';
    if (!name || pw.length !== 4) { msg.textContent = '이름과 학부모 휴대폰 뒷 4자리를 입력해주세요.'; return; }
    $('loginBtn').disabled = true;
    $('loginBtn').textContent = '확인 중...';
  }
  try {
    const json = await apiGet({ action: 'login', name, pw });
    if (!json.ok) {
      if (silent) { sessionStorage.removeItem(LOGIN_KEY); }
      else { msg.textContent = json.error || '이름 또는 학부모 휴대폰 번호가 일치하지 않습니다.'; }
      return false;
    }
    me = { name, pw, class: (json.student && json.student.class) || '', cohort: (json.student && json.student.cohort) || '2' };
    sessionStorage.setItem(LOGIN_KEY, JSON.stringify({ name, pw }));
    $('whoText').textContent = me.name;
    $('whoClass').textContent = me.class ? me.class + '반' : '';
    await enterRoundsScreen();
    return true;
  } catch (e) {
    if (!silent) msg.textContent = '서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
    return false;
  } finally {
    if (!silent) { $('loginBtn').disabled = false; $('loginBtn').textContent = '시작하기'; }
  }
}
$('loginBtn').addEventListener('click', () => doLogin(false));
$('in-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(false); });
$('logoutBtn').addEventListener('click', () => {
  me = null;
  sessionStorage.removeItem(LOGIN_KEY);
  $('in-name').value = ''; $('in-pw').value = ''; $('loginMsg').textContent = '';
  show('screen-login');
});

/* ---------- 회차 선택 ---------- */
let myStatusByRound = {}; // round -> {total, done, nextAttempt, ...} (dailyquizmystatus 결과)
async function enterRoundsScreen() {
  show('screen-rounds');
  const grid = $('roundGrid');
  grid.innerHTML = '<p class="hintMsg">불러오는 중...</p>';
  try {
    const json = await apiGet({ action: 'dailyquizactiverounds' });
    activeRounds = json.rounds || [];
  } catch (e) { activeRounds = []; }
  try {
    const statusJson = await apiGet({ action: 'dailyquizmystatus', name: me.name });
    myStatusByRound = {};
    (statusJson.rounds || []).forEach(s => { myStatusByRound[s.round] = s; });
  } catch (e) { myStatusByRound = {}; }
  grid.innerHTML = '';
  for (let r = 1; r <= 30; r++) {
    const active = activeRounds.includes(r);
    const status = myStatusByRound[r];
    const btn = document.createElement('button');
    btn.type = 'button';
    let cls = 'roundBtn';
    let inner = `<span class="n">${r}</span><span class="lbl">${active ? '회차' : '잠김'}</span>`;
    if (!active) {
      cls += ' locked';
    } else if (status) {
      cls += ' hasStatus';
      if (status.done) {
        cls += ' rbDone';
        inner = `<span class="n">${r}</span><span class="rbScore">${status.total}점</span>`;
      } else {
        cls += status.nextAttempt === 3 ? ' rbAttempt3' : ' rbAttempt2';
        inner = `<span class="n">${r}</span><span class="rbScore">${status.total}점</span><span class="rbTag">${status.nextAttempt}차</span>`;
      }
    }
    btn.className = cls;
    btn.innerHTML = inner;
    if (active) btn.addEventListener('click', () => openRound(r, !!status));
    grid.appendChild(btn);
  }
}

/* ---------- 응시 화면 ---------- */
// resume: 이미 한 번 이상 제출한 회차를 다시 눌렀을 때 — 처음부터 다시
// 풀게 하지 않고 곧장 정오표/재도전 화면으로 보낸다(원장님 요청: 회차
// 목록에서 점수·시도차수 보고 바로 이어서 재도전할 수 있게).
async function openRound(round, resume) {
  currentRound = round;
  qIndex = 0;
  answers = {};
  // 다음 제출을 눌렀을 때 "N회 제출하시겠습니까?" 안내가 이어서 맞게
  // 나오도록, 이미 진행된 시도 차수를 서버 상태에서 이어받는다.
  const status = myStatusByRound[round];
  submitCount = (resume && status && status.nextAttempt) ? status.nextAttempt - 1 : 0;
  show('screen-quiz');
  $('qStem').innerHTML = '문제를 불러오는 중...';
  $('qChoices').innerHTML = '';
  checkRoundPdf(round);
  try {
    const json = await apiGet({ action: 'dailyquizquestions', round });
    questions = (json.questions || []).sort((a, b) => a.num - b.num);
    if (!questions.length) {
      $('qStem').innerHTML = '아직 이 회차 문제가 준비되지 않았어요.';
      return;
    }
    if (resume) { await showResults(); return; }
    renderQuestion();
  } catch (e) {
    $('qStem').innerHTML = '문제를 불러오지 못했어요. 다시 시도해주세요.';
  }
}

function currentQ() { return questions[qIndex]; }

function renderQuestion() {
  const q = currentQ();
  if (!q) return;
  $('quizRoundLabel').textContent = currentRound + '회차';
  $('quizIdx').textContent = qIndex + 1;
  $('quizTotal').textContent = questions.length;
  $('quizProgressBar').style.width = Math.round(((qIndex + 1) / questions.length) * 100) + '%';
  $('qStem').innerHTML = q.stemHtml;
  const a = answers[q.num] || {};
  $('qChoices').innerHTML = q.choices.map((c, i) => `
    <button type="button" class="choiceBtn${a.choice === i + 1 ? ' picked' : ''}" data-i="${i + 1}">
      <span class="num">${i + 1}</span><span>${c}</span>
    </button>`).join('');
  $('qChoices').querySelectorAll('.choiceBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.i);
      const cur = answers[q.num] || {};
      cur.choice = cur.choice === i ? null : i;
      answers[q.num] = cur;
      renderQuestion();
    });
  });
  $('qMeta').querySelectorAll('.metaBtn').forEach(btn => {
    btn.classList.toggle('picked', a.meta === btn.dataset.m);
    btn.onclick = () => {
      const cur = answers[q.num] || {};
      cur.meta = cur.meta === btn.dataset.m ? null : btn.dataset.m;
      answers[q.num] = cur;
      renderQuestion();
    };
  });
  renderMath($('qStem'));
  renderMath($('qChoices'));
  $('wbSolveBtn').onclick = () => openWhiteboardModal(currentRound, q.num);

  $('prevBtn').style.visibility = qIndex === 0 ? 'hidden' : 'visible';
  const valid = canAdvance(q.num);
  $('nextBtn').disabled = !valid;
  $('nextBtn').textContent = qIndex === questions.length - 1 ? '제출' : '다음';
  $('quizHint').textContent = a.meta === '모름'
    ? '확인 완료 — "모름"으로 표시돼요.'
    : '보기와 확신 정도를 골라주세요 ("모름"을 고르면 보기는 안 골라도 돼요)';
}

function canAdvance(num) {
  const a = answers[num];
  if (!a || !a.meta) return false;
  if (a.meta === '모름') return true;
  return a.choice != null;
}

$('prevBtn').addEventListener('click', () => { if (qIndex > 0) { qIndex--; renderQuestion(); } });
$('nextBtn').addEventListener('click', () => {
  const q = currentQ();
  if (!canAdvance(q.num)) return;
  if (qIndex < questions.length - 1) { qIndex++; renderQuestion(); }
  else submitAll();
});

async function submitAll() {
  submitCount++;
  if (!confirm(`${submitCount}회 제출하시겠습니까?`)) { submitCount--; return; }
  const payload = questions.map(q => {
    const a = answers[q.num] || {};
    return { num: q.num, choice: a.choice || 0, meta: a.meta || '' };
  });
  $('nextBtn').disabled = true;
  $('nextBtn').textContent = '제출 중...';
  await apiPost({ action: 'dailyquizsubmit', name: me.name, round: currentRound, answers: payload });
  await new Promise(r => setTimeout(r, 1200));
  await showResults();
}

/* ---------- 정오표/결과 ---------- */
async function showResults() {
  show('screen-result');
  $('resultGrid').innerHTML = '<p class="hintMsg">채점 중...</p>';
  $('retryBoxWrap').innerHTML = '';
  try {
    const json = await apiGet({ action: 'dailyquizresult', name: me.name, round: currentRound });
    lastResult = json;
    renderResults();
  } catch (e) {
    $('resultGrid').innerHTML = '<p class="hintMsg">결과를 불러오지 못했어요.</p>';
  }
}

function renderResults() {
  const items = lastResult.items || [];
  const correctCount = items.filter(it => it.correct).length;
  $('resultRoundLabel').textContent = currentRound + '회차 결과';
  $('resultScore').textContent = lastResult.total + '점';
  $('resultSub').textContent = `${items.length}문제 중 ${correctCount}개 정답`;

  $('resultGrid').innerHTML = items.map(it => `
    <div class="resultCell ${it.correct ? 'ok' : 'no'}">
      <span>${it.num}</span>
      <span>${it.correct ? 'O' : (it.attempted ? 'X' : '−')}</span>
      <span class="pts">${it.earned}점</span>
    </div>`).join('');

  renderHardQuestions(); // 재도전 여부와 무관하게(정답 공개된 회차면) 항상 시도

  const retryable = items.filter(it => it.canRetry);
  const wrap = $('retryBoxWrap');
  if (!retryable.length) {
    wrap.innerHTML = '';
    return;
  }
  const box = document.createElement('div');
  box.className = 'retryBox';
  box.innerHTML = `
    <div class="ttl">✏️ 오답 다시 풀기</div>
    <div class="desc">틀린 문제를 다시 골라서 제출하면 절반 점수를 받을 수 있어요.</div>
    <div id="retryList"></div>
    <button class="submitRetryBtn" id="submitRetryBtn" type="button" disabled>다시 제출하기</button>
  `;
  wrap.innerHTML = '';
  wrap.appendChild(box);

  const retryAnswers = {}; // num -> choice
  const listEl = box.querySelector('#retryList');
  retryable.forEach(it => {
    const q = questions.find(x => x.num === it.num);
    if (!q) return;
    const row = document.createElement('div');
    row.className = 'retryItem';
    row.innerHTML = `
      <div class="qn">${it.num}번 <button type="button" class="retryWbBtn">✍️ 풀어서 제출</button></div>
      <div class="retryChoices">${q.choices.map((c, i) => `<button type="button" class="retryChoiceBtn" data-i="${i + 1}">${i + 1}</button>`).join('')}</div>
    `;
    row.querySelector('.retryWbBtn').addEventListener('click', () => openWhiteboardModal(currentRound, it.num));
    row.querySelectorAll('.retryChoiceBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.i);
        retryAnswers[it.num] = retryAnswers[it.num] === i ? null : i;
        row.querySelectorAll('.retryChoiceBtn').forEach(b => b.classList.toggle('picked', Number(b.dataset.i) === retryAnswers[it.num]));
        submitBtn.disabled = Object.values(retryAnswers).every(v => !v);
      });
    });
    listEl.appendChild(row);
  });
  const submitBtn = box.querySelector('#submitRetryBtn');
  submitBtn.addEventListener('click', async () => {
    const payload = Object.keys(retryAnswers).filter(n => retryAnswers[n]).map(n => ({ num: Number(n), choice: retryAnswers[n], meta: '' }));
    if (!payload.length) return;
    submitCount++;
    if (!confirm(`${submitCount}회 제출하시겠습니까?`)) { submitCount--; return; }
    submitBtn.disabled = true;
    submitBtn.textContent = '제출 중...';
    await apiPost({ action: 'dailyquizsubmit', name: me.name, round: currentRound, answers: payload });
    await new Promise(r => setTimeout(r, 1200));
    await showResults();
  });
}

// 이 회차에서 오답률이 높았던 문제 top3 + 빠른정답/해설 — 정답이 공개된
// 회차에서만 서버가 실제로 내려준다(dailyquizhardquestions가 자체적으로
// 게이트를 검사함), 공개 전 회차는 items가 빈 배열로 와서 자연히 아무것도
// 안 보인다.
async function renderHardQuestions() {
  const wrap = $('hardQuestionsWrap');
  if (!lastResult.revealed) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<p class="hintMsg">많이 틀린 문제를 불러오는 중...</p>';
  try {
    const json = await apiGet({ action: 'dailyquizhardquestions', round: currentRound, topN: 3 });
    const items = json.items || [];
    if (!items.length) { wrap.innerHTML = ''; return; }
    const box = document.createElement('div');
    box.className = 'hardBox';
    const school = ROUND_SCHOOLS[currentRound];
    box.innerHTML = `
      <div class="ttl">🔥 이 회차에서 많이 틀린 문제${school ? ` <small style="font-weight:400;color:#aaa">(${school} 기출)</small>` : ''}</div>
      <div class="desc">다른 친구들도 많이 틀린 문제예요 — 정답과 해설을 확인해보세요.</div>
      <div id="hardList"></div>
    `;
    wrap.innerHTML = '';
    wrap.appendChild(box);
    const listEl = box.querySelector('#hardList');
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'hardItem';
      const choicesHtml = (it.choices || []).map((c, i) => `${i + 1}) ${c}`).join(' &nbsp; ');
      row.innerHTML = `
        <div class="hqHead"><span>${it.num}번</span><span class="hqRate">정답률 ${it.rate}%</span></div>
        <div class="hqStem">${it.stemHtml || ''}</div>
        <div class="hqChoices">${choicesHtml}</div>
        <div class="hqAnswer">정답: ${it.answer || '−'}</div>
        ${it.video ? `<a class="hqVideo" href="${it.video}" target="_blank" rel="noopener">▶️ 풀이영상 보기</a>` : ''}
        ${it.quickAnswer || it.explanation ? `<div class="hqExpl">${it.quickAnswer ? `<b>빠른정답</b><br>${it.quickAnswer}` : ''}${it.explanation ? `${it.quickAnswer ? '<br><br>' : ''}<b>해설</b><br>${it.explanation}` : ''}</div>` : ''}
      `;
      listEl.appendChild(row);
    });
    renderMath(box);
  } catch (e) {
    wrap.innerHTML = '';
  }
}

$('backToRoundsBtn').addEventListener('click', enterRoundsScreen);
$('viewRankBtn').addEventListener('click', () => { location.href = 'dailyquizranking.html'; });

/* ---------- 자동 로그인 ---------- */
(function init() {
  try {
    const cached = JSON.parse(sessionStorage.getItem(LOGIN_KEY) || 'null');
    if (cached && cached.name && cached.pw) {
      me = cached;
      doLogin(true);
    }
  } catch (e) {}
})();
</script>
