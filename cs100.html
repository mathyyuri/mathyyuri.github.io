<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>추석특강 100제 | MATHY YURI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg: #fdf8f5; --card: #ffffff; --dark: #3a3530; --peach: #e8935f; --peach-deep: #c9683a;
  --line: #f0e2d8; --pink: #e58ba4; --pink-deep: #c64e71; --mint: #8ba8a1; --mint-deep: #5b8a80;
  --shadow: 0 10px 30px rgba(120,70,40,0.08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overflow-x: hidden; }
body { font-family: 'Poppins', 'Noto Serif KR', serif; background: var(--bg); color: var(--dark); margin: 0; padding: 0; min-height: 100vh; }
.wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
.hidden { display: none !important; }

h1 { text-align: center; font-family: 'Noto Serif KR'; font-size: 1.25rem; margin: 0 0 4px; }
.sub { text-align: center; font-size: 0.72rem; color: #a58; letter-spacing: 1px; margin: 0 0 22px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.fieldRow { display: flex; gap: 8px; flex-wrap: wrap; }
.fieldRow input { flex: 1; min-width: 100px; padding: 12px 13px; border-radius: 10px; border: 1px solid #ddd; font-size: 0.95rem; font-family: inherit; }
button { background: var(--peach-deep); color: #fff; border: none; padding: 11px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.86rem; }
button:disabled { background: #ddc; cursor: default; }
button.sec { background: #fff; color: var(--dark); border: 1px solid var(--line); }
.msg { font-size: 0.8rem; margin-top: 8px; min-height: 16px; }
.msg.err { color: var(--pink-deep); }
.msg.ok { color: var(--mint-deep); }

.whoBar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.82rem; }
.whoBar .logoutBtn { background: none; color: #b89; padding: 4px 8px; font-weight: 400; font-size: 0.76rem; text-decoration: underline; }

.dayTabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.dayTab { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; }
.dayTab .d { font-weight: 700; font-size: 0.9rem; }
.dayTab .dt { font-size: 0.64rem; color: #b89; }
.dayTab.active { border-color: var(--peach); background: #fdf0e6; }
.dayTab .prog { font-size: 0.64rem; color: var(--peach-deep); font-weight: 700; margin-top: 2px; }

/* ---------- 문제 풀이(한 문제씩) ---------- */
.quizTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; color: #b89; }
.quizBarWrap { height: 5px; background: #f3e6dc; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.quizBar { height: 100%; background: var(--peach); transition: width .25s; }
.qStem { font-size: 0.98rem; line-height: 1.8; margin-bottom: 16px; }
.qStem img { max-width: 100%; }

.choiceList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.choiceList.imgChoices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choiceBtn { display: flex; align-items: center; gap: 8px; padding: 12px 13px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--dark); cursor: pointer; font-family: inherit; text-align: left; font-size: 0.9rem; }
.choiceList.imgChoices .choiceBtn { flex-direction: column; align-items: flex-start; }
.choiceBtn img { max-width: 100%; max-height: 110px; object-fit: contain; }
.choiceBtn .num { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #999; }
.choiceBtn.picked { border-color: var(--peach); background: #fdf0e6; }
.choiceBtn.picked .num { background: var(--peach); border-color: var(--peach); color: #fff; }

.shortRow input { width: 100%; padding: 13px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 1rem; font-family: inherit; margin-bottom: 4px; }

.metaLabel { font-size: 0.8rem; color: #a58; margin: 16px 0 8px; text-align: center; }
.metaRow { display: flex; gap: 8px; margin-bottom: 6px; }
.metaBtn { flex: 1; padding: 11px 4px; border-radius: 11px; border: 1.5px solid var(--line); background: #fff; font-size: 0.82rem; font-weight: 600; color: #999; cursor: pointer; font-family: inherit; }
.metaBtn[data-m="확실"].picked { background: var(--mint-deep); border-color: var(--mint-deep); color: #fff; }
.metaBtn[data-m="애매"].picked { background: var(--peach); border-color: var(--peach); color: #fff; }
.metaBtn[data-m="모름"].picked { background: var(--pink-deep); border-color: var(--pink-deep); color: #fff; }
.quizHint { text-align: center; font-size: 0.74rem; color: #b89; margin-bottom: 14px; }

.navRow { display: flex; gap: 8px; }
.navRow button { flex: 1; }
#prevBtn { visibility: hidden; }

/* ---------- 결과 화면 ---------- */
.resultHead { text-align: center; margin-bottom: 14px; }
.resultScore { font-family: 'Noto Serif KR'; font-weight: 900; font-size: 2.1rem; color: var(--peach-deep); }
.resultScore small { font-size: 1rem; font-weight: 400; color: #b89; }
.resultSub { font-size: 0.82rem; color: #987; margin-top: 2px; }
.resultGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
.resultCell { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 0.72rem; }
.resultCell.ok { border-color: var(--mint); background: #f3f8f6; }
.resultCell.no { border-color: var(--pink); background: #fdf3f5; }
.resultCell .pts { display: block; color: #a58; font-size: 0.64rem; }

.qCard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.qCard.correct { border-color: var(--mint); background: #f6faf8; }
.qCard.wrong { border-color: var(--pink); background: #fdf5f7; }
.qHead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; flex-wrap: wrap; }
.resultTag { font-size: 0.68rem; font-weight: 700; padding: 2px 9px; border-radius: 9px; }
.resultTag.o { background: #eaf4f0; color: var(--mint-deep); }
.resultTag.x { background: #fbeaee; color: var(--pink-deep); }
.metaTag { font-size: 0.64rem; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: #f3e6dc; color: #a67; }
.attTag { font-size: 0.64rem; color: #bbb; }
.stem { font-size: 0.9rem; line-height: 1.7; margin-bottom: 10px; }
.stem img { max-width: 100%; }
.solBox { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 6px; }
.solBox .ans { font-weight: 700; color: var(--mint-deep); font-size: 0.85rem; margin-bottom: 6px; }
.solBox .expl { font-size: 0.82rem; line-height: 1.75; color: #665; }
.solBox .expl b { color: var(--peach-deep); }
.retryRow { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.retryRow .lbl { font-size: 0.78rem; color: #a58; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌕 추석특강 100제</h1>
  <p class="sub">MATHY YURI · 도형의 방정식 4점 기출 (9/24~9/27, 1일차 25문제 · 100점)</p>

  <div class="card" id="loginCard">
    <div class="fieldRow">
      <input type="text" id="in-name" placeholder="이름" autocomplete="off">
      <input type="password" id="in-pw" placeholder="비밀번호(4자리)" inputmode="numeric" maxlength="4" autocomplete="off">
    </div>
    <button type="button" id="loginBtn" style="width:100%;margin-top:10px">시작하기</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="whoBar">
      <span><b id="whoName"></b>님</span>
      <button type="button" class="logoutBtn" id="logoutBtn">로그아웃</button>
    </div>

    <div id="screen-days">
      <div class="dayTabs" id="dayTabs"></div>
      <p class="msg" id="daysMsg" style="text-align:center"></p>
    </div>

    <div id="screen-quiz" class="hidden">
      <div class="quizTop"><span id="quizDayLabel"></span><span><span id="quizIdx"></span> / <span id="quizTotal"></span></span></div>
      <div class="quizBarWrap"><div class="quizBar" id="quizBar" style="width:0%"></div></div>
      <div class="card">
        <div class="qStem" id="qStem"></div>
        <div id="qBody"></div>
        <div class="metaLabel">이 문제, 어느 정도 확신하나요?</div>
        <div class="metaRow" id="qMeta">
          <button class="metaBtn" data-m="확실" type="button">확실</button>
          <button class="metaBtn" data-m="애매" type="button">애매</button>
          <button class="metaBtn" data-m="모름" type="button">모름</button>
        </div>
        <div class="quizHint" id="quizHint"></div>
        <div class="navRow">
          <button type="button" class="sec" id="prevBtn">이전</button>
          <button type="button" id="nextBtn" disabled>다음</button>
        </div>
      </div>
      <button type="button" class="sec" id="backToDaysBtn" style="width:100%">← 일차 선택으로</button>
    </div>

    <div id="screen-result" class="hidden">
      <div class="resultHead">
        <div class="resultScore" id="resultScore">–</div>
        <div class="resultSub" id="resultSub"></div>
      </div>
      <div class="resultGrid" id="resultGrid"></div>
      <button type="button" class="sec" id="backToDaysBtn2" style="width:100%;margin-bottom:14px">← 일차 선택으로</button>
      <div id="resultList"></div>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbynxupIBGMhIb6knPPTzCgQ3No_nId6YdjoKsvoFGZAEk4HkVztI0a6Wto5UfUww8e1/exec';
const LOGIN_KEY = 'cs100_login_v2';
const DAY_DATES = { 1: '9/24', 2: '9/25', 3: '9/26', 4: '9/27' };
const CIR = ['①', '②', '③', '④', '⑤'];
let me = null; // {name, pw}
let curDay = 1;
let questions = []; // 지금 일차의 25문제(정답 없음)
let dayResultCache = {}; // day -> 마지막으로 받아온 cs100result
let answers = {}; // num -> {answer, meta}  (한 문제씩 풀 때 임시 저장)
let qIndex = 0;
let submitCount = 0;

function $(id) { return document.getElementById(id); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderMath(el) {
  if (window.renderMathInElement) { try { renderMathInElement(el, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {} }
}
function show(id) {
  ['screen-days', 'screen-quiz', 'screen-result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}
async function apiGet(params) {
  const res = await fetch(GAS_URL + '?' + new URLSearchParams(params).toString());
  return res.json();
}
async function apiPost(body) {
  await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
}

async function doLogin(silent) {
  const name = silent ? me.name : $('in-name').value.trim();
  const pw = silent ? me.pw : $('in-pw').value.trim();
  const msg = $('loginMsg');
  if (!name || !pw) { if (!silent) { msg.textContent = '이름과 비밀번호를 입력하세요.'; msg.className = 'msg err'; } return; }
  if (!silent) { msg.textContent = '확인 중...'; msg.className = 'msg'; }
  try {
    const json = await apiGet({ action: 'dailyquizlogin', name, pw });
    if (!json.ok) { msg.textContent = json.error || '로그인 실패'; msg.className = 'msg err'; return; }
    me = { name, pw };
    localStorage.setItem(LOGIN_KEY, JSON.stringify({ name, pw }));
    $('loginCard').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('whoName').textContent = name;
    renderDayTabs();
    show('screen-days');
    refreshAllDayBadges();
  } catch (e) {
    if (!silent) { msg.textContent = '서버 연결 실패: ' + e.message; msg.className = 'msg err'; }
  }
}
$('loginBtn').addEventListener('click', () => doLogin(false));
$('in-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(false); });
$('logoutBtn').addEventListener('click', () => {
  me = null; localStorage.removeItem(LOGIN_KEY);
  $('app').classList.add('hidden'); $('loginCard').classList.remove('hidden');
  $('in-name').value = ''; $('in-pw').value = '';
});
(function tryAutoLogin() {
  try {
    const cached = JSON.parse(localStorage.getItem(LOGIN_KEY) || 'null');
    if (cached && cached.name && cached.pw) { me = cached; doLogin(true); }
  } catch (e) {}
})();

function renderDayTabs() {
  $('dayTabs').innerHTML = [1, 2, 3, 4].map(d => `
    <div class="dayTab" data-day="${d}">
      <div class="d">${d}일차</div>
      <div class="dt">${DAY_DATES[d]}</div>
      <div class="prog" id="dayProg${d}">…</div>
    </div>
  `).join('');
  $('dayTabs').querySelectorAll('.dayTab').forEach(el => el.addEventListener('click', () => openDay(Number(el.dataset.day))));
}
async function refreshAllDayBadges() {
  for (const d of [1, 2, 3, 4]) {
    try {
      const r = await apiGet({ action: 'cs100result', name: me.name, day: d });
      if (r.ok) { dayResultCache[d] = r; updateDayBadge(d); }
    } catch (e) {}
  }
}
function updateDayBadge(day) {
  const r = dayResultCache[day];
  const el = $('dayProg' + day);
  if (!el || !r) return;
  el.textContent = r.items.length ? `${r.items.length}/25 · ${r.total}점` : '시작 전';
}

async function openDay(day) {
  curDay = day;
  $('dayTabs').querySelectorAll('.dayTab').forEach(el => el.classList.toggle('active', Number(el.dataset.day) === day));
  $('daysMsg').textContent = '불러오는 중...'; $('daysMsg').className = 'msg';
  try {
    const [qRes, rRes] = await Promise.all([
      apiGet({ action: 'cs100questions', day }),
      apiGet({ action: 'cs100result', name: me.name, day }),
    ]);
    if (!qRes.ok) throw new Error(qRes.error || '문제를 불러오지 못했습니다.');
    $('daysMsg').textContent = '';
    questions = qRes.items;
    dayResultCache[day] = rRes.ok ? rRes : { ok: true, total: 0, items: [] };
    updateDayBadge(day);
    // 이미 한 문제라도 낸 적이 있으면(재접속 등) 바로 결과 화면으로 — 처음이면 1문제씩 풀이 화면부터.
    if (dayResultCache[day].items.length > 0) renderResultScreen();
    else startQuiz();
  } catch (e) {
    $('daysMsg').textContent = '불러오지 못했습니다: ' + e.message; $('daysMsg').className = 'msg err';
  }
}
$('backToDaysBtn').addEventListener('click', () => show('screen-days'));
$('backToDaysBtn2').addEventListener('click', () => show('screen-days'));

/* ---------- 한 문제씩 풀기 ---------- */
function startQuiz() {
  answers = {}; qIndex = 0;
  show('screen-quiz');
  renderQuestion();
}
function currentQ() { return questions[qIndex]; }
function canAdvance(num) {
  const a = answers[num];
  if (!a || !a.meta) return false;
  if (a.meta === '모름') return true;
  return !!(a.answer && String(a.answer).trim());
}
function renderQuestion() {
  const q = currentQ();
  $('quizDayLabel').textContent = curDay + '일차 · ' + q.num + '번';
  $('quizIdx').textContent = qIndex + 1;
  $('quizTotal').textContent = questions.length;
  $('quizBar').style.width = Math.round(((qIndex + 1) / questions.length) * 100) + '%';
  $('qStem').innerHTML = q.stemHtml;
  const a = answers[q.num] || {};
  const body = $('qBody');
  if (q.type === 'choice') {
    const hasImg = q.choices.some(c => /<img\b/i.test(c));
    body.innerHTML = `<div class="choiceList${hasImg ? ' imgChoices' : ''}">${q.choices.map((c, i) => {
      const content = String(c || '').replace(/^[①②③④⑤]\s*/, '');
      return `<button type="button" class="choiceBtn${a.answer === String(i + 1) ? ' picked' : ''}" data-i="${i + 1}"><span class="num">${i + 1}</span><span>${content}</span></button>`;
    }).join('')}</div>`;
    body.querySelectorAll('.choiceBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = String(btn.dataset.i);
        const cur = answers[q.num] || {};
        cur.answer = cur.answer === i ? '' : i;
        answers[q.num] = cur;
        renderQuestion();
      });
    });
  } else {
    body.innerHTML = `<div class="shortRow"><input type="text" inputmode="decimal" id="shortInput" placeholder="정답(숫자)" value="${escapeHtml(a.answer || '')}"></div>`;
    const inp = $('shortInput');
    inp.addEventListener('input', () => { const cur = answers[q.num] || {}; cur.answer = inp.value; answers[q.num] = cur; updateNav(); });
    setTimeout(() => inp.focus(), 50);
  }
  $('qMeta').querySelectorAll('.metaBtn').forEach(btn => {
    btn.classList.toggle('picked', a.meta === btn.dataset.m);
    btn.onclick = () => {
      const cur = answers[q.num] || {};
      cur.meta = cur.meta === btn.dataset.m ? null : btn.dataset.m;
      answers[q.num] = cur;
      renderQuestion();
    };
  });
  renderMath($('qStem')); renderMath(body);
  $('prevBtn').style.visibility = qIndex === 0 ? 'hidden' : 'visible';
  updateNav();
}
function updateNav() {
  const q = currentQ();
  const valid = canAdvance(q.num);
  $('nextBtn').disabled = !valid;
  $('nextBtn').textContent = qIndex === questions.length - 1 ? '제출' : '다음';
  const a = answers[q.num] || {};
  $('quizHint').textContent = a.meta === '모름' ? '확인 완료 — "모름"으로 표시돼요.' : (q.type === 'choice' ? '보기와 확신 정도를 골라주세요 ("모름"을 고르면 보기는 안 골라도 돼요)' : '답과 확신 정도를 입력해주세요 ("모름"을 고르면 답은 안 써도 돼요)');
}
$('prevBtn').addEventListener('click', () => { if (qIndex > 0) { qIndex--; renderQuestion(); } });
$('nextBtn').addEventListener('click', () => {
  const q = currentQ();
  if (!canAdvance(q.num)) return;
  if (qIndex < questions.length - 1) { qIndex++; renderQuestion(); }
  else submitAll();
});
async function submitAll() {
  submitCount++;
  if (!confirm(`${curDay}일차를 ${submitCount}차시도로 제출하시겠습니까?`)) { submitCount--; return; }
  const payload = questions.map(q => {
    const a = answers[q.num] || {};
    return { num: q.num, answer: a.answer || '', meta: a.meta || '' };
  });
  $('nextBtn').disabled = true; $('nextBtn').textContent = '제출 중...';
  await apiPost({ action: 'cs100submit', name: me.name, day: curDay, answers: payload });
  await new Promise(r => setTimeout(r, 1200));
  await loadResult(curDay);
  renderResultScreen();
}

/* ---------- 결과 화면 ---------- */
async function loadResult(day) {
  const r = await apiGet({ action: 'cs100result', name: me.name, day });
  if (r.ok) { dayResultCache[day] = r; updateDayBadge(day); }
}
function choiceHtmlFor(q, i) {
  const c = String((q.choices || [])[i] || '').replace(/^[①②③④⑤]\s*/, '');
  return `${CIR[i]} ${c}`;
}
function renderResultScreen() {
  show('screen-result');
  const r = dayResultCache[curDay] || { total: 0, maxTotal: 100, items: [] };
  const byNum = {}; r.items.forEach(it => { byNum[it.num] = it; });
  $('resultScore').innerHTML = `${r.total}<small> / ${r.maxTotal || 100}점</small>`;
  const answeredCount = r.items.length, correctCount = r.items.filter(it => it.correct).length;
  $('resultSub').textContent = `${curDay}일차 · ${answeredCount}/${questions.length || 25}문제 확인 · ${correctCount}개 정답`;
  $('resultGrid').innerHTML = questions.length
    ? questions.map(q => {
        const it = byNum[q.num];
        const cls = !it ? '' : (it.correct ? 'ok' : 'no');
        const mark = !it ? '−' : (it.correct ? 'O' : 'X');
        return `<div class="resultCell ${cls}"><span>${q.num}</span><span>${mark}</span><span class="pts">${it ? it.earned : 0}점</span></div>`;
      }).join('')
    : r.items.map(it => `<div class="resultCell ${it.correct ? 'ok' : 'no'}"><span>${it.num}</span><span>${it.correct ? 'O' : 'X'}</span><span class="pts">${it.earned}점</span></div>`).join('');
  $('resultList').innerHTML = r.items.map(it => resultCardHtml(it)).join('');
  renderMath($('resultList'));
  bindResultList();
}
function resultCardHtml(it) {
  const q = questions.find(x => x.num === it.num) || {};
  const metaTag = it.meta ? `<span class="metaTag">${it.meta}</span>` : '';
  const attTag = it.attemptCount > 1 ? `<span class="attTag">${it.attemptCount}차시도</span>` : '';
  const retryHtml = it.canRetry ? `<div class="retryRow" data-num="${it.num}"><div class="lbl">✏️ 다시 풀어보기 (맞히면 ${it.earned === 0 ? Math.round(4 / Math.pow(2, it.attemptCount)) : ''}점 획득 — 점점 줄어들어요)</div>${retryBodyHtml(q, it)}</div>` : '';
  return `<div class="qCard ${it.correct ? 'correct' : 'wrong'}" data-num="${it.num}">
    <div class="qHead"><span>${it.num}번</span><span class="resultTag ${it.correct ? 'o' : 'x'}">${it.correct ? '정답' : '오답'}</span>${metaTag}${attTag}</div>
    <div class="stem">${q.stemHtml || ''}</div>
    <div class="solBox">
      <div class="ans">내 답: ${escapeHtml(it.yourAnswer || '')}${!it.correct ? ` &nbsp;·&nbsp; 정답: ${escapeHtml(it.correctAnswer || '')}` : ''}</div>
      ${it.quickAnswer || it.explanation ? `<div class="expl">${it.quickAnswer ? `<b>빠른정답</b><br>${it.quickAnswer}` : ''}${it.explanation ? `${it.quickAnswer ? '<br><br>' : ''}<b>해설</b><br>${it.explanation}` : ''}</div>` : ''}
    </div>
    ${retryHtml}
  </div>`;
}
function retryBodyHtml(q, it) {
  if (q.type === 'choice') {
    const hasImg = (q.choices || []).some(c => /<img\b/i.test(c));
    return `<div class="choiceList${hasImg ? ' imgChoices' : ''}">${(q.choices || []).map((c, i) => `<button type="button" class="choiceBtn retryChoiceBtn" data-i="${i + 1}"><span class="num">${i + 1}</span><span>${String(c).replace(/^[①②③④⑤]\s*/, '')}</span></button>`).join('')}</div>`;
  }
  return `<div class="shortRow"><input type="text" inputmode="decimal" class="retryInput" placeholder="정답(숫자)"></div><button type="button" class="sec retrySubmitBtn">다시 제출</button>`;
}
function bindResultList() {
  $('resultList').querySelectorAll('.retryRow').forEach(row => {
    const num = Number(row.dataset.num);
    row.querySelectorAll('.retryChoiceBtn').forEach(btn => {
      btn.addEventListener('click', () => submitRetry(num, btn.dataset.i));
    });
    const retryBtn = row.querySelector('.retrySubmitBtn');
    if (retryBtn) retryBtn.addEventListener('click', () => {
      const v = row.querySelector('.retryInput').value.trim();
      if (v) submitRetry(num, v);
    });
    const inp = row.querySelector('.retryInput');
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const v = inp.value.trim(); if (v) submitRetry(num, v); } });
  });
}
async function submitRetry(num, answer) {
  submitCount++;
  if (!confirm(`${curDay}일차 ${num}번을 ${submitCount}차시도로 제출하시겠습니까?`)) { submitCount--; return; }
  await apiPost({ action: 'cs100submit', name: me.name, day: curDay, answers: [{ num, answer, meta: '' }] });
  await new Promise(r => setTimeout(r, 1000));
  await loadResult(curDay);
  renderResultScreen();
}
</script>
</body>
