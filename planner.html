<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연간 플래너 | MATHY YURI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,600&family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@400;700;900&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  color-scheme: light;
  --paper:#FBF8F1; --ink:#1A1A1A; --ink2:#5B574D; --muted:#948C78;
  --gold:#A8853F; --gold-deep:#7A5F25; --gold-soft:rgba(168,133,63,.12); --gold-h:rgba(168,133,63,.14); --gold-t:#F5F0E8; --gold-l:#E6DCC6; --gold-line:#E6DCC6;
  --mint:#7FC8B4; --mint-deep:#3E8F79; --mint-soft:#E4F3EE;
  --pink:#E58BA4; --pink-deep:#C64E71; --pink-soft:#FBE8EE;
  --peri:#7088B5; --sand:#C98F5E;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif; --kserif:'Noto Serif KR',serif; --serif:'Playfair Display','Noto Serif KR',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.55}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}
.topbar{display:flex;align-items:flex-end;gap:14px;padding:20px 18px 14px;max-width:1180px;margin:0 auto;border-bottom:1px solid var(--gold-line);flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:900;letter-spacing:.06em;font-size:22px;line-height:1}
.brand em{font-style:italic;font-weight:600;color:var(--gold)}
.eyebrow-s{font-size:9px;letter-spacing:.38em;font-weight:700;color:var(--gold);margin-bottom:6px}
.sp{flex:1}
h1.page{font-family:var(--serif);font-weight:900;font-size:32px;margin:20px 0 2px}
h1.page em{font-style:italic;font-weight:600;color:var(--mint-deep)}
.lead{color:var(--ink2);font-size:13.5px;margin:0 0 14px;font-family:var(--kserif)}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:3px;padding:9px 16px;font-size:13px;font-weight:700;letter-spacing:.04em}
.btn:hover{background:var(--mint-deep);border-color:var(--mint-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--gold-line)}
.btn.sec:hover{background:var(--gold-soft);border-color:var(--gold)}
.btn.pri{background:linear-gradient(135deg,#d8b96a,#c8a84b 55%,#a8853f);border:none;color:#fff;box-shadow:0 6px 16px rgba(168,133,63,.32)}
.btn.sm{padding:6px 12px;font-size:12.5px}
input[type=text],input[type=month],select,textarea{background:#fff;border:1px solid var(--gold-line);border-radius:3px;padding:7px 9px;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.hint{font-size:12px;color:var(--muted)}
.msg{font-size:13px;margin:6px 0 0}.msg.err{color:var(--pink-deep)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold-line);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--ink2);background:#fff}
.tip{position:fixed;z-index:80}

/* 플랜 도구줄 */
.planbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
.planbar select{min-width:240px;font-weight:700;font-family:var(--kserif)}
.dk-bar{position:sticky;top:0;z-index:40;background:rgba(251,248,241,.97);border-bottom:1px solid var(--gold-line);padding:10px 0 8px;margin:0 0 12px}
.dk-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dk-nav{display:flex;align-items:center;gap:8px}
.dk-nav .navb{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-line);background:#fff;font-size:20px;line-height:1}
.dk-nav .navb:hover{background:var(--ink);color:var(--paper)}
.dk-nav .cnt{font-family:var(--serif);font-weight:700;font-size:15px;min-width:56px;text-align:center}
.lbl{font-size:12px;font-weight:700;color:var(--gold-deep);letter-spacing:.06em}
.dk-sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dk-sel input{width:150px;padding:6px 9px;font-size:13px}
.dk-chips{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 2px}
.pc{min-width:30px;height:26px;border-radius:13px;border:1px solid var(--gold-line);background:#fff;font-size:12px;font-weight:700;color:var(--muted);padding:0 8px}
.pc.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
.pc.cur{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dk-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ratiosel,.bgsel{display:flex;align-items:center;gap:4px}
.rt{border:1px solid var(--gold-line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.rt.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sw{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold-line);box-shadow:inset 0 0 0 2px #fff;padding:0}
.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--gold)}
.saved{font-size:12px;color:var(--mint-deep);margin-left:6px}

/* 무대 */
.stage-host{width:100%}
.stage{--s:1;--pw:794px;--ph:1123px;width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;padding:16px 0 34px;background:linear-gradient(180deg,#F1EBDC,#EDE6D4);border-radius:6px}
.pwrap{width:calc(var(--pw) * var(--s))}
body.zoomed .wrap{max-width:none}
.zoomsel{display:inline-flex;align-items:center;gap:4px}.zoomsel .zl{min-width:3.4em;text-align:center;font-weight:700;font-size:13px}
.pcap{font-size:11px;letter-spacing:.16em;color:var(--gold-deep);margin:0 0 5px 2px;font-weight:700}
.pbox{width:calc(var(--pw) * var(--s));height:calc(var(--ph) * var(--s));position:relative;background:var(--paper);box-shadow:0 8px 30px rgba(70,52,12,.2);overflow:hidden}
.pbox.off{opacity:.38}

/* 페이지 */
.rpage{--fit:1;position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);transform:scale(var(--s,1));transform-origin:0 0;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;padding:34px 42px 24px;font-size:calc(12.5px * var(--fit));line-height:1.5;color:var(--ink);font-family:var(--sans)}
.rp-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--gold-line);flex:0 0 auto}
.rp-brand{font-family:var(--serif);font-weight:900;font-size:1.15em;letter-spacing:.06em}
.rp-brand em{font-style:italic;font-weight:600;color:var(--gold)}
.rp-eye{font-size:.68em;letter-spacing:.34em;font-weight:700;color:var(--gold)}
.rp-body{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:14px 0 8px}
.rp-foot{display:flex;justify-content:space-between;align-items:baseline;padding-top:7px;border-top:1px solid var(--gold-line);font-size:.72em;color:var(--muted);letter-spacing:.06em;flex:0 0 auto}
.rp-foot .pn{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1.15em}
.sec .eb{font-size:.68em;letter-spacing:.34em;font-weight:700;color:var(--gold)}
.sec h2{font-family:var(--kserif);font-weight:900;font-size:1.9em;margin:.1em 0 .05em;line-height:1.2}
.sec h2 em{font-family:var(--serif);font-style:italic;font-weight:600;color:var(--mint-deep);margin-left:.1em}
.sec p{margin:0;color:var(--ink2);font-size:.95em}
.cd{background:#fff;border:1px solid var(--gold-line);border-radius:4px;overflow:hidden}
.cd .ch{font-family:var(--kserif);font-weight:700;font-size:1em;padding:.45em .9em;background:var(--gold-h)}
.cd .cb{padding:.6em .9em}

/* 편집 가능 글자 */
.ed{outline:none;min-height:1.2em;white-space:pre-wrap;word-break:keep-all;border-radius:2px}
.ed:hover{background:rgba(168,133,63,.09)}
.ed:focus{background:#FFFBE8;box-shadow:0 0 0 1.5px rgba(168,133,63,.5)}
.ed:empty:before{content:attr(data-ph);color:#C9BFA5;font-weight:400}
.cap .ed:hover,.cap .ed:focus{background:none;box-shadow:none}
.cap .ed:empty:before{content:''}
.cap .ctl{display:none!important}
.ctl{font-family:var(--sans)}
.xbtn{border:none;background:none;color:var(--muted);font-size:14px;line-height:1;padding:0 4px;opacity:0;transition:.15s}
li:hover>.xbtn,tr:hover .xbtn,.row:hover>.xbtn{opacity:1}
.xbtn:hover{color:var(--pink-deep)}
.addbtn{border:1px dashed var(--gold-line);background:none;color:var(--muted);border-radius:3px;font-size:.85em;padding:.1em .7em;margin-top:.3em}
.addbtn:hover{border-color:var(--gold);color:var(--gold-deep)}
ul.bl{list-style:none;margin:0;padding:0}
ul.bl li{display:flex;align-items:flex-start;gap:.45em;padding:.12em 0}
ul.bl li:before{content:'';flex:0 0 auto;width:.42em;height:.42em;border-radius:50%;background:var(--gold);margin-top:.55em}
ul.bl li .ed{flex:1}

/* 표지 */
.rpage.cover{padding:0}
.rpage.cover .rp-body{padding:0;display:block;overflow:visible}
.cv{position:relative;width:100%;height:100%;padding:56px 60px 46px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cv-frame{position:absolute;left:0;top:0;pointer-events:none}
.cv-frame svg{display:block}
.cv>*{position:relative}
.cv .cv-frame{position:absolute}
.cv-yr{font-family:var(--serif);font-weight:900;font-size:4.4em;line-height:1;letter-spacing:-.01em;margin-top:auto}
.cv-yr em{font-style:italic;font-weight:600;color:var(--mint-deep)}
.cv-plan{font-family:var(--kserif);font-weight:900;font-size:2.3em;line-height:1.25;margin-top:.5em}
.cv-line{font-family:var(--kserif);font-size:1.15em;color:var(--ink2);letter-spacing:.08em;margin-top:.7em}
.cv-rule{width:74px;height:3px;background:var(--gold);margin:1.2em 0}
.cv-tag{font-size:1em;color:var(--ink2);max-width:80%}
.cv-months{display:flex;gap:6px;margin-top:2em;margin-bottom:auto}
.cv-months span{width:2.3em;height:2.3em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:.95em}
.cv-foot{display:flex;justify-content:space-between;width:100%;border-top:1px solid var(--gold-line);padding-top:9px;font-size:.72em;letter-spacing:.14em;color:var(--gold)}

/* 로드맵 */
.rm{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:1px solid var(--gold-line);border-radius:4px;background:#fff;overflow:hidden}
.rm-h{display:grid;grid-template-columns:var(--lw,110px) repeat(var(--n,12),1fr);background:var(--gold-h);font-family:var(--serif);font-weight:700;font-size:.95em;text-align:center}
.rm-h div{padding:.5em 0;border-left:1px solid var(--gold-line)}
.rm-h .yr{display:block;font-family:var(--sans);font-size:.62em;color:var(--gold);letter-spacing:.06em;line-height:1}
.rm-h div:first-child{border-left:none;font-family:var(--kserif);font-size:.85em}
.rm-t{display:grid;grid-template-columns:var(--lw,110px) 1fr;border-top:1px solid var(--gold-line);flex:1 1 0;min-height:0}
.rm-l{display:flex;align-items:center;justify-content:center;text-align:center;padding:.3em .5em;font-family:var(--kserif);font-weight:700;font-size:.9em;background:var(--paper);border-right:1px solid var(--gold-line)}
.rm-g{position:relative;display:grid;grid-template-columns:repeat(var(--n,12),1fr);align-content:stretch;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(100%/var(--n,12) - 1px),var(--gold-line) calc(100%/var(--n,12) - 1px),var(--gold-line) calc(100%/var(--n,12)))}
.rm-b{align-self:center;min-height:3em;margin:3px 2px;border-radius:5px;padding:.2em .5em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:.85em;line-height:1.25;min-width:0;overflow:hidden}

/* 연간 계획표 */
.yg{flex:1 1 auto;min-height:0;display:grid;gap:8px}
.yg.p{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}
.yg.l{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}
.mc{background:#fff;border:1px solid var(--gold-line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.mc-h{display:flex;align-items:baseline;gap:.4em;padding:.35em .7em;background:var(--gold-h)}
.mc-h b{font-family:var(--serif);font-weight:900;font-size:1.5em;line-height:1}
.mc-h small{font-size:.72em;color:var(--muted);letter-spacing:.06em}
.mc-h .mx{margin-left:auto;font-size:.7em}
.mc-b{padding:.4em .7em .5em;flex:1;min-height:0;overflow:hidden}
.mc-th{font-family:var(--kserif);font-weight:700;font-size:1em;line-height:1.3;margin-bottom:.25em}
.mc-goal{margin:.35em 0 0;font-size:.82em;color:var(--mint-deep);font-weight:700;border-top:1px dashed var(--gold-line);padding-top:.3em}
.mc-goal:before{content:'목표 · ';color:var(--muted);font-weight:500}
.cap .mc-goal:empty{display:none}
.mc-ex{margin:.3em 0 0;font-size:.82em;color:var(--pink-deep);font-weight:700}
.mc-ex:before{content:'● ';font-size:.8em}

/* 월간 */
.mh{display:flex;align-items:flex-end;gap:.9em;flex:0 0 auto;border-bottom:2px solid var(--ink);padding-bottom:.4em}
.mh-m{font-family:var(--serif);font-weight:900;font-size:3.3em;line-height:.95}
.mh-m small{font-size:.26em;color:var(--gold);letter-spacing:.14em;display:block;margin-bottom:.2em;font-family:var(--sans);font-weight:700}
.mh-t{flex:1;min-width:0}
.mh-th{font-family:var(--kserif);font-weight:900;font-size:1.5em;line-height:1.25}
.mh-g{font-size:.92em;color:var(--ink2)}
.cap .mh-ex:empty{display:none}
.mh-ex{min-width:6em;text-align:center;font-size:.82em;font-weight:700;color:var(--pink-deep);background:var(--pink-soft);border-radius:20px;padding:.15em .8em;white-space:nowrap}
.mb{flex:1 1 auto;min-height:0;display:grid;gap:12px}
.mb.p{grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr .5fr}
.mb.p .cal,.mb.p .wk{grid-column:1/3}
.mb.l{grid-template-columns:1.5fr 1fr;grid-template-rows:1.1fr .8fr .7fr}
.mb.l .cal{grid-column:1;grid-row:1/4}
.mb.l .wk{grid-column:2;grid-row:1}
.mb.l .sch{grid-column:2;grid-row:2}
.mb.l .memo{grid-column:2;grid-row:3}
.cal{display:flex;flex-direction:column;min-height:0;border:1px solid var(--gold-line);border-radius:4px;background:#fff;overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);background:var(--gold-h);text-align:center;font-size:.8em;font-weight:700}
.cal-h div{padding:.3em 0}.cal-h div:first-child{color:var(--pink-deep)}.cal-h div:last-child{color:var(--peri)}
.cal-g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr)}
.dc{border-top:1px solid #EFE8D6;border-left:1px solid #EFE8D6;padding:.15em .3em .2em;display:flex;flex-direction:column;min-height:0;overflow:hidden;font-size:.82em}
.dc:nth-child(7n+1){border-left:none}
.dc .dn{font-family:var(--serif);font-weight:700;font-size:1.05em;line-height:1.2}
.dc.sun .dn{color:var(--pink-deep)}.dc.sat .dn{color:var(--peri)}
.dc.out{background:#FAF7F0}
.dc .ed{font-size:.9em;line-height:1.3;flex:1;min-height:1em}
.ex-b{font-size:.74em;font-weight:700;border-radius:3px;padding:0 .35em;margin:.08em 0 .1em;line-height:1.4;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb.p.m3{grid-template-columns:1fr 1.6fr 1fr;grid-template-rows:1.4fr 1fr .75fr}
.mb.p.m3 .cal,.mb.p.m3 .wk{grid-column:1/4}
.mb.l.m3 .cal{grid-row:1/5}
.mb.p.m3 .sch{grid-column:1}.mb.p.m3 .midp{grid-column:2}.mb.p.m3 .memo{grid-column:3}
.mb.l.m3{grid-template-rows:1fr .7fr .8fr .5fr}
.mb.l.m3 .midp{grid-column:2;grid-row:3}.mb.l.m3 .memo{grid-column:2;grid-row:4}
.midp .cb{font-size:.78em;line-height:1.5}.midp .ml{padding:.12em 0;border-bottom:1px dashed #EFE8D6}.midp .ml b{color:#5D7A6C}
.cal-lg{display:flex;gap:.9em;padding:.3em .7em;border-top:1px solid #EFE8D6;font-size:.78em;color:var(--ink2)}
.cal-lg i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.35em;vertical-align:-.1em}
.wt.ext{table-layout:fixed;height:auto;flex:none}
.wt.ext th:first-child{width:14%}.wt.ext th:last-child{width:17%}
.wt.ext td:nth-child(n){width:auto}
.wt.ext td{padding:.95em .4em!important}
.wt.ext.dn td{padding:.3em .3em!important;font-size:.8em}
.wt.ext.dn td .ed{min-height:1em}
.wt.ext th{text-align:center}.wt.ext td{text-align:center;padding:.5em .4em;font-size:.95em;vertical-align:middle}
.wt.ext td.sn{font-family:var(--kserif);font-size:1.02em;white-space:nowrap;text-align:left}
.cl .row{display:flex;gap:.6em;align-items:baseline;padding:.15em 0;border-bottom:1px solid #F3ECDA}
.cl .cl-l{width:11em;font-weight:700}.cl .cl-d{flex:1}
.wk{display:flex;flex-direction:column;min-height:0}
.wt{width:100%;flex:1 1 auto;height:100%;border-collapse:collapse;font-size:.95em}
.wt td:nth-child(2){width:50%}.wt td:nth-child(3){width:34%}
.wt th{white-space:nowrap}
.wt th{background:var(--gold-h);padding:.4em .6em;font-size:.82em;letter-spacing:.06em;text-align:left;border-bottom:1.4px solid var(--gold)}
.wt td{border-bottom:1px solid #EFE8D6;padding:.35em .6em;vertical-align:top}
.wt td.wl{width:3.2em;font-family:var(--serif);font-weight:700;white-space:nowrap}
.wt td.ck{width:2em;text-align:center}
.ckb{border:1.5px solid var(--gold);width:1.1em;height:1.1em;border-radius:3px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.9em;color:var(--mint-deep);padding:0;line-height:1}
.ckb.on{background:var(--mint-soft)}
.side{background:#fff;border:1px solid var(--gold-line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.side .ch{font-family:var(--kserif);font-weight:700;padding:.4em .8em;background:var(--gold-h);font-size:.95em}
.side .cb{padding:.5em .8em;flex:1;min-height:0;overflow:hidden}
.side.memo .ed{min-height:5em;height:100%}

/* 서식 도구 · 막대 · 자유 상자 */
.fmt{position:fixed;z-index:90;display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:min(580px,94vw);background:#fff;border:1px solid var(--gold-line);border-radius:8px;box-shadow:0 8px 24px rgba(70,52,12,.25);padding:5px 7px}
.fmt[hidden]{display:none}
.fmt select{padding:3px 5px;font-size:12px}
.fmt .fb{border:1px solid var(--gold-line);background:#fff;border-radius:4px;min-width:26px;height:26px;font-size:12px;font-weight:700;padding:0 6px}
.fmt .fb:hover{background:var(--gold-soft)}

/* ---------------- 학교별 시험 일정 · 달력 ---------------- */
const EXAM_COLS = [['e2', '올해 2학기 기말'], ['m1', '1학기 중간'], ['f1', '1학기 기말'], ['m2', '2학기 중간'], ['f2', '2학기 기말']];
const SCHOOL_COLORS = ['#C64E71', '#3E8F79', '#7088B5', '#A8853F', '#C98F5E', '#7FC8B4'];
const COMMON_COLOR = '#948C78';
const shortSchool = s => String(s).replace(/고등학교$/, '').replace(/고$/, '') || s;
function ensurePlan(p){
  p.exams = p.exams || {}; p.schools = p.schools || []; p.pub = p.pub || {}; p.free = p.free || {}; p.midSchools = p.midSchools || []; p.midExams = p.midExams || {};
  if (p.region === '용인' && !p._midSeed) { p._midSeed = 1; if (!p.midSchools.length) p.midSchools = ['보라중학교', '상갈중학교', '나곡중학교']; }   // 용인 플랜 기본 중학교
  p.trackOrder = (p.trackOrder || []).filter(Boolean); (p.bars || []).forEach(b => { if (!p.trackOrder.includes(b.track)) p.trackOrder.push(b.track); });
  p.common = p.common || [{label: '3월 학력평가', date: ''}, {label: '6월 학력평가', date: ''}, {label: '9월 학력평가', date: ''}, {label: '겨울방학', date: ''}, {label: '여름방학', date: ''}];
  p.months.forEach(m => { m.days = m.days || {}; m.schedule = m.schedule || []; m.weeks = m.weeks || []; });
  return p;
}
/* "4/22~4/26", "4월 22일 ~ 24일", "4/22, 4/24", "4/22~26", "2027.12.10~12.14" 같은 글에서 날짜를 뽑는다.
   pref: 같은 달이 두 번 나오는 긴 플랜(예: 11~12월이 두 번)에서 어느 쪽 해로 볼지 — 'first' | 'last' (글에 연도를 쓰면 그 해로) */
function parseDates(text, p, pref){
  const t = String(text || ''), re = /(?:(20\d{2})\s*[\/.\-년]\s*)?(\d{1,2})\s*(?:[\/.]|월)\s*(\d{1,2})\s*일?/g, found = []; let m;
  while ((m = re.exec(t))) found.push({y: m[1] ? +m[1] : 0, m: +m[2], d: +m[3], i: m.index, end: re.lastIndex});
  const N = p.months.length;
  const yearOf = mm => { let hit = null; for (let i = 0; i < N; i++) { const mi = monthInfo(p, i); if (mi.m === mm) { hit = mi.y; if (pref !== 'last') return hit; } } return hit; };
  const out = [];
  const push = (mm, dd, y) => { const yy = y || yearOf(mm); if (yy && mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) out.push({y: yy, m: mm, d: dd}); };
  for (let k = 0; k < found.length; k++) {
    const a = found[k], b = found[k + 1], rest = t.slice(a.end), ya = a.y || yearOf(a.m);
    const same = rest.match(/^\s*[~\-–—]\s*(\d{1,2})(?!\s*[\/.월\d])/);
    if (same) { for (let d = a.d; d <= Math.min(31, +same[1]); d++) push(a.m, d, ya); continue; }
    if (b && /^\s*[~\-–—]\s*$/.test(t.slice(a.end, b.i))) {
      let yb = b.y || yearOf(b.m); if (ya && yb && yb < ya) yb = ya; if (ya && yb && yb === ya && b.m < a.m) yb = ya + 1;
      if (ya && yb) { const s = new Date(ya, a.m - 1, a.d), e = new Date(yb, b.m - 1, b.d); for (let c = new Date(s), n = 0; c <= e && n < 45; c.setDate(c.getDate() + 1), n++) push(c.getMonth() + 1, c.getDate(), c.getFullYear()); }

    }
    push(a.m, a.d, ya);
  }
  return out;
}
const shortMid = s => String(s).replace(/중학교$/, '').replace(/중$/, '') || s;
function examBadges(p){   // {'y-m': {day: [{text,color}]}}  — 학교가 많으면 "N개교"로 묶어서 보여준다
  const map = {}, many = p.schools.length > 6;
  const put = (y, m, d, text, color, names) => { const k = y + '-' + m; ((map[k] = map[k] || {})[d] = (map[k][d] || [])).push({text, color, names}); };
  if (!many) {
    p.schools.forEach((s, si) => { const ex = p.exams[s] || {}; EXAM_COLS.forEach(([key, label]) => { if (ex[key]) parseDates(ex[key], p, key === 'f2' ? 'last' : 'first').forEach(x => put(x.y, x.m, x.d, `${shortSchool(s)} ${label.replace('1학기 ', '').replace('2학기 ', '')}`, SCHOOL_COLORS[si % SCHOOL_COLORS.length])); }); });
  } else {
    EXAM_COLS.forEach(([key, label]) => {
      const cnt = {};
      p.schools.forEach(s => { const ex = p.exams[s] || {}; if (ex[key]) parseDates(ex[key], p, key === 'f2' ? 'last' : 'first').forEach(x => { const id = `${x.y}-${x.m}-${x.d}`; cnt[id] = (cnt[id] || 0) + 1; }); });
      Object.keys(cnt).forEach(id => { const [y, m, d] = id.split('-').map(Number); put(y, m, d, `고교 ${label} ${cnt[id]}개교`, SCHOOL_COLORS[EXAM_COLS.findIndex(c => c[0] === key) % SCHOOL_COLORS.length]); });
    });
  }
  const mids = p.midSchools || [], cF = {}, cW = {};
  const addN = (o, id, nm) => { (o[id] = o[id] || []).push(nm); };
  mids.forEach(s => { const mx = (p.midExams || {})[s] || {}, nm = shortMid(s);
    if (mx.f2) parseDates(mx.f2, p, 'first').forEach(x => addN(cF, `${x.y}-${x.m}-${x.d}`, nm));
    if (mx.win) { const d = parseDates(mx.win, p, 'first')[0]; if (d) addN(cW, `${d.y}-${d.m}-${d.d}`, nm); } });
  Object.keys(cF).forEach(id => { const [y, m, d] = id.split('-').map(Number); put(y, m, d, `중3 기말 ${cF[id].length}개교`, '#8FA89A', cF[id].join(', ')); });
  Object.keys(cW).forEach(id => { const [y, m, d] = id.split('-').map(Number); put(y, m, d, `중등 겨울방학 ${cW[id].length}개교`, '#7FA8C9', cW[id].join(', ')); });
  p.common.forEach(c => { if (c.date) parseDates(c.date, p, 'first').forEach(x => put(x.y, x.m, x.d, c.label.replace('학력평가', '학평'), COMMON_COLOR)); });
  return map;
}

function calendarBlock(p, i){
  const m = p.months[i], mi = monthInfo(p, i), first = new Date(mi.y, mi.m - 1, 1).getDay(), days = new Date(mi.y, mi.m, 0).getDate();
  const rows = Math.ceil((first + days) / 7), badges = (examBadges(p)[mi.y + '-' + mi.m]) || {};
  const head = H('div', {class: 'cal-h'}, ['일', '월', '화', '수', '목', '금', '토'].map(d => H('div', {text: d})));
  const grid = H('div', {class: 'cal-g', style: `grid-template-rows:repeat(${rows},1fr)`});
  for (let c = 0; c < rows * 7; c++) {
    const day = c - first + 1, wd = c % 7;
    if (day < 1 || day > days) { grid.append(H('div', {class: 'dc out'})); continue; }
    const cell = H('div', {class: 'dc' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '')}, [H('div', {class: 'dn', text: day})]);
    const bl = badges[day] || []; bl.slice(0, 4).forEach(b => cell.append(H('div', {class: 'ex-b', style: `background:${b.color}`, text: b.text, title: b.names || ''}))); if (bl.length > 4) cell.append(H('div', {class: 'ex-b', style: 'background:#948C78', text: `+${bl.length - 4}`}));
    cell.append(ed(m.days, String(day), ''));
    grid.append(cell);
  }
  const legend = H('div', {class: 'cal-lg'}, [...p.schools.map((s, si) => H('span', {}, [H('i', {style: `background:${SCHOOL_COLORS[si % SCHOOL_COLORS.length]}`}), shortSchool(s)])), (p.common.some(c => c.date) ? H('span', {}, [H('i', {style: `background:${COMMON_COLOR}`}), '공통']) : null)]);
  return H('div', {class: 'cal'}, [head, grid, p.schools.length && p.schools.length <= 6 ? legend : null]);
}

    log.push(`${sc.name}${sc.many ? ' (이름이 같은 학교가 여러 곳이라 첫 번째를 골랐어요)' : ''}: ` + (found.length ? found.join(' · ') : '시험 일정이 아직 올라와 있지 않아요'));
    const take = (list, fn) => { const cur = list.filter(e => { const d = ymdDate(e.AA_YMD); return d >= planFrom && d <= planTo; }); return cur.length ? {dates: cur.map(fn), est: false} : {dates: list.filter(e => { const d = ymdDate(e.AA_YMD); return d >= prevFrom && d < planFrom; }).map(fn), est: true}; };
    ev.filter(e => /학력평가/.test(e.EVENT_NM) && !/수능|모의/.test(e.EVENT_NM)).forEach(e => {
      const d = ymdDate(e.AA_YMD), inPlan = d >= planFrom && d <= planTo, shifted = inPlan ? e.AA_YMD : shiftYear(e.AA_YMD, 1), sd = ymdDate(shifted);
      if (sd < planFrom || sd > planTo) return; if (!inPlan && opts.estimate === false) return;
      const label = `${+shifted.slice(4, 6)}월 학력평가`, c = commons.get(label); if (!c || (c.est && inPlan)) commons.set(label, {date: `${+shifted.slice(4, 6)}/${+shifted.slice(6, 8)}`, est: !inPlan, pre: inPlan ? '' : yTag(e.AA_YMD)});
    });
    [['여름방학', e => /방학/.test(e.EVENT_NM) && !/식$/.test(e.EVENT_NM) && /하계|여름|^방학$/.test(e.EVENT_NM) && +e.AA_YMD.slice(4, 6) >= 7 && +e.AA_YMD.slice(4, 6) <= 8],
     ['겨울방학', e => /방학/.test(e.EVENT_NM) && !/식$/.test(e.EVENT_NM) && (/동계|겨울/.test(e.EVENT_NM) || +e.AA_YMD.slice(4, 6) >= 12 || +e.AA_YMD.slice(4, 6) <= 2)]].forEach(([label, test]) => {
      const list = ev.filter(test); if (!list.length) return;
      const t = take(list, e => e.AA_YMD); if (!t.dates.length) return; if (t.est && opts.estimate === false) return;
      if (!commons.has(label) || (commons.get(label).est && !t.est)) commons.set(label, {date: groupRanges(t.dates), est: t.est, pre: t.est ? yTag(t.dates[0]) : ''});
    });
  }
  // 중학교: 이 플랜 첫 달부터 다음 해 2월까지 (2학기 기말 · 겨울방학)
  const mTo = new Date(planFrom.getFullYear() + 1, 2, 0), mPrevFrom = new Date(planFrom.getFullYear() - 1, planFrom.getMonth(), 1), mPrevTo = new Date(planFrom.getFullYear(), 2, 0);
  let midOk = 0, midNone = 0;
  for (const name of p.midSchools) {
    opts.onProg && opts.onProg(++done, total, name);
    const sc = await neisFindSchool(p, name, '중학교');
    if (!sc) { miss.push(name); continue; }
    const ev = await neisSchedule(sc, ymd(mPrevFrom), ymd(mTo), 3);
    const inCur = e => { const d = ymdDate(e.AA_YMD); return d >= planFrom && d <= mTo; };
    const f2 = {cur: [], prev: []}, win = {cur: [], prev: []};
    ev.forEach(e => { const m = +e.AA_YMD.slice(4, 6), side = inCur(e) ? 'cur' : (ymdDate(e.AA_YMD) <= mPrevTo ? 'prev' : null); if (!side) return;
      if (examKeyOf(e.EVENT_NM, m) === 'f2' && m >= 10) f2[side].push(e.AA_YMD);
      else if (/방학/.test(e.EVENT_NM) && !/식$/.test(e.EVENT_NM) && (/동계|겨울/.test(e.EVENT_NM) || m >= 12 || m <= 2)) win[side].push(e.AA_YMD); });
    const mx = (p.midExams[name] = p.midExams[name] || {}); mx._auto = mx._auto || {};
    let got = 0;
    [['f2', f2], ['win', win]].forEach(([k, g]) => {
      let text = '', pre = '';
      if (g.cur.length) text = groupRanges(g.cur, true); else if (g.prev.length && opts.estimate !== false) { text = groupRanges(g.prev, true); pre = yTag(g.prev[0]); }
      if (!text) return; const val = pre + text;
      if (!mx[k] || mx[k] === mx._auto[k]) { mx[k] = val; mx._auto[k] = val; got++; }
    });
    got ? midOk++ : midNone++;
  }
  commons.forEach((v, label) => {
    const val = (v.pre || '') + v.date;
    let it = p.common.find(c => c.label === label && (!c.date || c.auto)); if (!it) { it = {label, date: ''}; p.common.push(it); }
    if (!it.date || it.auto) { it.date = val; it.auto = true; }
  });
  p.neisAt = Date.now(); save(true);
  const hs = p.schools.filter(s => { const ex = p.exams[s] || {}; return EXAM_COLS.some(([k]) => ex[k]); }).length;
  if (p.schools.length > 6) log.splice(0, log.length, `고등학교 ${p.schools.length}개교 중 ${hs}개교의 시험 일정을 채웠어요. (나머지는 아직 학교가 나이스에 올리지 않았어요)`);
  if (p.midSchools.length) log.push(`중학교 ${p.midSchools.length}개교 중 ${midOk}개교의 기말·겨울방학 일정을 채웠어요${midNone ? ` (${midNone}개교는 아직 없음)` : ''}.`);
  if (miss.length) log.push(`나이스에서 못 찾은 학교: ${miss.join(', ')}`);
  log.push(`공통 일정: ${[...commons.entries()].map(([l, v]) => `${l} ${v.pre || ''}${v.date}`).join(' · ') || '불러온 것이 없어요'}`);
  return log;
}

async function autoNeis(){
  const p = cur(); if (!p || !neisKey() || !p.schools || !p.schools.length) return;
  if (p.neisAt && Date.now() - p.neisAt < 864e5) return;
  try { await runNeis(p, {estimate: true}); render(true); const m = $('#savedMsg'); if (m) m.textContent = '학사일정 자동 갱신됨'; } catch(e){}
}

/* ---------------- 사이트에 공개하기 (Supabase) ---------------- */
const SB = 'https://eqllmvfbcdtzercliicy.supabase.co/rest/v1/', SBK = 'sb_publishable_OcoOR7ERpt8BFBLuQ2CoWw_lELDDCEV';   // 읽기 전용 공개 키
async function sbRpc(fn, body){
  const r = await fetch(SB + 'rpc/' + fn, {method: 'POST', headers: {apikey: SBK, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (r.ok) return;
  const t = await r.text();
  if (/forbidden/.test(t)) throw new Error('공개 비밀번호가 맞지 않아요.');
  if (/PGRST202|Could not find the function/.test(t)) throw new Error('공개용 저장소가 아직 없어요. Supabase에서 안내드린 SQL을 한 번 실행해 주세요.');
  throw new Error(`저장 실패 (${r.status}) ${t.slice(0, 120)}`);
}
async function sbSelect(q){ const r = await fetch(SB + q, {headers: {apikey: SBK}}); if (!r.ok) throw new Error('읽기 실패 ' + r.status); return r.json(); }
let PUBLISHED = {};   // planId → Set(page_key)
async function loadPublished(){
  const p = cur(); if (!p) return;
  try { PUBLISHED[p.id] = new Set((await sbSelect(`planner_pages?plan_id=eq.${encodeURIComponent(p.id)}&select=page_key`)).map(x => x.page_key)); } catch(e){ return; }
  D.pages.forEach(pg => { const l = pg.box.querySelector('.pub-on'); if (l) l.hidden = !PUBLISHED[p.id].has(pg.key); });
}
async function publishSite(btn){
  const p = cur(), keys = D.pages.filter(pg => p.pub && p.pub[pg.key]);
  let existing = [];
  try { existing = (await sbSelect(`planner_pages?plan_id=eq.${encodeURIComponent(p.id)}&select=page_key`)).map(x => x.page_key); } catch(e){}
  if (!keys.length && !existing.length) { dkMsg('공개할 페이지가 없어요. 각 페이지 위쪽의 "공개" 칸을 체크해 주세요.', true); return; }
  if (!keys.length && !confirm('체크된 페이지가 없어서, 사이트에 올라가 있는 이 플랜의 페이지를 모두 내려요. 계속할까요?')) return;
  let pw = safeLS.get('pl_teacher_key') || prompt('공개 비밀번호(원장님 키)를 입력하세요'); if (!pw) return;
  const orig = btn.textContent; btn.disabled = true;
  try {
    const plan = {id: p.id, name: p.name, region: p.region, meta: {w: PW, h: PH, grade: p.grade, period: periodText(p), schools: p.schools, updated: new Date().toISOString().slice(0, 10)}};
    for (let k = 0; k < keys.length; k++) {
      btn.textContent = `올리는 중... (${k + 1}/${keys.length})`;
      const c = await capturePage(keys[k], 1.5);
      await sbRpc('planner_publish_page', {p_key: pw, p_plan: plan, p_page: {key: keys[k].key, title: keys[k].title, idx: keys[k].idx, image: c.toDataURL('image/jpeg', 0.85)}});
    }
    const drop = existing.filter(k => !keys.some(pg => pg.key === k));
    if (drop.length) await sbRpc('planner_unpublish', {p_key: pw, p_plan: p.id, p_keys: drop});
    safeLS.set('pl_teacher_key', pw); await loadPublished();
    dkMsg(`${keys.length}페이지를 사이트에 올렸어요${drop.length ? ` · ${drop.length}페이지는 내렸어요` : ''}. mathyyuri.com/planner-view.html 에서 확인하세요.`);
  } catch(e){ if (/비밀번호/.test(e.message)) safeLS.set('pl_teacher_key', ''); dkMsg('공개 실패: ' + (e.message || e), true); }
  finally { btn.disabled = false; btn.textContent = orig; }
}
