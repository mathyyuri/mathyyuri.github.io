# Supabase 무료 프로젝트가 7일 이상 활동이 없어 자동 일시 중지되는 것을 막기 위해
# 3일에 한 번 문제은행 함수를 가볍게 호출합니다. (키는 bank.html에 이미 공개된 읽기용 키입니다)
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase
        run: |
          KEY='sb_publishable_OcoOR7ERpt8BFBLuQ2CoWw_lELDDCEV'
          BASE='https://eqllmvfbcdtzercliicy.supabase.co'
          curl -sS -m 30 -o /dev/null -w "functions: %{http_code}\n" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$BASE/functions/v1/get-problems?summary=1"
          curl -sS -m 30 -o /dev/null -w "rest: %{http_code}\n" -H "apikey: $KEY" "$BASE/rest/v1/"
