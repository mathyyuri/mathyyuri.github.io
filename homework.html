 if(t.dataset.lock!==undefined){var jl=await call('ac_omr',{p_action:'lock',p_token:S.tok,p_args:{exam_id:S.rows.exam.id,on:t.dataset.lock==='1'}});if(jl&&jl.ok){openRows(S.rows.exam.id);toast(t.dataset.lock==='1'?'잠갔어요':'다시 열었어요')}else toast((jl&&jl.error)||'바꾸지 못했어요');return}
 if(t.dataset.due){var iv=$('#dueIn').value;if(!iv){toast('날짜를 골라 주세요');return}var jd=await api('due',{exam_id:S.rows.exam.id,due:iv+':00+09:00'});if(jd&&jd.ok){toast('마감을 바꿨어요');openRows(S.rows.exam.id)}else toast((jd&&jd.error)||'바꾸지 못했어요');return}
 if(t.dataset.ess!==undefined){var r=S.rows.rows[+t.dataset.ess],vals=S.rows.exam.es.map(function(m,qi){var inp=$('[data-es="'+t.dataset.ess+'_'+qi+'"]');return inp&&inp.value!==''?+inp.value:null});
  var je=await call('ac_omr',{p_action:'es',p_token:S.tok,p_args:{exam_id:S.rows.exam.id,sid:r.sid,es:vals}});toast(je&&je.ok?'저장했어요 (서술형 합계 '+je.es_total+'점)':((je&&je.error)||'저장하지 못했어요'))}});
document.addEventListener('change',function(ev){var t=ev.target;if(t&&t.dataset&&t.dataset.pf){addPhoto(+t.dataset.pf,t.files&&t.files[0]);t.value=''}});
setInterval(function(){var lf=$('#lf');if(lf&&S.ex&&S.view==='solve'&&!closed())lf.textContent='마감 '+kst(S.ex.due)+' · '+left(S.ex.due)},30000);
boot();
</script></body></html>
